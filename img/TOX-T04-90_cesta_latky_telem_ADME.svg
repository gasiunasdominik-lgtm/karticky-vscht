<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 340" width="620" height="340"><style>text{font-family:'IBM Plex Sans',Arial,sans-serif;fill:#0f172a} .s{font-size:13px} .b{font-weight:700}@keyframes fin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}@keyframes draw{from{stroke-dashoffset:var(--L)}to{stroke-dashoffset:0}}.f{opacity:0;animation:fin .6s ease forwards} @keyframes flow{to{stroke-dashoffset:-24}}</style><rect width="620" height="340" rx="14" fill="#ffffff"/><text x="20" y="30" class="b" style="font-size:17px">Cesta látky tělem: A–D–M–E</text><g class="f" style="animation-delay:0.2s"><rect x="30" y="60" width="160" height="66" rx="12" fill="#64748b" fill-opacity=".14" stroke="#64748b" stroke-width="2"/><text x="110" y="88" text-anchor="middle" class="b">vstup</text><text x="110" y="108" text-anchor="middle" class="s">ústa · plíce · kůže</text></g><g class="f" style="animation-delay:0.5s"><rect x="230" y="60" width="160" height="66" rx="12" fill="#dc2626" fill-opacity=".14" stroke="#dc2626" stroke-width="2"/><text x="310" y="88" text-anchor="middle" class="b">krev</text><text x="310" y="108" text-anchor="middle" class="s">rozvod po těle</text></g><g class="f" style="animation-delay:0.8s"><rect x="430" y="60" width="160" height="66" rx="12" fill="#ea580c" fill-opacity=".14" stroke="#ea580c" stroke-width="2"/><text x="510" y="88" text-anchor="middle" class="b">tkáně</text><text x="510" y="108" text-anchor="middle" class="s">tuk · mozek · kosti</text></g><g class="f" style="animation-delay:1.0999999999999999s"><rect x="230" y="190" width="160" height="66" rx="12" fill="#7c3aed" fill-opacity=".14" stroke="#7c3aed" stroke-width="2"/><text x="310" y="218" text-anchor="middle" class="b">játra</text><text x="310" y="238" text-anchor="middle" class="s">přeměna (M)</text></g><g class="f" style="animation-delay:1.4s"><rect x="430" y="190" width="160" height="66" rx="12" fill="#2563eb" fill-opacity=".14" stroke="#2563eb" stroke-width="2"/><text x="510" y="218" text-anchor="middle" class="b">ledviny</text><text x="510" y="238" text-anchor="middle" class="s">ven močí (E)</text></g><path d="M190,93 H228" stroke="#0f172a" stroke-width="3" fill="none" stroke-dasharray="6 6" style="animation:flow .8s linear infinite"/><text x="209" y="148" text-anchor="middle" class="s b f" style="animation-delay:1.8s">A absorpce</text><path d="M390,93 H428" stroke="#0f172a" stroke-width="3" fill="none" stroke-dasharray="6 6" style="animation:flow .8s linear infinite"/><text x="409" y="148" text-anchor="middle" class="s b f" style="animation-delay:1.8s">D distribuce</text><path d="M310,126 V188" stroke="#0f172a" stroke-width="3" fill="none" stroke-dasharray="6 6" style="animation:flow .8s linear infinite"/><path d="M390,223 H428" stroke="#0f172a" stroke-width="3" fill="none" stroke-dasharray="6 6" style="animation:flow .8s linear infinite"/><text x="30" y="300" class="s f" style="animation-delay:2s">Při požití jde krev ze střeva nejdřív do jater (first-pass efekt).</text><text x="30" y="320" class="s f" style="animation-delay:2.2s">Lipofilní látky se hromadí v tuku → velký distribuční objem V_D.</text></svg>
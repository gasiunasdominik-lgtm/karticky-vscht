<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 530" width="620" height="530"><style>text{font-family:'IBM Plex Sans',Arial,sans-serif;fill:#0f172a} .s{font-size:13px} .b{font-weight:700} .t{font-size:17px;font-weight:700} .n{font-size:14px}@keyframes fin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}@keyframes mv{from{stroke-dashoffset:18}to{stroke-dashoffset:0}}.f{opacity:0;animation:fin .6s ease forwards} .fl{stroke-dasharray:11 7;animation:mv .9s linear infinite}</style><rect width="620" height="530" rx="14" fill="#ffffff"/><text x="20" y="32" class="t" text-anchor="start">Fluidní katalytické krakování (FCC)</text><g class="f" style="animation-delay:0.1s"><path d="M85.0,62.0 L85.0,120.0" fill="none" stroke="#92400e" stroke-opacity=".25" stroke-width="3.2"/><path d="M85.0,62.0 L85.0,120.0" class="fl" fill="none" stroke="#92400e" stroke-width="3.2"/><path d="M85.0,128.0 L80.5,118.0 L89.5,118.0 Z" fill="#92400e"/><text x="20" y="56" class="s" text-anchor="start" style="fill:#92400e">vakuový destilát</text></g><g class="f" style="animation-delay:0.2s"><rect x="20" y="130" width="130" height="60" rx="10" fill="#dc2626" fill-opacity=".13" stroke="#dc2626" stroke-width="2"/><text x="85.0" y="156.5" text-anchor="middle" class="b" style="font-size:14px">Trubková pec</text><text x="85.0" y="173.5" text-anchor="middle" class="s">ohřev nástřiku</text></g><g class="f" style="animation-delay:0.4s"><path d="M152.0,160.0 L170.0,160.0" fill="none" stroke="#92400e" stroke-opacity=".25" stroke-width="3.2"/><path d="M152.0,160.0 L170.0,160.0" class="fl" fill="none" stroke="#92400e" stroke-width="3.2"/><path d="M178.0,160.0 L168.0,164.5 L168.0,155.5 Z" fill="#92400e"/></g><g class="f" style="animation-delay:0.5s"><rect x="180" y="100" width="150" height="120" rx="10" fill="#ea580c" fill-opacity=".13" stroke="#ea580c" stroke-width="2"/><text x="255.0" y="139.5" text-anchor="middle" class="b" style="font-size:14px">Reaktor</text><text x="255.0" y="156.5" text-anchor="middle" class="s">500–550 °C</text><text x="255.0" y="173.5" text-anchor="middle" class="s">0,2–0,3 MPa</text><text x="255.0" y="190.5" text-anchor="middle" class="s">zeolit, fluidní</text></g><g class="f" style="animation-delay:0.7s"><rect x="440" y="100" width="160" height="120" rx="10" fill="#7c3aed" fill-opacity=".13" stroke="#7c3aed" stroke-width="2"/><text x="520.0" y="139.5" text-anchor="middle" class="b" style="font-size:14px">Regenerátor</text><text x="520.0" y="156.5" text-anchor="middle" class="s">650–800 °C</text><text x="520.0" y="173.5" text-anchor="middle" class="s">koks shoří</text><text x="520.0" y="190.5" text-anchor="middle" class="s">→ CO₂ + teplo</text></g><g class="f" style="animation-delay:1.0s"><path d="M332.0,130.0 L430.0,130.0" fill="none" stroke="#0f172a" stroke-opacity=".25" stroke-width="3.2"/><path d="M332.0,130.0 L430.0,130.0" class="fl" fill="none" stroke="#0f172a" stroke-width="3.2"/><path d="M438.0,130.0 L428.0,134.5 L428.0,125.5 Z" fill="#0f172a"/><text x="385" y="122" class="s" text-anchor="middle" style="fill:#0f172a">kat. + koks</text></g><g class="f" style="animation-delay:1.2s"><path d="M438.0,190.0 L340.0,190.0" fill="none" stroke="#0d9488" stroke-opacity=".25" stroke-width="3.2"/><path d="M438.0,190.0 L340.0,190.0" class="fl" fill="none" stroke="#0d9488" stroke-width="3.2"/><path d="M332.0,190.0 L342.0,185.5 L342.0,194.5 Z" fill="#0d9488"/><text x="385" y="182" class="s" text-anchor="middle" style="fill:#0d9488">čistý kat.</text></g><g class="f" style="animation-delay:1.2s"><text x="385" y="210" class="s" text-anchor="middle" style="fill:#64748b">(cirkuluje)</text></g><g class="f" style="animation-delay:1.4s"><path d="M520.0,290.0 L520.0,230.0" fill="none" stroke="#0284c7" stroke-opacity=".25" stroke-width="3.2"/><path d="M520.0,290.0 L520.0,230.0" class="fl" fill="none" stroke="#0284c7" stroke-width="3.2"/><path d="M520.0,222.0 L524.5,232.0 L515.5,232.0 Z" fill="#0284c7"/><text x="528" y="284" class="s" text-anchor="start" style="fill:#0284c7">vzduch</text></g><g class="f" style="animation-delay:1.5s"><path d="M520.0,98.0 L520.0,66.0" fill="none" stroke="#64748b" stroke-opacity=".25" stroke-width="3.2"/><path d="M520.0,98.0 L520.0,66.0" class="fl" fill="none" stroke="#64748b" stroke-width="3.2"/><path d="M520.0,58.0 L524.5,68.0 L515.5,68.0 Z" fill="#64748b"/><text x="528" y="72" class="s" text-anchor="start" style="fill:#64748b">spaliny CO₂</text></g><g class="f" style="animation-delay:1.7s"><path d="M255.0,222.0 L255.0,260.0 L145.0,260.0 L145.0,290.0" fill="none" stroke="#ea580c" stroke-opacity=".25" stroke-width="3.2"/><path d="M255.0,222.0 L255.0,260.0 L145.0,260.0 L145.0,290.0" class="fl" fill="none" stroke="#ea580c" stroke-width="3.2"/><path d="M145.0,298.0 L140.5,288.0 L149.5,288.0 Z" fill="#ea580c"/><text x="262" y="252" class="s" text-anchor="start" style="fill:#ea580c">páry produktů</text></g><g class="f" style="animation-delay:1.9s"><rect x="20" y="300" width="250" height="96" rx="10" fill="#2563eb" fill-opacity=".13" stroke="#2563eb" stroke-width="2"/><text x="145.0" y="344.5" text-anchor="middle" class="b" style="font-size:14px">Frakční kolona</text><text x="145.0" y="361.5" text-anchor="middle" class="s">dělí podle bodu varu</text></g><g class="f" style="animation-delay:2.1s"><path d="M272.0,314.0 L322.0,314.0" fill="none" stroke="#64748b" stroke-opacity=".25" stroke-width="3.2"/><path d="M272.0,314.0 L322.0,314.0" class="fl" fill="none" stroke="#64748b" stroke-width="3.2"/><path d="M330.0,314.0 L320.0,318.5 L320.0,309.5 Z" fill="#64748b"/><text x="336" y="319" class="s" text-anchor="start" style="fill:#64748b">plyny C₁–C₄ · 14 %</text></g><g class="f" style="animation-delay:2.3000000000000003s"><path d="M272.0,338.0 L322.0,338.0" fill="none" stroke="#16a34a" stroke-opacity=".25" stroke-width="3.2"/><path d="M272.0,338.0 L322.0,338.0" class="fl" fill="none" stroke="#16a34a" stroke-width="3.2"/><path d="M330.0,338.0 L320.0,342.5 L320.0,333.5 Z" fill="#16a34a"/><text x="336" y="343" class="s" text-anchor="start" style="fill:#16a34a">benzín · 40 %</text></g><g class="f" style="animation-delay:2.5s"><path d="M272.0,362.0 L322.0,362.0" fill="none" stroke="#ca8a04" stroke-opacity=".25" stroke-width="3.2"/><path d="M272.0,362.0 L322.0,362.0" class="fl" fill="none" stroke="#ca8a04" stroke-width="3.2"/><path d="M330.0,362.0 L320.0,366.5 L320.0,357.5 Z" fill="#ca8a04"/><text x="336" y="367" class="s" text-anchor="start" style="fill:#ca8a04">střední destiláty · 33 %</text></g><g class="f" style="animation-delay:2.7s"><path d="M272.0,386.0 L322.0,386.0" fill="none" stroke="#92400e" stroke-opacity=".25" stroke-width="3.2"/><path d="M272.0,386.0 L322.0,386.0" class="fl" fill="none" stroke="#92400e" stroke-width="3.2"/><path d="M330.0,386.0 L320.0,390.5 L320.0,381.5 Z" fill="#92400e"/><text x="336" y="391" class="s" text-anchor="start" style="fill:#92400e">těžký topný olej · 8 %</text></g><g class="f" style="animation-delay:3.0s"><rect x="20" y="414" width="580" height="102" rx="10" fill="#7c3aed" fill-opacity=".07" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="5 4"/><text x="32" y="435" class="b" style="font-size:14px;fill:#7c3aed">Proč reaktor + regenerátor</text><text x="32" y="454" class="s">Koks (5 %) se usazuje na katalyzátoru a deaktivuje ho →</text><text x="32" y="472" class="s">katalyzátor nepřetržitě obíhá do regenerátoru, kde se koks spálí.</text><text x="32" y="490" class="s">Teplo ze spalování ohřeje katalyzátor a ten nese teplo do reaktoru.</text><text x="32" y="508" class="s">Mechanismus: karbeniový iont (kyselý alumosilikát), ne radikály.</text></g></svg>
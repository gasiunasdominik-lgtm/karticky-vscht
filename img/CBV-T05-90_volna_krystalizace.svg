<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 389" width="620" height="389"><style>text{font-family:'IBM Plex Sans',Arial,sans-serif;fill:#0f172a} .s{font-size:13px} .t{font-size:11.5px} .b{font-weight:700} .h{font-size:17px;font-weight:700}@keyframes fin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}@keyframes draw{from{stroke-dashoffset:var(--L)}to{stroke-dashoffset:0}}@keyframes flow{to{stroke-dashoffset:-24}}.f{opacity:0;animation:fin .6s ease forwards}</style><rect width="620" height="389" rx="14" fill="#ffffff"/><text x="20" y="30" class="h">Volná krystalizace: 4 proudy</text><g class="f" style="animation-delay:0.20s"><rect x="20.0" y="52" width="166.66666666666666" height="64" rx="10" fill="#2563eb" fill-opacity=".14" stroke="#2563eb" stroke-width="2"/><text x="103" y="80" text-anchor="middle" class="s b">1 výchozí roztok</text><text x="103" y="96" text-anchor="middle" class="t">m₁, w známe</text></g><g class="f" style="animation-delay:0.45s"><rect x="226.66666666666666" y="52" width="166.66666666666666" height="64" rx="10" fill="#ea580c" fill-opacity=".14" stroke="#ea580c" stroke-width="2"/><text x="310" y="80" text-anchor="middle" class="s b">odpaření</text><text x="310" y="96" text-anchor="middle" class="t">teplota konstantní</text></g><g class="f" style="animation-delay:0.70s"><rect x="433.3333333333333" y="52" width="166.66666666666666" height="64" rx="10" fill="#64748b" fill-opacity=".14" stroke="#64748b" stroke-width="2"/><text x="517" y="80" text-anchor="middle" class="s b">2 odpařená voda</text><text x="517" y="96" text-anchor="middle" class="t">w = 0</text></g><g class="f" style="animation-delay:0.95s"><rect x="433.3333333333333" y="162" width="166.66666666666666" height="64" rx="10" fill="#16a34a" fill-opacity=".14" stroke="#16a34a" stroke-width="2"/><text x="517" y="190" text-anchor="middle" class="s b">3 krystaly</text><text x="517" y="206" text-anchor="middle" class="t">w = 1</text></g><g class="f" style="animation-delay:1.20s"><rect x="433.3333333333333" y="272" width="166.66666666666666" height="64" rx="10" fill="#7c3aed" fill-opacity=".14" stroke="#7c3aed" stroke-width="2"/><text x="517" y="300" text-anchor="middle" class="s b">4 zbylý roztok</text><text x="517" y="316" text-anchor="middle" class="t">vždy nasycený</text></g><g class="f" style="animation-delay:1.20s"><line x1="187" y1="84" x2="227" y2="84" stroke="#0f172a" stroke-width="2.4" style="stroke-dasharray:6 6;animation:flow .8s linear infinite"/><path d="M227,84 L218.4,87.5 L218.4,80.5 Z" fill="#0f172a"/></g><g class="f" style="animation-delay:1.20s"><line x1="393" y1="84" x2="433" y2="84" stroke="#0f172a" stroke-width="2.4" style="stroke-dasharray:6 6;animation:flow .8s linear infinite"/><path d="M433,84 L425.0,87.5 L425.0,80.5 Z" fill="#0f172a"/><text x="413" y="78" text-anchor="middle" class="t b" style="fill:#0f172a">pára</text></g><g class="f" style="animation-delay:1.20s"><line x1="310" y1="116" x2="517" y2="162" stroke="#0f172a" stroke-width="2.4" style="stroke-dasharray:6 6;animation:flow .8s linear infinite"/><path d="M517,162 L507.8,163.6 L509.3,156.8 Z" fill="#0f172a"/><text x="413" y="133" text-anchor="middle" class="t b" style="fill:#0f172a">pevná fáze</text></g><g class="f" style="animation-delay:1.20s"><line x1="310" y1="116" x2="517" y2="272" stroke="#0f172a" stroke-width="2.4" style="stroke-dasharray:6 6;animation:flow .8s linear infinite"/><path d="M517,272 L507.9,269.8 L512.2,264.2 Z" fill="#0f172a"/><text x="413" y="188" text-anchor="middle" class="t b" style="fill:#0f172a">kapalina</text></g><text x="20" y="362" class="s f" style="animation-delay:2.0s">m₁ − m₂ = m₃ + m₄, ne jen krystaly.</text></svg>
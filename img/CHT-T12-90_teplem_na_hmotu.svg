<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 389" width="620" height="389"><style>text{font-family:'IBM Plex Sans',Arial,sans-serif;fill:#0f172a} .s{font-size:13px} .t{font-size:11.5px} .b{font-weight:700} .h{font-size:17px;font-weight:700}@keyframes fin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}@keyframes draw{from{stroke-dashoffset:var(--L)}to{stroke-dashoffset:0}}@keyframes flow{to{stroke-dashoffset:-24}}.f{opacity:0;animation:fin .6s ease forwards}</style><rect width="620" height="389" rx="14" fill="#ffffff"/><text x="20" y="30" class="h">Stavební hmoty vznikají teplem</text><g class="f" style="animation-delay:0.20s"><rect x="20.0" y="52" width="115.0" height="64" rx="10" fill="#64748b" fill-opacity=".14" stroke="#64748b" stroke-width="2"/><text x="78" y="72" text-anchor="middle" class="s b">Surovina</text><text x="78" y="88" text-anchor="middle" class="t">jíl, písek,</text><text x="78" y="104" text-anchor="middle" class="t">vápenec, sádrovec</text></g><g class="f" style="animation-delay:0.45s"><rect x="175.0" y="52" width="115.0" height="64" rx="10" fill="#2563eb" fill-opacity=".14" stroke="#2563eb" stroke-width="2"/><text x="232" y="72" text-anchor="middle" class="s b">Úprava</text><text x="232" y="88" text-anchor="middle" class="t">drcení, mletí,</text><text x="232" y="104" text-anchor="middle" class="t">tvarování</text></g><g class="f" style="animation-delay:0.70s"><rect x="330.0" y="52" width="115.0" height="64" rx="10" fill="#dc2626" fill-opacity=".14" stroke="#dc2626" stroke-width="2"/><text x="388" y="72" text-anchor="middle" class="s b">Teplo</text><text x="388" y="88" text-anchor="middle" class="t">výpal, tavba,</text><text x="388" y="104" text-anchor="middle" class="t">pálení</text></g><g class="f" style="animation-delay:0.95s"><rect x="485.0" y="52" width="115.0" height="64" rx="10" fill="#ea580c" fill-opacity=".14" stroke="#ea580c" stroke-width="2"/><text x="542" y="72" text-anchor="middle" class="s b">Keramika</text><text x="542" y="88" text-anchor="middle" class="t">výpal ~900–1200</text><text x="542" y="104" text-anchor="middle" class="t">°C</text></g><g class="f" style="animation-delay:1.20s"><rect x="485.0" y="162" width="115.0" height="64" rx="10" fill="#7c3aed" fill-opacity=".14" stroke="#7c3aed" stroke-width="2"/><text x="542" y="182" text-anchor="middle" class="s b">Sklo</text><text x="542" y="198" text-anchor="middle" class="t">tavba 1400–1600</text><text x="542" y="214" text-anchor="middle" class="t">°C</text></g><g class="f" style="animation-delay:1.45s"><rect x="485.0" y="272" width="115.0" height="64" rx="10" fill="#16a34a" fill-opacity=".14" stroke="#16a34a" stroke-width="2"/><text x="542" y="292" text-anchor="middle" class="s b">Pojivo</text><text x="542" y="308" text-anchor="middle" class="t">vápno, sádra,</text><text x="542" y="324" text-anchor="middle" class="t">cement</text></g><g class="f" style="animation-delay:1.20s"><line x1="135" y1="84" x2="175" y2="84" stroke="#0f172a" stroke-width="2.4" style="stroke-dasharray:6 6;animation:flow .8s linear infinite"/><path d="M175,84 L166.7,87.5 L166.7,80.5 Z" fill="#0f172a"/></g><g class="f" style="animation-delay:1.20s"><line x1="290" y1="84" x2="330" y2="84" stroke="#0f172a" stroke-width="2.4" style="stroke-dasharray:6 6;animation:flow .8s linear infinite"/><path d="M330,84 L321.7,87.5 L321.7,80.5 Z" fill="#0f172a"/></g><g class="f" style="animation-delay:1.20s"><line x1="445" y1="84" x2="485" y2="84" stroke="#0f172a" stroke-width="2.4" style="stroke-dasharray:6 6;animation:flow .8s linear infinite"/><path d="M485,84 L476.7,87.5 L476.7,80.5 Z" fill="#0f172a"/></g><g class="f" style="animation-delay:1.20s"><line x1="388" y1="116" x2="542" y2="162" stroke="#0f172a" stroke-width="2.4" style="stroke-dasharray:6 6;animation:flow .8s linear infinite"/><path d="M542,162 L533.6,163.0 L535.6,156.3 Z" fill="#0f172a"/></g><g class="f" style="animation-delay:1.20s"><line x1="388" y1="116" x2="542" y2="272" stroke="#0f172a" stroke-width="2.4" style="stroke-dasharray:6 6;animation:flow .8s linear infinite"/><path d="M542,272 L534.2,268.6 L539.1,263.6 Z" fill="#0f172a"/></g><text x="20" y="362" class="s f" style="animation-delay:2.0s">Tvaruje se před výpalem, po výpalu je hmota tvrdá a křehká.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 341" width="620" height="341"><style>text{font-family:'IBM Plex Sans',Arial,sans-serif;fill:#0f172a} .s{font-size:13px} .t{font-size:11.5px} .b{font-weight:700} .h{font-size:17px;font-weight:700}@keyframes fin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}@keyframes draw{from{stroke-dashoffset:var(--L)}to{stroke-dashoffset:0}}@keyframes flow{to{stroke-dashoffset:-24}}.f{opacity:0;animation:fin .6s ease forwards}</style><rect width="620" height="341" rx="14" fill="#ffffff"/><text x="20" y="30" class="h">Řád vazby 2. periody</text><text x="20" y="70" class="s b">Be₂</text><rect x="200" y="52" width="330" height="26" rx="6" fill="#f1f5f9"/><rect x="200" y="52" width="0.0" height="26" rx="6" fill="#64748b" fill-opacity=".75" style="transform-origin:200px 0;animation:fin .6s ease 0.20s both"/><text x="206" y="70" class="t b">0 řád vazby</text><text x="20" y="106" class="s b">Li₂</text><rect x="200" y="88" width="330" height="26" rx="6" fill="#f1f5f9"/><rect x="200" y="88" width="110.0" height="26" rx="6" fill="#2563eb" fill-opacity=".75" style="transform-origin:200px 0;animation:fin .6s ease 0.45s both"/><text x="316" y="106" class="t b">1 řád vazby</text><text x="20" y="142" class="s b">F₂</text><rect x="200" y="124" width="330" height="26" rx="6" fill="#f1f5f9"/><rect x="200" y="124" width="110.0" height="26" rx="6" fill="#2563eb" fill-opacity=".75" style="transform-origin:200px 0;animation:fin .6s ease 0.70s both"/><text x="316" y="142" class="t b">1 řád vazby</text><text x="20" y="178" class="s b">O₂</text><rect x="200" y="160" width="330" height="26" rx="6" fill="#f1f5f9"/><rect x="200" y="160" width="220.0" height="26" rx="6" fill="#ea580c" fill-opacity=".75" style="transform-origin:200px 0;animation:fin .6s ease 0.95s both"/><text x="426" y="178" class="t b">2 řád vazby</text><text x="20" y="214" class="s b">C₂</text><rect x="200" y="196" width="330" height="26" rx="6" fill="#f1f5f9"/><rect x="200" y="196" width="220.0" height="26" rx="6" fill="#ea580c" fill-opacity=".75" style="transform-origin:200px 0;animation:fin .6s ease 1.20s both"/><text x="426" y="214" class="t b">2 řád vazby</text><text x="20" y="250" class="s b">BF⁺</text><rect x="200" y="232" width="330" height="26" rx="6" fill="#f1f5f9"/><rect x="200" y="232" width="275.0" height="26" rx="6" fill="#7c3aed" fill-opacity=".75" style="transform-origin:200px 0;animation:fin .6s ease 1.45s both"/><text x="481" y="250" class="t b">2,5 řád vazby</text><text x="20" y="286" class="s b">N₂</text><rect x="200" y="268" width="330" height="26" rx="6" fill="#f1f5f9"/><rect x="200" y="268" width="330.0" height="26" rx="6" fill="#16a34a" fill-opacity=".75" style="transform-origin:200px 0;animation:fin .6s ease 1.70s both"/><text x="536" y="286" class="t b">3 řád vazby</text><text x="20" y="314" class="s f" style="animation-delay:2.0s">O₂ a BF⁺ mají nepárové elektrony (paramagnetické).</text></svg>
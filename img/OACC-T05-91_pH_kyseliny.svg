<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 187" width="620" height="187"><style>text{font-family:'IBM Plex Sans',Arial,sans-serif;fill:#0f172a} .s{font-size:13px} .t{font-size:11.5px} .b{font-weight:700} .h{font-size:17px;font-weight:700}@keyframes fin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}@keyframes draw{from{stroke-dashoffset:var(--L)}to{stroke-dashoffset:0}}@keyframes flow{to{stroke-dashoffset:-24}}.f{opacity:0;animation:fin .6s ease forwards}</style><rect width="620" height="187" rx="14" fill="#ffffff"/><text x="20" y="30" class="h">pH silné kyseliny</text><g class="f" style="animation-delay:0.20s"><rect x="20.0" y="52" width="177.33333333333334" height="74" rx="10" fill="#2563eb" fill-opacity=".14" stroke="#2563eb" stroke-width="2"/><text x="109" y="85" text-anchor="middle" class="s b">c(kyseliny)</text><text x="109" y="101" text-anchor="middle" class="t">= c(H₃O⁺)</text></g><g class="f" style="animation-delay:0.40s"><line x1="199" y1="89" x2="219" y2="89" stroke="#64748b" stroke-width="2.4" style="--L:20;stroke-dasharray:20;animation:draw .5s ease 0.40s both"/><path d="M219,89 L211.0,92.5 L211.0,85.5 Z" fill="#64748b"/></g><g class="f" style="animation-delay:0.60s"><rect x="221.33333333333334" y="52" width="177.33333333333334" height="74" rx="10" fill="#ea580c" fill-opacity=".14" stroke="#ea580c" stroke-width="2"/><text x="310" y="85" text-anchor="middle" class="s b">změna c</text><text x="310" y="101" text-anchor="middle" class="t">ředění, smísení</text></g><g class="f" style="animation-delay:0.80s"><line x1="401" y1="89" x2="421" y2="89" stroke="#64748b" stroke-width="2.4" style="--L:20;stroke-dasharray:20;animation:draw .5s ease 0.80s both"/><path d="M421,89 L412.4,92.5 L412.4,85.5 Z" fill="#64748b"/></g><g class="f" style="animation-delay:1.00s"><rect x="422.6666666666667" y="52" width="177.33333333333334" height="74" rx="10" fill="#16a34a" fill-opacity=".14" stroke="#16a34a" stroke-width="2"/><text x="511" y="85" text-anchor="middle" class="s b">pH = −log c</text><text x="511" y="101" text-anchor="middle" class="t">nový výsledek</text></g><text x="20" y="160" class="s f" style="animation-delay:2.0s">Ředěním nad pH 7 se nedostaneš; průměruj c, ne pH.</text></svg>
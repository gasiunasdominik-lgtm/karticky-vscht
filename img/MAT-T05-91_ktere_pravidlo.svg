<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 388" width="620" height="388"><style>text{font-family:'IBM Plex Sans',Arial,sans-serif;fill:#0f172a} .s{font-size:13px} .b{font-weight:700} .m{font-size:15px;font-style:italic}@keyframes fin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}@keyframes draw{from{stroke-dashoffset:var(--L)}to{stroke-dashoffset:0}}@keyframes loop2{0%{opacity:0}3%{opacity:1}47.0%{opacity:1}50.0%{opacity:0}100%{opacity:0}}@keyframes loop3{0%{opacity:0}3%{opacity:1}30.3%{opacity:1}33.3%{opacity:0}100%{opacity:0}}@keyframes loop4{0%{opacity:0}3%{opacity:1}22.0%{opacity:1}25.0%{opacity:0}100%{opacity:0}}@keyframes loop5{0%{opacity:0}3%{opacity:1}17.0%{opacity:1}20.0%{opacity:0}100%{opacity:0}}@keyframes loop6{0%{opacity:0}3%{opacity:1}13.7%{opacity:1}16.7%{opacity:0}100%{opacity:0}}@keyframes stay{0%{opacity:0}4%{opacity:1}92%{opacity:1}100%{opacity:0}}.f{opacity:0;animation:fin .6s ease forwards} .q{opacity:0} </style><rect width="620" height="388" rx="14" fill="#ffffff"/><text x="20" y="30" class="b" style="font-size:17px">Jak zderivovat výraz? Najdi POSLEDNÍ operaci.</text><g class="f" style="animation-delay:0.3s"><rect x="20" y="48" width="170" height="50" rx="10" fill="#64748b" fill-opacity=".14" stroke="#64748b" stroke-width="2"/><text x="105.0" y="69" text-anchor="middle" class="b">součet / rozdíl</text></g><g class="f" style="animation-delay:0.55s"><line x1="192" y1="73" x2="226" y2="73" stroke="#16a34a" stroke-width="2.4" style="--L:34;stroke-dasharray:34;animation:draw .5s ease 0.55s both"/><path d="M226,73 L217.7,76.5 L217.7,69.5 Z" fill="#16a34a"/></g><g class="f" style="animation-delay:0.7s"><rect x="228" y="48" width="372" height="50" rx="10" fill="#16a34a" fill-opacity=".14" stroke="#16a34a" stroke-width="2"/><text x="414.0" y="69" text-anchor="middle" class="b">(f ± g)′ = f′ ± g′</text><text x="414.0" y="86" text-anchor="middle" class="s">(x³ − sin x)′ = 3x² − cos x</text></g><g class="f" style="animation-delay:0.8500000000000001s"><rect x="20" y="110" width="170" height="50" rx="10" fill="#64748b" fill-opacity=".14" stroke="#64748b" stroke-width="2"/><text x="105.0" y="131" text-anchor="middle" class="b">konstanta krát</text></g><g class="f" style="animation-delay:1.1s"><line x1="192" y1="135" x2="226" y2="135" stroke="#16a34a" stroke-width="2.4" style="--L:34;stroke-dasharray:34;animation:draw .5s ease 1.1s both"/><path d="M226,135 L217.7,138.5 L217.7,131.5 Z" fill="#16a34a"/></g><g class="f" style="animation-delay:1.25s"><rect x="228" y="110" width="372" height="50" rx="10" fill="#16a34a" fill-opacity=".14" stroke="#16a34a" stroke-width="2"/><text x="414.0" y="131" text-anchor="middle" class="b">(k·f)′ = k·f′</text><text x="414.0" y="148" text-anchor="middle" class="s">(5 ln x)′ = 5/x</text></g><g class="f" style="animation-delay:1.4000000000000001s"><rect x="20" y="172" width="170" height="50" rx="10" fill="#64748b" fill-opacity=".14" stroke="#64748b" stroke-width="2"/><text x="105.0" y="193" text-anchor="middle" class="b">součin</text></g><g class="f" style="animation-delay:1.6500000000000001s"><line x1="192" y1="197" x2="226" y2="197" stroke="#ea580c" stroke-width="2.4" style="--L:34;stroke-dasharray:34;animation:draw .5s ease 1.6500000000000001s both"/><path d="M226,197 L217.7,200.5 L217.7,193.5 Z" fill="#ea580c"/></g><g class="f" style="animation-delay:1.8000000000000003s"><rect x="228" y="172" width="372" height="50" rx="10" fill="#ea580c" fill-opacity=".14" stroke="#ea580c" stroke-width="2"/><text x="414.0" y="193" text-anchor="middle" class="b">(f·g)′ = f′g + fg′</text><text x="414.0" y="210" text-anchor="middle" class="s">(x² eˣ)′ = 2x eˣ + x² eˣ</text></g><g class="f" style="animation-delay:1.9500000000000002s"><rect x="20" y="234" width="170" height="50" rx="10" fill="#64748b" fill-opacity=".14" stroke="#64748b" stroke-width="2"/><text x="105.0" y="255" text-anchor="middle" class="b">podíl</text></g><g class="f" style="animation-delay:2.2s"><line x1="192" y1="259" x2="226" y2="259" stroke="#7c3aed" stroke-width="2.4" style="--L:34;stroke-dasharray:34;animation:draw .5s ease 2.2s both"/><path d="M226,259 L217.7,262.5 L217.7,255.5 Z" fill="#7c3aed"/></g><g class="f" style="animation-delay:2.35s"><rect x="228" y="234" width="372" height="50" rx="10" fill="#7c3aed" fill-opacity=".14" stroke="#7c3aed" stroke-width="2"/><text x="414.0" y="255" text-anchor="middle" class="b">(f/g)′ = (f′g − fg′) / g²</text><text x="414.0" y="272" text-anchor="middle" class="s">(sin x / x)′ = (x cos x − sin x)/x²</text></g><g class="f" style="animation-delay:2.5s"><rect x="20" y="296" width="170" height="50" rx="10" fill="#64748b" fill-opacity=".14" stroke="#64748b" stroke-width="2"/><text x="105.0" y="317" text-anchor="middle" class="b">složená f(g(x))</text></g><g class="f" style="animation-delay:2.75s"><line x1="192" y1="321" x2="226" y2="321" stroke="#2563eb" stroke-width="2.4" style="--L:34;stroke-dasharray:34;animation:draw .5s ease 2.75s both"/><path d="M226,321 L217.7,324.5 L217.7,317.5 Z" fill="#2563eb"/></g><g class="f" style="animation-delay:2.9s"><rect x="228" y="296" width="372" height="50" rx="10" fill="#2563eb" fill-opacity=".14" stroke="#2563eb" stroke-width="2"/><text x="414.0" y="317" text-anchor="middle" class="b">f′(g(x)) · g′(x)</text><text x="414.0" y="334" text-anchor="middle" class="s">(sin x²)′ = cos x² · 2x</text></g><text x="20.0" y="370.0" class="s f" style="animation-delay:3.3s">Uvnitř pak opakuj totéž pro f a g. Nakonec dosaď derivace z tabulky.</text></svg>
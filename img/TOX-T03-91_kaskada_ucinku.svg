<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 328" width="620" height="328"><style>text{font-family:'IBM Plex Sans',Arial,sans-serif;fill:#0f172a} .s{font-size:13px} .b{font-weight:700}@keyframes fin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}@keyframes draw{from{stroke-dashoffset:var(--L)}to{stroke-dashoffset:0}}.f{opacity:0;animation:fin .6s ease forwards} </style><rect width="620" height="328" rx="14" fill="#ffffff"/><text x="20" y="30" class="b" style="font-size:17px">Jak se z jedné vazby stane otrava: 4 úrovně účinku</text><g class="f" style="animation-delay:0.3s"><rect x="20" y="50" width="460" height="50" rx="10" fill="#2563eb" fill-opacity=".14" stroke="#2563eb" stroke-width="2"/><text x="36" y="72" class="b">molekula</text><text x="36" y="90" class="s">vazba na receptor, enzym, DNA, –SH</text></g><text x="520" y="102" class="b f" style="fill:#2563eb;animation-delay:0.6s;font-size:20px">↓</text><g class="f" style="animation-delay:0.8s"><rect x="50" y="112" width="430" height="50" rx="10" fill="#7c3aed" fill-opacity=".14" stroke="#7c3aed" stroke-width="2"/><text x="66" y="134" class="b">buňka</text><text x="66" y="152" class="s">chybí ATP, poškozená membrána</text></g><text x="520" y="164" class="b f" style="fill:#7c3aed;animation-delay:1.1s;font-size:20px">↓</text><g class="f" style="animation-delay:1.3s"><rect x="80" y="174" width="400" height="50" rx="10" fill="#ea580c" fill-opacity=".14" stroke="#ea580c" stroke-width="2"/><text x="96" y="196" class="b">tkáň / orgán</text><text x="96" y="214" class="s">odumírá tkáň, selhává orgán</text></g><text x="520" y="226" class="b f" style="fill:#ea580c;animation-delay:1.6s;font-size:20px">↓</text><g class="f" style="animation-delay:1.8s"><rect x="110" y="236" width="370" height="50" rx="10" fill="#dc2626" fill-opacity=".14" stroke="#dc2626" stroke-width="2"/><text x="126" y="258" class="b">organismus</text><text x="126" y="276" class="s">příznaky otravy, smrt</text></g><text x="20" y="310" class="s f" style="animation-delay:2.4s">Příklad – kyanid: blok cytochrom c oxidázy → buňka nevyužije O₂ → mozek a srdce selhávají první</text></svg>
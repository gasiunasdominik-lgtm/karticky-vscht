<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 214" width="620" height="214"><style>text{font-family:'IBM Plex Sans',Arial,sans-serif;fill:#0f172a} .s{font-size:13px} .b{font-weight:700}@keyframes fin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}@keyframes draw{from{stroke-dashoffset:var(--L)}to{stroke-dashoffset:0}}.f{opacity:0;animation:fin .6s ease forwards} </style><rect width="620" height="214" rx="14" fill="#ffffff"/><text x="20" y="30" class="b" style="font-size:17px">Biotransformace: z látky „do tuku“ látka „do vody“</text><g class="f" style="animation-delay:0.2s"><rect x="20" y="60" width="132" height="70" rx="12" fill="#ea580c" fill-opacity=".15" stroke="#ea580c" stroke-width="2"/><text x="86" y="88" text-anchor="middle" class="b">lipofilní látka</text><text x="86" y="110" text-anchor="middle" style="font-size:11px">zůstává v tuku</text></g><text x="156" y="102" class="b f" style="animation-delay:0.4s;font-size:18px;fill:#64748b">→</text><g class="f" style="animation-delay:0.65s"><rect x="170" y="60" width="132" height="70" rx="12" fill="#7c3aed" fill-opacity=".15" stroke="#7c3aed" stroke-width="2"/><text x="236" y="88" text-anchor="middle" class="b">fáze I</text><text x="236" y="110" text-anchor="middle" style="font-size:11px">CYP450: přidá –OH</text></g><text x="306" y="102" class="b f" style="animation-delay:0.8500000000000001s;font-size:18px;fill:#64748b">→</text><g class="f" style="animation-delay:1.1s"><rect x="320" y="60" width="132" height="70" rx="12" fill="#2563eb" fill-opacity=".15" stroke="#2563eb" stroke-width="2"/><text x="386" y="88" text-anchor="middle" class="b">fáze II</text><text x="386" y="110" text-anchor="middle" style="font-size:11px">konjugace (glukuronid…)</text></g><text x="456" y="102" class="b f" style="animation-delay:1.3s;font-size:18px;fill:#64748b">→</text><g class="f" style="animation-delay:1.55s"><rect x="470" y="60" width="132" height="70" rx="12" fill="#16a34a" fill-opacity=".15" stroke="#16a34a" stroke-width="2"/><text x="536" y="88" text-anchor="middle" class="b">hydrofilní</text><text x="536" y="110" text-anchor="middle" style="font-size:11px">ven močí / žlučí</text></g><g class="f" style="animation-delay:2.2s"><rect x="110" y="150" width="400" height="44" rx="10" fill="#dc2626" fill-opacity=".12" stroke="#dc2626" stroke-dasharray="5 4"/><text x="310" y="177" text-anchor="middle" class="s b" style="fill:#dc2626">pozor: fáze I někdy vyrobí TOXIČTĚJŠÍ látku (aktivace)</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 250" width="620" height="250"><style>text{font-family:'IBM Plex Sans',Arial,sans-serif;fill:#0f172a} .s{font-size:13px} .t{font-size:11.5px} .b{font-weight:700} .h{font-size:17px;font-weight:700}@keyframes fin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}@keyframes draw{from{stroke-dashoffset:var(--L)}to{stroke-dashoffset:0}}@keyframes flow{to{stroke-dashoffset:-24}}.f{opacity:0;animation:fin .6s ease forwards}</style><rect width="620" height="250" rx="14" fill="#ffffff"/><text x="20" y="30" class="h">Oktanové vs. cetanové číslo</text><g class="f" style="animation-delay:0.10s"><rect x="20" y="50" width="193" height="30" fill="#e2e8f0" stroke="#cbd5e1"/><text x="28" y="70" class="s b"></text><rect x="213" y="50" width="193" height="30" fill="#e2e8f0" stroke="#cbd5e1"/><text x="221" y="70" class="s b">Oktanové (OČ)</text><rect x="407" y="50" width="193" height="30" fill="#e2e8f0" stroke="#cbd5e1"/><text x="415" y="70" class="s b">Cetanové (CČ)</text></g><g class="f" style="animation-delay:0.25s"><rect x="20" y="80" width="193" height="30" fill="#ffffff" stroke="#cbd5e1"/><text x="28" y="100" class="s">palivo</text><rect x="213" y="80" width="193" height="30" fill="#ffffff" stroke="#cbd5e1"/><text x="221" y="100" class="s">benzín</text><rect x="407" y="80" width="193" height="30" fill="#ffffff" stroke="#cbd5e1"/><text x="415" y="100" class="s">motorová nafta</text></g><g class="f" style="animation-delay:0.40s"><rect x="20" y="110" width="193" height="30" fill="#ffffff" stroke="#cbd5e1"/><text x="28" y="130" class="s">motor</text><rect x="213" y="110" width="193" height="30" fill="#ffffff" stroke="#cbd5e1"/><text x="221" y="130" class="s">zážehový</text><rect x="407" y="110" width="193" height="30" fill="#ffffff" stroke="#cbd5e1"/><text x="415" y="130" class="s">vznětový</text></g><g class="f" style="animation-delay:0.55s"><rect x="20" y="140" width="193" height="30" fill="#fef3c7" stroke="#cbd5e1"/><text x="28" y="160" class="s">měří</text><rect x="213" y="140" width="193" height="30" fill="#fef3c7" stroke="#cbd5e1"/><text x="221" y="160" class="s">odolnost proti samovznícení</text><rect x="407" y="140" width="193" height="30" fill="#fef3c7" stroke="#cbd5e1"/><text x="415" y="160" class="s">ochotu se samovznítit</text></g><g class="f" style="animation-delay:0.70s"><rect x="20" y="170" width="193" height="30" fill="#ffffff" stroke="#cbd5e1"/><text x="28" y="190" class="s">100</text><rect x="213" y="170" width="193" height="30" fill="#ffffff" stroke="#cbd5e1"/><text x="221" y="190" class="s">izooktan</text><rect x="407" y="170" width="193" height="30" fill="#ffffff" stroke="#cbd5e1"/><text x="415" y="190" class="s">n-hexadekan</text></g><g class="f" style="animation-delay:0.85s"><rect x="20" y="200" width="193" height="30" fill="#ffffff" stroke="#cbd5e1"/><text x="28" y="220" class="s">0</text><rect x="213" y="200" width="193" height="30" fill="#ffffff" stroke="#cbd5e1"/><text x="221" y="220" class="s">n-heptan</text><rect x="407" y="200" width="193" height="30" fill="#ffffff" stroke="#cbd5e1"/><text x="415" y="220" class="s">1-metylnaftalen</text></g></svg>
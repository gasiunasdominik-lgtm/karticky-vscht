<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380" width="620" height="380"><style>text{font-family:'IBM Plex Sans',Arial,sans-serif;fill:#0f172a} .s{font-size:13px} .b{font-weight:700} .m{font-size:15px;font-style:italic}@keyframes fin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}@keyframes draw{from{stroke-dashoffset:var(--L)}to{stroke-dashoffset:0}}@keyframes loop2{0%{opacity:0}3%{opacity:1}47.0%{opacity:1}50.0%{opacity:0}100%{opacity:0}}@keyframes loop3{0%{opacity:0}3%{opacity:1}30.3%{opacity:1}33.3%{opacity:0}100%{opacity:0}}@keyframes loop4{0%{opacity:0}3%{opacity:1}22.0%{opacity:1}25.0%{opacity:0}100%{opacity:0}}@keyframes loop5{0%{opacity:0}3%{opacity:1}17.0%{opacity:1}20.0%{opacity:0}100%{opacity:0}}@keyframes loop6{0%{opacity:0}3%{opacity:1}13.7%{opacity:1}16.7%{opacity:0}100%{opacity:0}}@keyframes stay{0%{opacity:0}4%{opacity:1}92%{opacity:1}100%{opacity:0}}.f{opacity:0;animation:fin .6s ease forwards} .q{opacity:0} </style><rect width="620" height="380" rx="14" fill="#ffffff"/><text x="20" y="30" class="b" style="font-size:17px">Definiční obor: každá „nebezpečná“ operace = 1 podmínka</text><g class="f" style="animation-delay:0.3s"><rect x="20" y="50" width="290" height="42" rx="10" fill="#dc2626" fill-opacity=".14" stroke="#dc2626" stroke-width="2"/><text x="165.0" y="71" text-anchor="middle" class="b">zlomek  A / B</text></g><g class="f" style="animation-delay:0.5s"><line x1="312" y1="71" x2="346" y2="71" stroke="#dc2626" stroke-width="2.4" style="--L:34;stroke-dasharray:34;animation:draw .5s ease 0.5s both"/><path d="M346,71 L337.7,74.5 L337.7,67.5 Z" fill="#dc2626"/></g><g class="f" style="animation-delay:0.6s"><rect x="348" y="50" width="252" height="42" rx="10" fill="#dc2626" fill-opacity=".14" stroke="#dc2626" stroke-width="2"/><text x="474.0" y="71" text-anchor="middle" class="b">B ≠ 0</text></g><g class="f" style="animation-delay:0.75s"><rect x="20" y="102" width="290" height="42" rx="10" fill="#2563eb" fill-opacity=".14" stroke="#2563eb" stroke-width="2"/><text x="165.0" y="123" text-anchor="middle" class="b">sudá odmocnina  √A</text></g><g class="f" style="animation-delay:0.95s"><line x1="312" y1="123" x2="346" y2="123" stroke="#2563eb" stroke-width="2.4" style="--L:34;stroke-dasharray:34;animation:draw .5s ease 0.95s both"/><path d="M346,123 L337.7,126.5 L337.7,119.5 Z" fill="#2563eb"/></g><g class="f" style="animation-delay:1.05s"><rect x="348" y="102" width="252" height="42" rx="10" fill="#2563eb" fill-opacity=".14" stroke="#2563eb" stroke-width="2"/><text x="474.0" y="123" text-anchor="middle" class="b">A ≥ 0</text></g><g class="f" style="animation-delay:1.2s"><rect x="20" y="154" width="290" height="42" rx="10" fill="#7c3aed" fill-opacity=".14" stroke="#7c3aed" stroke-width="2"/><text x="165.0" y="175" text-anchor="middle" class="b">logaritmus  ln A, log A</text></g><g class="f" style="animation-delay:1.4s"><line x1="312" y1="175" x2="346" y2="175" stroke="#7c3aed" stroke-width="2.4" style="--L:34;stroke-dasharray:34;animation:draw .5s ease 1.4s both"/><path d="M346,175 L337.7,178.5 L337.7,171.5 Z" fill="#7c3aed"/></g><g class="f" style="animation-delay:1.5s"><rect x="348" y="154" width="252" height="42" rx="10" fill="#7c3aed" fill-opacity=".14" stroke="#7c3aed" stroke-width="2"/><text x="474.0" y="175" text-anchor="middle" class="b">A > 0</text></g><g class="f" style="animation-delay:1.6500000000000001s"><rect x="20" y="206" width="290" height="42" rx="10" fill="#ea580c" fill-opacity=".14" stroke="#ea580c" stroke-width="2"/><text x="165.0" y="227" text-anchor="middle" class="b">arcsin A,  arccos A</text></g><g class="f" style="animation-delay:1.85s"><line x1="312" y1="227" x2="346" y2="227" stroke="#ea580c" stroke-width="2.4" style="--L:34;stroke-dasharray:34;animation:draw .5s ease 1.85s both"/><path d="M346,227 L337.7,230.5 L337.7,223.5 Z" fill="#ea580c"/></g><g class="f" style="animation-delay:1.9500000000000002s"><rect x="348" y="206" width="252" height="42" rx="10" fill="#ea580c" fill-opacity=".14" stroke="#ea580c" stroke-width="2"/><text x="474.0" y="227" text-anchor="middle" class="b">−1 ≤ A ≤ 1</text></g><g class="f" style="animation-delay:2.1s"><rect x="20" y="258" width="290" height="42" rx="10" fill="#0d9488" fill-opacity=".14" stroke="#0d9488" stroke-width="2"/><text x="165.0" y="279" text-anchor="middle" class="b">tg A  (cotg A)</text></g><g class="f" style="animation-delay:2.3000000000000003s"><line x1="312" y1="279" x2="346" y2="279" stroke="#0d9488" stroke-width="2.4" style="--L:34;stroke-dasharray:34;animation:draw .5s ease 2.3000000000000003s both"/><path d="M346,279 L337.7,282.5 L337.7,275.5 Z" fill="#0d9488"/></g><g class="f" style="animation-delay:2.4s"><rect x="348" y="258" width="252" height="42" rx="10" fill="#0d9488" fill-opacity=".14" stroke="#0d9488" stroke-width="2"/><text x="474.0" y="279" text-anchor="middle" class="b">A ≠ π/2 + kπ  (A ≠ kπ)</text></g><g class="f" style="animation-delay:2.8s"><rect x="20" y="314" width="580" height="50" rx="10" fill="#16a34a" fill-opacity=".14" stroke="#16a34a" stroke-width="2"/><text x="310.0" y="335" text-anchor="middle" class="b">D(f) = PRŮNIK všech podmínek</text><text x="310.0" y="352" text-anchor="middle" class="s">vyřeš každou zvlášť, zakresli na osu, vezmi, co splňuje všechny</text></g></svg>
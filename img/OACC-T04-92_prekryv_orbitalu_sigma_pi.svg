<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 466" width="620" height="466"><style>text{font-family:'IBM Plex Sans',Arial,sans-serif;fill:#0f172a} .s{font-size:13px} .b{font-weight:700} .m{font-size:15px;font-style:italic} .t{font-size:17px;font-weight:700} .a{font-size:15px;font-weight:700}@keyframes fin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}@keyframes draw{from{stroke-dashoffset:var(--L)}to{stroke-dashoffset:0}}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}.f{opacity:0;animation:fin .6s ease forwards} .p{animation:pulse 2.4s ease-in-out infinite} </style><rect width="620" height="466" rx="14" fill="#ffffff"/><text x="20.0" y="30.0" class="t" text-anchor="start">Překryv atomových orbitalů podél osy z (spojnice jader)</text><line x1="14" y1="52" x2="606" y2="52" stroke="#e2e8f0"/><text x="20.0" y="74.0" class="a f" text-anchor="start" style="animation-delay:0.3s">2s + 2pz</text><g class="f" style="animation-delay:0.5s"><line x1="70" y1="116" x2="350" y2="116" stroke="#94a3b8" stroke-dasharray="5 4"/><text x="356" y="120" class="s" style="fill:#64748b">z</text><circle cx="150" cy="116" r="24" fill="#2563eb" fill-opacity=".35" stroke="#2563eb" stroke-width="1.6"/><text x="150" y="121" text-anchor="middle" class="b">+</text><ellipse cx="192.0" cy="116.0" rx="22.0" ry="16.0" transform="rotate(180 192.0 116.0)" fill="#2563eb" fill-opacity=".35" stroke="#2563eb" stroke-width="1.6"/><text x="192.0" y="121.0" text-anchor="middle" class="b" style="font-size:14px">+</text><ellipse cx="232.0" cy="116.0" rx="22.0" ry="16.0" transform="rotate(0 232.0 116.0)" fill="#dc2626" fill-opacity=".35" stroke="#dc2626" stroke-width="1.6"/><text x="232.0" y="121.0" text-anchor="middle" class="b" style="font-size:14px">−</text><circle cx="150" cy="116" r="2.5" fill="#0f172a"/><circle cx="212" cy="116" r="2.5" fill="#0f172a"/></g><g class="f" style="animation-delay:1.0s"><rect x="380" y="88" width="222" height="56" rx="10" fill="#16a34a" fill-opacity=".13" stroke="#16a34a" stroke-width="2"/><text x="491.0" y="109" text-anchor="middle" class="b s">σ</text><text x="491.0" y="126" text-anchor="middle" class="s">účinný (laloky na ose)</text></g><line x1="14" y1="172" x2="606" y2="172" stroke="#e2e8f0"/><text x="20.0" y="194.0" class="a f" text-anchor="start" style="animation-delay:1.5s">3px + 3dxz</text><g class="f" style="animation-delay:1.7s"><line x1="70" y1="236" x2="350" y2="236" stroke="#94a3b8" stroke-dasharray="5 4"/><text x="356" y="240" class="s" style="fill:#64748b">z</text><ellipse cx="150.0" cy="220.0" rx="18.0" ry="13.0" transform="rotate(270 150.0 220.0)" fill="#2563eb" fill-opacity=".35" stroke="#2563eb" stroke-width="1.6"/><text x="150.0" y="225.0" text-anchor="middle" class="b" style="font-size:14px">+</text><ellipse cx="150.0" cy="252.0" rx="18.0" ry="13.0" transform="rotate(90 150.0 252.0)" fill="#dc2626" fill-opacity=".35" stroke="#dc2626" stroke-width="1.6"/><text x="150.0" y="257.0" text-anchor="middle" class="b" style="font-size:14px">−</text><ellipse cx="181.4" cy="225.4" rx="17.0" ry="11.0" transform="rotate(225 181.4 225.4)" fill="#2563eb" fill-opacity=".35" stroke="#2563eb" stroke-width="1.6"/><text x="181.4" y="230.4" text-anchor="middle" class="b" style="font-size:14px">+</text><ellipse cx="202.6" cy="225.4" rx="17.0" ry="11.0" transform="rotate(315 202.6 225.4)" fill="#dc2626" fill-opacity=".35" stroke="#dc2626" stroke-width="1.6"/><text x="202.6" y="230.4" text-anchor="middle" class="b" style="font-size:14px">−</text><ellipse cx="202.6" cy="246.6" rx="17.0" ry="11.0" transform="rotate(45 202.6 246.6)" fill="#2563eb" fill-opacity=".35" stroke="#2563eb" stroke-width="1.6"/><text x="202.6" y="251.6" text-anchor="middle" class="b" style="font-size:14px">+</text><ellipse cx="181.4" cy="246.6" rx="17.0" ry="11.0" transform="rotate(135 181.4 246.6)" fill="#dc2626" fill-opacity=".35" stroke="#dc2626" stroke-width="1.6"/><text x="181.4" y="251.6" text-anchor="middle" class="b" style="font-size:14px">−</text><circle cx="150" cy="236" r="2.5" fill="#0f172a"/><circle cx="192" cy="236" r="2.5" fill="#0f172a"/></g><g class="f" style="animation-delay:2.2s"><rect x="380" y="208" width="222" height="56" rx="10" fill="#16a34a" fill-opacity=".13" stroke="#16a34a" stroke-width="2"/><text x="491.0" y="229" text-anchor="middle" class="b s">π</text><text x="491.0" y="246" text-anchor="middle" class="s">účinný (boční, nad a pod osou)</text></g><line x1="14" y1="292" x2="606" y2="292" stroke="#e2e8f0"/><text x="20.0" y="314.0" class="a f" text-anchor="start" style="animation-delay:2.6999999999999997s">2pz + 2px</text><g class="f" style="animation-delay:2.9s"><line x1="70" y1="356" x2="350" y2="356" stroke="#94a3b8" stroke-dasharray="5 4"/><text x="356" y="360" class="s" style="fill:#64748b">z</text><ellipse cx="133.0" cy="356.0" rx="19.0" ry="14.0" transform="rotate(180 133.0 356.0)" fill="#dc2626" fill-opacity=".35" stroke="#dc2626" stroke-width="1.6"/><text x="133.0" y="361.0" text-anchor="middle" class="b" style="font-size:14px">−</text><ellipse cx="167.0" cy="356.0" rx="19.0" ry="14.0" transform="rotate(0 167.0 356.0)" fill="#2563eb" fill-opacity=".35" stroke="#2563eb" stroke-width="1.6"/><text x="167.0" y="361.0" text-anchor="middle" class="b" style="font-size:14px">+</text><ellipse cx="198.0" cy="340.0" rx="18.0" ry="13.0" transform="rotate(270 198.0 340.0)" fill="#2563eb" fill-opacity=".35" stroke="#2563eb" stroke-width="1.6"/><text x="198.0" y="345.0" text-anchor="middle" class="b" style="font-size:14px">+</text><ellipse cx="198.0" cy="372.0" rx="18.0" ry="13.0" transform="rotate(90 198.0 372.0)" fill="#dc2626" fill-opacity=".35" stroke="#dc2626" stroke-width="1.6"/><text x="198.0" y="377.0" text-anchor="middle" class="b" style="font-size:14px">−</text><circle cx="150" cy="356" r="2.5" fill="#0f172a"/><circle cx="198" cy="356" r="2.5" fill="#0f172a"/></g><g class="f" style="animation-delay:3.3999999999999995s"><rect x="380" y="328" width="222" height="56" rx="10" fill="#dc2626" fill-opacity=".13" stroke="#dc2626" stroke-width="2"/><text x="491.0" y="349" text-anchor="middle" class="b s">neúčinný</text><text x="491.0" y="366" text-anchor="middle" class="s">+ a − se vyruší, překryv = 0</text></g><text x="20.0" y="430.0" class="s b f" text-anchor="start" style="animation-delay:4.0s">Pravidlo: oba orbitaly musí mít vůči ose z stejnou symetrii.</text><text x="20.0" y="450.0" class="s f" text-anchor="start" style="fill:#64748b;animation-delay:4.2s">Antivazebný překryv = proti sobě laloky s opačným znaménkem.</text></svg>
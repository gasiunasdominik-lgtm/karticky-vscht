<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 330" width="620" height="330"><style>text{font-family:'IBM Plex Sans',Arial,sans-serif;fill:#0f172a} .s{font-size:13px} .b{font-weight:700} .m{font-size:15px;font-style:italic}@keyframes fin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}@keyframes draw{from{stroke-dashoffset:var(--L)}to{stroke-dashoffset:0}}@keyframes loop2{0%{opacity:0}3%{opacity:1}47.0%{opacity:1}50.0%{opacity:0}100%{opacity:0}}@keyframes loop3{0%{opacity:0}3%{opacity:1}30.3%{opacity:1}33.3%{opacity:0}100%{opacity:0}}@keyframes loop4{0%{opacity:0}3%{opacity:1}22.0%{opacity:1}25.0%{opacity:0}100%{opacity:0}}@keyframes loop5{0%{opacity:0}3%{opacity:1}17.0%{opacity:1}20.0%{opacity:0}100%{opacity:0}}@keyframes loop6{0%{opacity:0}3%{opacity:1}13.7%{opacity:1}16.7%{opacity:0}100%{opacity:0}}@keyframes stay{0%{opacity:0}4%{opacity:1}92%{opacity:1}100%{opacity:0}}.f{opacity:0;animation:fin .6s ease forwards} .q{opacity:0} </style><rect width="620" height="330" rx="14" fill="#ffffff"/><text x="20" y="30" class="b" style="font-size:17px">Složená funkce = linka strojů, inverzní = cesta zpět</text><g class="f" style="animation-delay:0.2s"><rect x="20" y="70" width="90" height="50" rx="10" fill="#64748b" fill-opacity=".14" stroke="#64748b" stroke-width="2"/><text x="65.0" y="91" text-anchor="middle" class="b">x</text><text x="65.0" y="108" text-anchor="middle" class="s">vstup</text></g><g class="f" style="animation-delay:0.5s"><rect x="170" y="62" width="120" height="66" rx="10" fill="#2563eb" fill-opacity=".14" stroke="#2563eb" stroke-width="2"/><text x="230.0" y="83" text-anchor="middle" class="b">stroj g</text><text x="230.0" y="100" text-anchor="middle" class="s">g(x) = 4 − x²</text><text x="230.0" y="117" text-anchor="middle" class="s">x ∈ D(g)</text></g><g class="f" style="animation-delay:1.0s"><rect x="350" y="62" width="120" height="66" rx="10" fill="#dc2626" fill-opacity=".14" stroke="#dc2626" stroke-width="2"/><text x="410.0" y="83" text-anchor="middle" class="b">stroj f</text><text x="410.0" y="100" text-anchor="middle" class="s">f(u) = ln u</text><text x="410.0" y="117" text-anchor="middle" class="s">u ∈ D(f): u > 0</text></g><g class="f" style="animation-delay:1.5s"><rect x="520" y="70" width="80" height="50" rx="10" fill="#16a34a" fill-opacity=".14" stroke="#16a34a" stroke-width="2"/><text x="560.0" y="91" text-anchor="middle" class="b">y</text><text x="560.0" y="108" text-anchor="middle" class="s">výstup</text></g><g class="f" style="animation-delay:0.4s"><line x1="112" y1="95" x2="168" y2="95" stroke="#64748b" stroke-width="2.4" style="--L:56;stroke-dasharray:56;animation:draw .5s ease 0.4s both"/><path d="M168,95 L159.7,98.5 L159.7,91.5 Z" fill="#64748b"/></g><g class="f" style="animation-delay:0.8s"><line x1="292" y1="95" x2="348" y2="95" stroke="#2563eb" stroke-width="2.4" style="--L:56;stroke-dasharray:56;animation:draw .5s ease 0.8s both"/><path d="M348,95 L339.7,98.5 L339.7,91.5 Z" fill="#2563eb"/><text x="326.0" y="91.0" class="s" style="fill:#2563eb">u</text></g><g class="f" style="animation-delay:1.3s"><line x1="472" y1="95" x2="518" y2="95" stroke="#dc2626" stroke-width="2.4" style="--L:46;stroke-dasharray:46;animation:draw .5s ease 1.3s both"/><path d="M518,95 L509.7,98.5 L509.7,91.5 Z" fill="#dc2626"/></g><circle class="np " r="8" fill="#ea580c"><animateMotion dur="4s" repeatCount="indefinite" path="M65,95 L230,95 L410,95 L560,95" keyPoints="0;1;1" keyTimes="0;.85;1" calcMode="linear"/></circle><text x="20.0" y="160.0" class="b f" style="animation-delay:1.8s">(f∘g)(x) = f(g(x)) = ln(4 − x²): nejdřív g, pak f (čti zprava!)</text><text x="20.0" y="182.0" class="s f" style="animation-delay:2.1s">D(f∘g): 4 − x² > 0  →  x ∈ (−2; 2)  … výstup g musí být povolený vstup f</text><g class="f" style="animation-delay:2.6s"><rect x="20" y="210" width="580" height="50" rx="10" fill="#7c3aed" fill-opacity=".14" stroke="#7c3aed" stroke-width="2"/><text x="310.0" y="231" text-anchor="middle" class="b">inverzní f⁻¹: stroj pustím pozpátku  (y → x)</text><text x="310.0" y="248" text-anchor="middle" class="s">jde jen u PROSTÉ funkce: každý výstup patří k jedinému vstupu</text></g><g class="f" style="animation-delay:3.0s"><line x1="560" y1="290" x2="70" y2="290" stroke="#7c3aed" stroke-width="2.4" style="--L:490;stroke-dasharray:490;animation:draw .5s ease 3.0s both"/><path d="M70,290 L78.3,286.5 L78.3,293.5 Z" fill="#7c3aed"/></g><text x="320.0" y="312.0" class="s b f" text-anchor="middle" style="fill:#7c3aed;animation-delay:3.2s">y = eˣ  ⇄  x = ln y      D(f⁻¹) = H(f),   H(f⁻¹) = D(f)</text></svg>
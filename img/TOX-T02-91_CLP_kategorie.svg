<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 230" width="600" height="230"><style>text{font-family:'IBM Plex Sans',Arial,sans-serif;fill:#0f172a} .s{font-size:13px} .b{font-weight:700}@keyframes fin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}@keyframes draw{from{stroke-dashoffset:var(--L)}to{stroke-dashoffset:0}}.f{opacity:0;animation:fin .6s ease forwards} </style><rect width="600" height="230" rx="14" fill="#ffffff"/><text x="20" y="30" class="b" style="font-size:17px">CLP – akutní toxicita orálně: kam patří látka podle LD50</text><g class="f" style="animation-delay:0.3s"><rect x="20" y="60" width="106" height="92" rx="10" fill="#dc2626" fill-opacity=".15" stroke="#dc2626" stroke-width="2"/><text x="73.0" y="86" text-anchor="middle" class="b">kat. 1</text><text x="73.0" y="108" text-anchor="middle" class="s b">≤ 5 mg/kg</text><text x="73.0" y="132" text-anchor="middle" style="font-size:11px">smrt při požití</text></g><g class="f" style="animation-delay:0.6499999999999999s"><rect x="132" y="60" width="106" height="92" rx="10" fill="#ef4444" fill-opacity=".15" stroke="#ef4444" stroke-width="2"/><text x="185.0" y="86" text-anchor="middle" class="b">kat. 2</text><text x="185.0" y="108" text-anchor="middle" class="s b">5–50 mg/kg</text><text x="185.0" y="132" text-anchor="middle" style="font-size:11px">smrt při požití</text></g><g class="f" style="animation-delay:1.0s"><rect x="244" y="60" width="106" height="92" rx="10" fill="#ea580c" fill-opacity=".15" stroke="#ea580c" stroke-width="2"/><text x="297.0" y="86" text-anchor="middle" class="b">kat. 3</text><text x="297.0" y="108" text-anchor="middle" class="s b">50–300 mg/kg</text><text x="297.0" y="132" text-anchor="middle" style="font-size:11px">toxický při požití</text></g><g class="f" style="animation-delay:1.3499999999999999s"><rect x="356" y="60" width="106" height="92" rx="10" fill="#eab308" fill-opacity=".15" stroke="#eab308" stroke-width="2"/><text x="409.0" y="86" text-anchor="middle" class="b">kat. 4</text><text x="409.0" y="108" text-anchor="middle" class="s b">300–2000 mg/kg</text><text x="409.0" y="132" text-anchor="middle" style="font-size:11px">zdraví škodlivý</text></g><g class="f" style="animation-delay:1.7s"><rect x="468" y="60" width="106" height="92" rx="10" fill="#16a34a" fill-opacity=".15" stroke="#16a34a" stroke-width="2"/><text x="521.0" y="86" text-anchor="middle" class="b">mimo</text><text x="521.0" y="108" text-anchor="middle" class="s b">> 2000 mg/kg</text><text x="521.0" y="132" text-anchor="middle" style="font-size:11px">neklasifikuje se</text></g><text x="20" y="180" class="s f" style="animation-delay:2.2s">← toxičtější</text><text x="580" y="180" text-anchor="end" class="s f" style="animation-delay:2.2s">méně toxické →</text><text x="20" y="212" class="s b f" style="animation-delay:2.5s">Příklad: LD50 = 150 mg/kg → leží v intervalu 50–300 → kategorie 3</text></svg>
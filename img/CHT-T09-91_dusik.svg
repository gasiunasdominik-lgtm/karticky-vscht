<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 190" width="620" height="190"><style>text{font-family:'IBM Plex Sans',Arial,sans-serif;fill:#0f172a} .s{font-size:13px} .t{font-size:11.5px} .b{font-weight:700} .h{font-size:17px;font-weight:700}@keyframes fin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}@keyframes draw{from{stroke-dashoffset:var(--L)}to{stroke-dashoffset:0}}@keyframes flow{to{stroke-dashoffset:-24}}.f{opacity:0;animation:fin .6s ease forwards}</style><rect width="620" height="190" rx="14" fill="#ffffff"/><text x="20" y="30" class="h">Tři formy dusíku v hnojivech</text><g class="f" style="animation-delay:0.10s"><rect x="20" y="50" width="145" height="30" fill="#e2e8f0" stroke="#cbd5e1"/><text x="28" y="70" class="s b">Forma</text><rect x="165" y="50" width="145" height="30" fill="#e2e8f0" stroke="#cbd5e1"/><text x="173" y="70" class="s b">Příklad</text><rect x="310" y="50" width="145" height="30" fill="#e2e8f0" stroke="#cbd5e1"/><text x="318" y="70" class="s b">% N</text><rect x="455" y="50" width="145" height="30" fill="#e2e8f0" stroke="#cbd5e1"/><text x="463" y="70" class="s b">Účinek</text></g><g class="f" style="animation-delay:0.25s"><rect x="20" y="80" width="145" height="30" fill="#ffffff" stroke="#cbd5e1"/><text x="28" y="100" class="s">dusičnanová NO3-</text><rect x="165" y="80" width="145" height="30" fill="#ffffff" stroke="#cbd5e1"/><text x="173" y="100" class="s">Ca(NO3)2</text><rect x="310" y="80" width="145" height="30" fill="#ffffff" stroke="#cbd5e1"/><text x="318" y="100" class="s">15–16</text><rect x="455" y="80" width="145" height="30" fill="#ffffff" stroke="#cbd5e1"/><text x="463" y="100" class="s">nejrychlejší</text></g><g class="f" style="animation-delay:0.40s"><rect x="20" y="110" width="145" height="30" fill="#ffffff" stroke="#cbd5e1"/><text x="28" y="130" class="s">amoniakální NH4+</text><rect x="165" y="110" width="145" height="30" fill="#ffffff" stroke="#cbd5e1"/><text x="173" y="130" class="s">NH4NO3</text><rect x="310" y="110" width="145" height="30" fill="#ffffff" stroke="#cbd5e1"/><text x="318" y="130" class="s">35</text><rect x="455" y="110" width="145" height="30" fill="#ffffff" stroke="#cbd5e1"/><text x="463" y="130" class="s">střední</text></g><g class="f" style="animation-delay:0.55s"><rect x="20" y="140" width="145" height="30" fill="#fef3c7" stroke="#cbd5e1"/><text x="28" y="160" class="s">amidická</text><rect x="165" y="140" width="145" height="30" fill="#fef3c7" stroke="#cbd5e1"/><text x="173" y="160" class="s">močovina</text><rect x="310" y="140" width="145" height="30" fill="#fef3c7" stroke="#cbd5e1"/><text x="318" y="160" class="s">46</text><rect x="455" y="140" width="145" height="30" fill="#fef3c7" stroke="#cbd5e1"/><text x="463" y="160" class="s">nejpomalejší</text></g></svg>
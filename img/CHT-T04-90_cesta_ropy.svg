<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 696" width="620" height="696"><style>text{font-family:'IBM Plex Sans',Arial,sans-serif;fill:#0f172a} .s{font-size:13px} .b{font-weight:700} .t{font-size:17px;font-weight:700} .n{font-size:14px}@keyframes fin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}@keyframes mv{from{stroke-dashoffset:18}to{stroke-dashoffset:0}}.f{opacity:0;animation:fin .6s ease forwards} .fl{stroke-dasharray:11 7;animation:mv .9s linear infinite}</style><rect width="620" height="696" rx="14" fill="#ffffff"/><text x="20" y="32" class="t" text-anchor="start">Cesta ropy: z ložiska do destilace</text><text x="310.0" y="70" class="s b" text-anchor="middle" style="fill:#92400e">surová ropa + voda + soli + plyny + písek</text><g class="f" style="animation-delay:0.1s"><path d="M310.0,76.0 L310.0,94.0" fill="none" stroke="#92400e" stroke-opacity=".25" stroke-width="3.2"/><path d="M310.0,76.0 L310.0,94.0" class="fl" fill="none" stroke="#92400e" stroke-width="3.2"/><path d="M310.0,102.0 L305.5,92.0 L314.5,92.0 Z" fill="#92400e"/></g><g class="f" style="animation-delay:0.3s"><rect x="180" y="102" width="260" height="48" rx="10" fill="#0f172a" fill-opacity=".13" stroke="#0f172a" stroke-width="2"/><text x="310.0" y="122.5" text-anchor="middle" class="b" style="font-size:14px">Těžba z vrtu</text><text x="310.0" y="139.5" text-anchor="middle" class="s">vlastní tlak, vhánění plynu, voda, čerpání</text></g><g class="f" style="animation-delay:0.5s"><path d="M14.0,126.0 L170.0,126.0" fill="none" stroke="#0284c7" stroke-opacity=".25" stroke-width="3.2"/><path d="M14.0,126.0 L170.0,126.0" class="fl" fill="none" stroke="#0284c7" stroke-width="3.2"/><path d="M178.0,126.0 L168.0,130.5 L168.0,121.5 Z" fill="#0284c7"/><text x="16" y="118.0" class="s" text-anchor="start" style="fill:#0284c7">plyn / voda do ložiska</text></g><g class="f" style="animation-delay:0.6s"><path d="M310.0,151.0 L310.0,171.0" fill="none" stroke="#92400e" stroke-opacity=".25" stroke-width="3.2"/><path d="M310.0,151.0 L310.0,171.0" class="fl" fill="none" stroke="#92400e" stroke-width="3.2"/><path d="M310.0,179.0 L305.5,169.0 L314.5,169.0 Z" fill="#92400e"/></g><g class="f" style="animation-delay:0.75s"><rect x="180" y="180" width="260" height="48" rx="10" fill="#ca8a04" fill-opacity=".13" stroke="#ca8a04" stroke-width="2"/><text x="310.0" y="200.5" text-anchor="middle" class="b" style="font-size:14px">Separátor plynů</text><text x="310.0" y="217.5" text-anchor="middle" class="s">uvolní se C₁–C₄ a H₂S</text></g><g class="f" style="animation-delay:1.05s"><path d="M442.0,204.0 L598.0,204.0" fill="none" stroke="#ca8a04" stroke-opacity=".25" stroke-width="3.2"/><path d="M442.0,204.0 L598.0,204.0" class="fl" fill="none" stroke="#ca8a04" stroke-width="3.2"/><path d="M606.0,204.0 L596.0,208.5 L596.0,199.5 Z" fill="#ca8a04"/><text x="452" y="196.0" class="s" text-anchor="start" style="fill:#ca8a04">plyn C₁–C₄, H₂S</text></g><g class="f" style="animation-delay:1.05s"><path d="M310.0,229.0 L310.0,249.0" fill="none" stroke="#92400e" stroke-opacity=".25" stroke-width="3.2"/><path d="M310.0,229.0 L310.0,249.0" class="fl" fill="none" stroke="#92400e" stroke-width="3.2"/><path d="M310.0,257.0 L305.5,247.0 L314.5,247.0 Z" fill="#92400e"/></g><g class="f" style="animation-delay:1.2s"><rect x="180" y="258" width="260" height="48" rx="10" fill="#0284c7" fill-opacity=".13" stroke="#0284c7" stroke-width="2"/><text x="310.0" y="278.5" text-anchor="middle" class="b" style="font-size:14px">Odvodnění a odsolení</text><text x="310.0" y="295.5" text-anchor="middle" class="s">rozbití emulze (voda až 50 %)</text></g><g class="f" style="animation-delay:1.5s"><path d="M442.0,282.0 L598.0,282.0" fill="none" stroke="#0284c7" stroke-opacity=".25" stroke-width="3.2"/><path d="M442.0,282.0 L598.0,282.0" class="fl" fill="none" stroke="#0284c7" stroke-width="3.2"/><path d="M606.0,282.0 L596.0,286.5 L596.0,277.5 Z" fill="#0284c7"/><text x="452" y="274.0" class="s" text-anchor="start" style="fill:#0284c7">slaná voda</text></g><g class="f" style="animation-delay:1.5s"><path d="M310.0,307.0 L310.0,327.0" fill="none" stroke="#92400e" stroke-opacity=".25" stroke-width="3.2"/><path d="M310.0,307.0 L310.0,327.0" class="fl" fill="none" stroke="#92400e" stroke-width="3.2"/><path d="M310.0,335.0 L305.5,325.0 L314.5,325.0 Z" fill="#92400e"/></g><g class="f" style="animation-delay:1.6500000000000001s"><rect x="180" y="336" width="260" height="48" rx="10" fill="#64748b" fill-opacity=".13" stroke="#64748b" stroke-width="2"/><text x="310.0" y="356.5" text-anchor="middle" class="b" style="font-size:14px">Doprava a skladování</text><text x="310.0" y="373.5" text-anchor="middle" class="s">ropovod, nádrže s plovoucí střechou</text></g><g class="f" style="animation-delay:1.9500000000000002s"><path d="M310.0,385.0 L310.0,405.0" fill="none" stroke="#92400e" stroke-opacity=".25" stroke-width="3.2"/><path d="M310.0,385.0 L310.0,405.0" class="fl" fill="none" stroke="#92400e" stroke-width="3.2"/><path d="M310.0,413.0 L305.5,403.0 L314.5,403.0 Z" fill="#92400e"/></g><g class="f" style="animation-delay:2.1s"><rect x="180" y="414" width="260" height="48" rx="10" fill="#ea580c" fill-opacity=".13" stroke="#ea580c" stroke-width="2"/><text x="310.0" y="434.5" text-anchor="middle" class="b" style="font-size:14px">Atmosférická destilace</text><text x="310.0" y="451.5" text-anchor="middle" class="s">pec + kolona 0,15 MPa</text></g><g class="f" style="animation-delay:2.4s"><path d="M442.0,438.0 L598.0,438.0" fill="none" stroke="#16a34a" stroke-opacity=".25" stroke-width="3.2"/><path d="M442.0,438.0 L598.0,438.0" class="fl" fill="none" stroke="#16a34a" stroke-width="3.2"/><path d="M606.0,438.0 L596.0,442.5 L596.0,433.5 Z" fill="#16a34a"/><text x="452" y="430.0" class="s" text-anchor="start" style="fill:#16a34a">benzíny, petrolej aj.</text></g><g class="f" style="animation-delay:2.4s"><path d="M310.0,463.0 L310.0,483.0" fill="none" stroke="#92400e" stroke-opacity=".25" stroke-width="3.2"/><path d="M310.0,463.0 L310.0,483.0" class="fl" fill="none" stroke="#92400e" stroke-width="3.2"/><path d="M310.0,491.0 L305.5,481.0 L314.5,481.0 Z" fill="#92400e"/></g><g class="f" style="animation-delay:2.55s"><rect x="180" y="492" width="260" height="48" rx="10" fill="#7c3aed" fill-opacity=".13" stroke="#7c3aed" stroke-width="2"/><text x="310.0" y="512.5" text-anchor="middle" class="b" style="font-size:14px">Vakuová destilace mazutu</text><text x="310.0" y="529.5" text-anchor="middle" class="s">3 kPa, aby nebylo nad ~370 °C</text></g><g class="f" style="animation-delay:2.8499999999999996s"><path d="M442.0,516.0 L598.0,516.0" fill="none" stroke="#16a34a" stroke-opacity=".25" stroke-width="3.2"/><path d="M442.0,516.0 L598.0,516.0" class="fl" fill="none" stroke="#16a34a" stroke-width="3.2"/><path d="M606.0,516.0 L596.0,520.5 L596.0,511.5 Z" fill="#16a34a"/><text x="452" y="508.0" class="s" text-anchor="start" style="fill:#16a34a">oleje, vak. plynový olej</text></g><g class="f" style="animation-delay:2.8499999999999996s"><path d="M310.0,541.0 L310.0,561.0" fill="none" stroke="#92400e" stroke-opacity=".25" stroke-width="3.2"/><path d="M310.0,541.0 L310.0,561.0" class="fl" fill="none" stroke="#92400e" stroke-width="3.2"/><path d="M310.0,569.0 L305.5,559.0 L314.5,559.0 Z" fill="#92400e"/></g><text x="310.0" y="580" class="s b" text-anchor="middle" style="fill:#92400e">vakuový zbytek → asfalt, koks, hydrokrakování</text><g class="f" style="animation-delay:3.2s"><rect x="20" y="598" width="580" height="84" rx="10" fill="#92400e" fill-opacity=".07" stroke="#92400e" stroke-width="1.5" stroke-dasharray="5 4"/><text x="32" y="619" class="b" style="font-size:14px;fill:#92400e">Limity pro dopravu a proč</text><text x="32" y="638" class="s">voda &lt; 1 %, NaCl &lt; 300 g/m³ – chloridy korodují potrubí,</text><text x="32" y="656" class="s">emulze zvětšuje objem a ztěžuje zpracování.</text><text x="32" y="674" class="s">Složení ropy: C 80–88 %, H 10–15 %, S 1,
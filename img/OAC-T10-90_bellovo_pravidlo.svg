<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 220" width="620" height="220"><style>text{font-family:'IBM Plex Sans',Arial,sans-serif;fill:#0f172a} .s{font-size:13px} .t{font-size:11.5px} .b{font-weight:700} .h{font-size:17px;font-weight:700}@keyframes fin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}@keyframes draw{from{stroke-dashoffset:var(--L)}to{stroke-dashoffset:0}}@keyframes flow{to{stroke-dashoffset:-24}}.f{opacity:0;animation:fin .6s ease forwards}</style><rect width="620" height="220" rx="14" fill="#ffffff"/><text x="20" y="30" class="h">Bellovo pravidlo: pKa₁ ≈ 8 − 5n</text><g class="f" style="animation-delay:0.10s"><rect x="20" y="50" width="145" height="30" fill="#e2e8f0" stroke="#cbd5e1"/><text x="28" y="70" class="s b">n</text><rect x="165" y="50" width="145" height="30" fill="#e2e8f0" stroke="#cbd5e1"/><text x="173" y="70" class="s b">pKa₁</text><rect x="310" y="50" width="145" height="30" fill="#e2e8f0" stroke="#cbd5e1"/><text x="318" y="70" class="s b">síla</text><rect x="455" y="50" width="145" height="30" fill="#e2e8f0" stroke="#cbd5e1"/><text x="463" y="70" class="s b">příklad</text></g><g class="f" style="animation-delay:0.25s"><rect x="20" y="80" width="145" height="30" fill="#fef3c7" stroke="#cbd5e1"/><text x="28" y="100" class="s">3</text><rect x="165" y="80" width="145" height="30" fill="#fef3c7" stroke="#cbd5e1"/><text x="173" y="100" class="s">≈ −8</text><rect x="310" y="80" width="145" height="30" fill="#fef3c7" stroke="#cbd5e1"/><text x="318" y="100" class="s">velmi silná</text><rect x="455" y="80" width="145" height="30" fill="#fef3c7" stroke="#cbd5e1"/><text x="463" y="100" class="s">HClO₄, HMnO₄</text></g><g class="f" style="animation-delay:0.40s"><rect x="20" y="110" width="145" height="30" fill="#ffffff" stroke="#cbd5e1"/><text x="28" y="130" class="s">2</text><rect x="165" y="110" width="145" height="30" fill="#ffffff" stroke="#cbd5e1"/><text x="173" y="130" class="s">≈ −3</text><rect x="310" y="110" width="145" height="30" fill="#ffffff" stroke="#cbd5e1"/><text x="318" y="130" class="s">silná</text><rect x="455" y="110" width="145" height="30" fill="#ffffff" stroke="#cbd5e1"/><text x="463" y="130" class="s">HNO₃, HClO₃</text></g><g class="f" style="animation-delay:0.55s"><rect x="20" y="140" width="145" height="30" fill="#ffffff" stroke="#cbd5e1"/><text x="28" y="160" class="s">1</text><rect x="165" y="140" width="145" height="30" fill="#ffffff" stroke="#cbd5e1"/><text x="173" y="160" class="s">≈ 3</text><rect x="310" y="140" width="145" height="30" fill="#ffffff" stroke="#cbd5e1"/><text x="318" y="160" class="s">střední</text><rect x="455" y="140" width="145" height="30" fill="#ffffff" stroke="#cbd5e1"/><text x="463" y="160" class="s">H₃PO₄, HNO₂</text></g><g class="f" style="animation-delay:0.70s"><rect x="20" y="170" width="145" height="30" fill="#ffffff" stroke="#cbd5e1"/><text x="28" y="190" class="s">0</text><rect x="165" y="170" width="145" height="30" fill="#ffffff" stroke="#cbd5e1"/><text x="173" y="190" class="s">≈ 8</text><rect x="310" y="170" width="145" height="30" fill="#ffffff" stroke="#cbd5e1"/><text x="318" y="190" class="s">slabá</text><rect x="455" y="170" width="145" height="30" fill="#ffffff" stroke="#cbd5e1"/><text x="463" y="190" class="s">HClO, H₆TeO₆</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 279" width="620" height="279"><style>text{font-family:'IBM Plex Sans',Arial,sans-serif;fill:#0f172a} .s{font-size:13px} .t{font-size:11.5px} .b{font-weight:700} .h{font-size:17px;font-weight:700}@keyframes fin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}@keyframes draw{from{stroke-dashoffset:var(--L)}to{stroke-dashoffset:0}}@keyframes flow{to{stroke-dashoffset:-24}}.f{opacity:0;animation:fin .6s ease forwards}</style><rect width="620" height="279" rx="14" fill="#ffffff"/><text x="20" y="30" class="h">Struktura řešení NLDR</text><g class="f" style="animation-delay:0.20s"><rect x="20.0" y="52" width="170" height="64" rx="10" fill="#2563eb" fill-opacity=".14" stroke="#2563eb" stroke-width="2"/><text x="105" y="80" text-anchor="middle" class="s b">y_H = C·φ</text><text x="105" y="96" text-anchor="middle" class="t">všechna řešení HLDR</text></g><g class="f" style="animation-delay:0.45s"><rect x="430.0" y="52" width="170" height="64" rx="10" fill="#ea580c" fill-opacity=".14" stroke="#ea580c" stroke-width="2"/><text x="515" y="80" text-anchor="middle" class="s b">y_P</text><text x="515" y="96" text-anchor="middle" class="t">jedno řešení NLDR</text></g><g class="f" style="animation-delay:0.70s"><rect x="20.0" y="162" width="170" height="64" rx="10" fill="#16a34a" fill-opacity=".14" stroke="#16a34a" stroke-width="2"/><text x="105" y="190" text-anchor="middle" class="s b">y = y_P + y_H</text><text x="105" y="206" text-anchor="middle" class="t">obecné řešení</text></g><g class="f" style="animation-delay:1.20s"><line x1="105" y1="116" x2="105" y2="162" stroke="#0f172a" stroke-width="2.4" style="stroke-dasharray:6 6;animation:flow .8s linear infinite"/><path d="M105,162 L101.5,153.7 L108.5,153.7 Z" fill="#0f172a"/><text x="105" y="133" text-anchor="middle" class="t b" style="fill:#0f172a">plus</text></g><g class="f" style="animation-delay:1.20s"><line x1="515" y1="116" x2="105" y2="162" stroke="#0f172a" stroke-width="2.4" style="stroke-dasharray:6 6;animation:flow .8s linear infinite"/><path d="M105,162 L112.8,157.6 L113.6,164.6 Z" fill="#0f172a"/><text x="310" y="133" text-anchor="middle" class="t b" style="fill:#0f172a">plus</text></g><text x="20" y="252" class="s f" style="animation-delay:2.0s">Definiční obor: celý interval spojitosti a, b.</text></svg>
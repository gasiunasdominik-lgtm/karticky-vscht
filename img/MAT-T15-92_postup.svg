<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 187" width="620" height="187"><style>text{font-family:'IBM Plex Sans',Arial,sans-serif;fill:#0f172a} .s{font-size:13px} .t{font-size:11.5px} .b{font-weight:700} .h{font-size:17px;font-weight:700}@keyframes fin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}@keyframes draw{from{stroke-dashoffset:var(--L)}to{stroke-dashoffset:0}}@keyframes flow{to{stroke-dashoffset:-24}}.f{opacity:0;animation:fin .6s ease forwards}</style><rect width="620" height="187" rx="14" fill="#ffffff"/><text x="20" y="30" class="h">Aplikace integrálu: malý kousek</text><g class="f" style="animation-delay:0.20s"><rect x="20.0" y="52" width="127.0" height="74" rx="10" fill="#ea580c" fill-opacity=".14" stroke="#ea580c" stroke-width="2"/><text x="84" y="85" text-anchor="middle" class="s b">náčrtek</text><text x="84" y="101" text-anchor="middle" class="t">meze = průsečíky</text></g><g class="f" style="animation-delay:0.40s"><line x1="149" y1="89" x2="169" y2="89" stroke="#64748b" stroke-width="2.4" style="--L:20;stroke-dasharray:20;animation:draw .5s ease 0.40s both"/><path d="M169,89 L160.7,92.5 L160.7,85.5 Z" fill="#64748b"/></g><g class="f" style="animation-delay:0.60s"><rect x="171.0" y="52" width="127.0" height="74" rx="10" fill="#7c3aed" fill-opacity=".14" stroke="#7c3aed" stroke-width="2"/><text x="234" y="77" text-anchor="middle" class="s b">malý kousek</text><text x="234" y="93" text-anchor="middle" class="t">f−g, πf², √(1+f'²),</text><text x="234" y="109" text-anchor="middle" class="t">F(x)</text></g><g class="f" style="animation-delay:0.80s"><line x1="300" y1="89" x2="320" y2="89" stroke="#64748b" stroke-width="2.4" style="--L:20;stroke-dasharray:20;animation:draw .5s ease 0.80s both"/><path d="M320,89 L311.7,92.5 L311.7,85.5 Z" fill="#64748b"/></g><g class="f" style="animation-delay:1.00s"><rect x="322.0" y="52" width="127.0" height="74" rx="10" fill="#2563eb" fill-opacity=".14" stroke="#2563eb" stroke-width="2"/><text x="386" y="85" text-anchor="middle" class="s b">integrál</text><text x="386" y="101" text-anchor="middle" class="t">sestav a spočti F</text></g><g class="f" style="animation-delay:1.20s"><line x1="451" y1="89" x2="471" y2="89" stroke="#64748b" stroke-width="2.4" style="--L:20;stroke-dasharray:20;animation:draw .5s ease 1.20s both"/><path d="M471,89 L462.7,92.5 L462.7,85.5 Z" fill="#64748b"/></g><g class="f" style="animation-delay:1.40s"><rect x="473.0" y="52" width="127.0" height="74" rx="10" fill="#16a34a" fill-opacity=".14" stroke="#16a34a" stroke-width="2"/><text x="536" y="77" text-anchor="middle" class="s b">neumíš F?</text><text x="536" y="93" text-anchor="middle" class="t">lichoběžníky s</text><text x="536" y="109" text-anchor="middle" class="t">krokem h</text></g><text x="20" y="160" class="s f" style="animation-delay:2.0s">Objem rotace má f², ne f. Nahoře je horní funkce.</text></svg>
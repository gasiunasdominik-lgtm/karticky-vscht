<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 250" width="620" height="250"><style>text{font-family:'IBM Plex Sans',Arial,sans-serif;fill:#0f172a} .s{font-size:13px} .t{font-size:11.5px} .b{font-weight:700} .h{font-size:17px;font-weight:700}@keyframes fin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}@keyframes draw{from{stroke-dashoffset:var(--L)}to{stroke-dashoffset:0}}@keyframes flow{to{stroke-dashoffset:-24}}.f{opacity:0;animation:fin .6s ease forwards}</style><rect width="620" height="250" rx="14" fill="#ffffff"/><text x="20" y="30" class="h">Co rozepsat na ionty</text><g class="f" style="animation-delay:0.10s"><rect x="20" y="50" width="290" height="30" fill="#e2e8f0" stroke="#cbd5e1"/><text x="28" y="70" class="s b">Látka</text><rect x="310" y="50" width="290" height="30" fill="#e2e8f0" stroke="#cbd5e1"/><text x="318" y="70" class="s b">V iontové rovnici</text></g><g class="f" style="animation-delay:0.25s"><rect x="20" y="80" width="290" height="30" fill="#ffffff" stroke="#cbd5e1"/><text x="28" y="100" class="s">silná kyselina, zásada</text><rect x="310" y="80" width="290" height="30" fill="#ffffff" stroke="#cbd5e1"/><text x="318" y="100" class="s">rozepsat na ionty</text></g><g class="f" style="animation-delay:0.40s"><rect x="20" y="110" width="290" height="30" fill="#ffffff" stroke="#cbd5e1"/><text x="28" y="130" class="s">rozpustná sůl</text><rect x="310" y="110" width="290" height="30" fill="#ffffff" stroke="#cbd5e1"/><text x="318" y="130" class="s">rozepsat na ionty</text></g><g class="f" style="animation-delay:0.55s"><rect x="20" y="140" width="290" height="30" fill="#ffffff" stroke="#cbd5e1"/><text x="28" y="160" class="s">sraženina, plyn</text><rect x="310" y="140" width="290" height="30" fill="#ffffff" stroke="#cbd5e1"/><text x="318" y="160" class="s">nechat vcelku</text></g><g class="f" style="animation-delay:0.70s"><rect x="20" y="170" width="290" height="30" fill="#ffffff" stroke="#cbd5e1"/><text x="28" y="190" class="s">slabý elektrolyt, voda</text><rect x="310" y="170" width="290" height="30" fill="#ffffff" stroke="#cbd5e1"/><text x="318" y="190" class="s">nechat vcelku</text></g><g class="f" style="animation-delay:0.85s"><rect x="20" y="200" width="290" height="30" fill="#ffffff" stroke="#cbd5e1"/><text x="28" y="220" class="s">spektátor</text><rect x="310" y="200" width="290" height="30" fill="#ffffff" stroke="#cbd5e1"/><text x="318" y="220" class="s">vyškrtnout</text></g></svg>
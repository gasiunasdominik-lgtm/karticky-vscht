<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 279" width="620" height="279"><style>text{font-family:'IBM Plex Sans',Arial,sans-serif;fill:#0f172a} .s{font-size:13px} .t{font-size:11.5px} .b{font-weight:700} .h{font-size:17px;font-weight:700}@keyframes fin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}@keyframes draw{from{stroke-dashoffset:var(--L)}to{stroke-dashoffset:0}}@keyframes flow{to{stroke-dashoffset:-24}}.f{opacity:0;animation:fin .6s ease forwards}</style><rect width="620" height="279" rx="14" fill="#ffffff"/><text x="20" y="30" class="h">Termodynamika × kinetika</text><g class="f" style="animation-delay:0.20s"><rect x="20.0" y="52" width="166.66666666666666" height="64" rx="10" fill="#2563eb" fill-opacity=".14" stroke="#2563eb" stroke-width="2"/><text x="103" y="80" text-anchor="middle" class="s b">ΔG = ΔH − TΔS</text><text x="103" y="96" text-anchor="middle" class="t">může reakce jít?</text></g><g class="f" style="animation-delay:0.45s"><rect x="226.66666666666666" y="52" width="166.66666666666666" height="64" rx="10" fill="#7c3aed" fill-opacity=".14" stroke="#7c3aed" stroke-width="2"/><text x="310" y="80" text-anchor="middle" class="s b">ΔG° = −RT ln K</text><text x="310" y="96" text-anchor="middle" class="t">kde je rovnováha</text></g><g class="f" style="animation-delay:0.70s"><rect x="433.3333333333333" y="52" width="166.66666666666666" height="64" rx="10" fill="#ea580c" fill-opacity=".14" stroke="#ea580c" stroke-width="2"/><text x="517" y="80" text-anchor="middle" class="s b">Eₐ, k (Arrhenius)</text><text x="517" y="96" text-anchor="middle" class="t">jak rychle to jde</text></g><g class="f" style="animation-delay:0.95s"><rect x="433.3333333333333" y="162" width="166.66666666666666" height="64" rx="10" fill="#16a34a" fill-opacity=".14" stroke="#16a34a" stroke-width="2"/><text x="517" y="190" text-anchor="middle" class="s b">katalyzátor</text><text x="517" y="206" text-anchor="middle" class="t">sníží Eₐ, K nemění</text></g><g class="f" style="animation-delay:1.20s"><line x1="187" y1="84" x2="227" y2="84" stroke="#0f172a" stroke-width="2.4" style="stroke-dasharray:6 6;animation:flow .8s linear infinite"/><path d="M227,84 L218.4,87.5 L218.4,80.5 Z" fill="#0f172a"/><text x="207" y="78" text-anchor="middle" class="t b" style="fill:#0f172a">ΔG&lt;0</text></g><g class="f" style="animation-delay:1.20s"><line x1="393" y1="84" x2="433" y2="84" stroke="#0f172a" stroke-width="2.4" style="stroke-dasharray:6 6;animation:flow .8s linear infinite"/><path d="M433,84 L425.0,87.5 L425.0,80.5 Z" fill="#0f172a"/><text x="413" y="78" text-anchor="middle" class="t b" style="fill:#0f172a">ale rychlost?</text></g><g class="f" style="animation-delay:1.20s"><line x1="517" y1="162" x2="517" y2="116" stroke="#0f172a" stroke-width="2.4" style="stroke-dasharray:6 6;animation:flow .8s linear infinite"/><path d="M517,116 L520.2,124.3 L513.2,124.3 Z" fill="#0f172a"/><text x="517" y="133" text-anchor="middle" class="t b" style="fill:#0f172a">zrychlí</text></g><text x="20" y="252" class="s f" style="animation-delay:2.0s">Diamant → grafit: ΔG&lt;0, ale Eₐ je obrovská, takže neběží.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 618" width="620" height="618"><style>text{font-family:'IBM Plex Sans',Arial,sans-serif;fill:#0f172a} .s{font-size:13px} .b{font-weight:700} .t{font-size:17px;font-weight:700} .n{font-size:14px}@keyframes fin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}@keyframes mv{from{stroke-dashoffset:18}to{stroke-dashoffset:0}}.f{opacity:0;animation:fin .6s ease forwards} .fl{stroke-dasharray:11 7;animation:mv .9s linear infinite}</style><rect width="620" height="618" rx="14" fill="#ffffff"/><text x="20" y="32" class="t" text-anchor="start">Vodík ze zemního plynu (parní reforming)</text><text x="310.0" y="70" class="s b" text-anchor="middle" style="fill:#16a34a">zemní plyn (CH₄)</text><g class="f" style="animation-delay:0.1s"><path d="M310.0,76.0 L310.0,94.0" fill="none" stroke="#16a34a" stroke-opacity=".25" stroke-width="3.2"/><path d="M310.0,76.0 L310.0,94.0" class="fl" fill="none" stroke="#16a34a" stroke-width="3.2"/><path d="M310.0,102.0 L305.5,92.0 L314.5,92.0 Z" fill="#16a34a"/></g><g class="f" style="animation-delay:0.3s"><rect x="180" y="102" width="260" height="48" rx="10" fill="#ca8a04" fill-opacity=".13" stroke="#ca8a04" stroke-width="2"/><text x="310.0" y="122.5" text-anchor="middle" class="b" style="font-size:14px">Odsíření</text><text x="310.0" y="139.5" text-anchor="middle" class="s">S → H₂S, absorpce (Ni nesnese síru)</text></g><g class="f" style="animation-delay:0.6s"><path d="M442.0,126.0 L598.0,126.0" fill="none" stroke="#ca8a04" stroke-opacity=".25" stroke-width="3.2"/><path d="M442.0,126.0 L598.0,126.0" class="fl" fill="none" stroke="#ca8a04" stroke-width="3.2"/><path d="M606.0,126.0 L596.0,130.5 L596.0,121.5 Z" fill="#ca8a04"/><text x="452" y="118.0" class="s" text-anchor="start" style="fill:#ca8a04">H₂S</text></g><g class="f" style="animation-delay:0.6s"><path d="M310.0,151.0 L310.0,171.0" fill="none" stroke="#16a34a" stroke-opacity=".25" stroke-width="3.2"/><path d="M310.0,
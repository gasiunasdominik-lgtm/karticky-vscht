<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 614" width="620" height="614"><style>text{font-family:'IBM Plex Sans',Arial,sans-serif;fill:#0f172a} .s{font-size:13px} .b{font-weight:700} .t{font-size:17px;font-weight:700} .n{font-size:14px}@keyframes fin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}@keyframes mv{from{stroke-dashoffset:18}to{stroke-dashoffset:0}}.f{opacity:0;animation:fin .6s ease forwards} .fl{stroke-dasharray:11 7;animation:mv .9s linear infinite}</style><rect width="620" height="614" rx="14" fill="#ffffff"/><text x="20" y="32" class="t" text-anchor="start">Syntéza amoniaku – Haber-Bosch se smyčkou</text><text x="310.0" y="70" class="s b" text-anchor="middle" style="fill:#2563eb">syntézní plyn N₂ : H₂ = 1 : 3</text><g class="f" style="animation-delay:0.1s"><path d="M310.0,76.0 L310.0,94.0" fill="none" stroke="#2563eb" stroke-opacity=".25" stroke-width="3.2"/><path d="M310.0,76.0 L310.0,94.0" class="fl" fill="none" stroke="#2563eb" stroke-width="3.2"/><path d="M310.0,102.0 L305.5,92.0 L314.5,92.0 Z" fill="#2563eb"/></g><g class="f" style="animation-delay:0.3s"><rect x="180" y="102" width="260" height="48" rx="10" fill="#dc2626" fill-opacity=".13" stroke="#dc2626" stroke-width="2"/><text x="310.0" y="122.5" text-anchor="middle" class="b" style="font-size:14px">Kompresor</text><text x="310.0" y="139.5" text-anchor="middle" class="s">10–100 MPa (typicky 15–30 MPa)</text></g><g class="f" style="animation-delay:0.6s"><path d="M310.0,151.0 L310.0,171.0" fill="none" stroke="#2563eb" stroke-opacity=".25" stroke-width="3.2"/><path d="M310.0,151.0 L310.0,171.0" class="fl" fill="none" stroke="#2563eb" stroke-width="3.2"/><path d="M310.0,179.0 L305.5,169.0 L314.5,169.0 Z" fill="#2563eb"/></g><g class="f" style="animation-delay:0.75s"><rect x="180" y="180" width="260" height="48" rx="10" fill="#ea580c" fill-opacity=".13" stroke="#ea580c" stroke-width="2"/><text x="310.0" y="200.5" text-anchor="middle" class="b" style="font-size:14px">Reaktor syntézy</text><text x="310.0" y="217.5" text-anchor="middle" class="s">α-Fe kat., 400–500 °C, exotermní</text></g><g class="f" style="animation-delay:1.05s"><path d="M442.0,204.0 L598.0,204.0" fill="none" stroke="#dc2626" stroke-opacity=".25" stroke-width="3.2"/><path d="M442.0,204.0 L598.0,204.0" class="fl" fill="none" stroke="#dc2626" stroke-width="3.2"/><path d="M606.0,204.0 L596.0,208.5 L596.0,199.5 Z" fill="#dc2626"/><text x="452" y="196.0" class="s" text-anchor="start" style="fill:#dc2626">teplo → pára</text></g><g class="f" style="animation-delay:1.05s"><path d="M310.0,229.0 L310.0,249.0" fill="none" stroke="#2563eb" stroke-opacity=".25" stroke-width="3.2"/><path d="M310.0,229.0 L310.0,249.0" class="fl" fill="none" stroke="#2563eb" stroke-width="3.2"/><path d="M310.0,257.0 L305.5,247.0 L314.5,247.0 Z" fill="#2563eb"/></g><g class="f" style="animation-delay:1.2s"><rect x="180" y="258" width="260" height="48" rx="10" fill="#0284c7" fill-opacity=".13" stroke="#0284c7" stroke-width="2"/><text x="310.0" y="278.5" text-anchor="middle" class="b" style="font-size:14px">Chladič / kondenzace</text><text x="310.0" y="295.5" text-anchor="middle" class="s">−25 °C (strojní chlazení)</text></g><g class="f" style="animation-delay:1.5s"><path d="M310.0,307.0 L310.0,327.0" fill="none" stroke="#2563eb" stroke-opacity=".25" stroke-width="3.2"/><path d="M310.0,307.0 L310.0,327.0" class="fl" fill="none" stroke="#2563eb" stroke-width="3.2"/><path d="M310.0,335.0 L305.5,325.0 L314.5,325.0 Z" fill="#2563eb"/></g><g class="f" style="animation-delay:1.6500000000000001s"><rect x="180" y="336" width="260" height="48" rx="10" fill="#0d9488" fill-opacity=".13" stroke="#0d9488" stroke-width="2"/><text x="310.0" y="356.5" text-anchor="middle" class="b" style="font-size:14px">Odlučovač NH₃</text><text x="310.0" y="373.5" text-anchor="middle" class="s">kapalný NH₃ dole, plyn nahoře</text></g><g class="f" style="animation-delay:1.9500000000000002s"><path d="M442.0,360.0 L598.0,360.0" fill="none" stroke="#7c3aed" stroke-opacity=".25" stroke-width="3.2"/><path d="M442.0,360.0 L598.0,360.0" class="fl" fill="none" stroke="#7c3aed" stroke-width="3.2"/><path d="M606.0,360.0 L596.0,364.5 L596.0,355.5 Z" fill="#7c3aed"/><text x="452" y="352.0" class="s" text-anchor="start" style="fill:#7c3aed">NH₃ (l) → zásobník</text></g><g class="f" style="animation-delay:1.9500000000000002s"><path d="M310.0,385.0 L310.0,405.0" fill="none" stroke="#64748b" stroke-opacity=".25" stroke-width="3.2"/><path d="M310.0,385.0 L310.0,405.0" class="fl" fill="none" stroke="#64748b" stroke-width="3.2"/><path d="M310.0,413.0 L305.5,403.0 L314.5,403.0 Z" fill="#64748b"/></g><g class="f" style="animation-delay:2.1s"><rect x="180" y="414" width="260" height="48" rx="10" fill="#64748b" fill-opacity=".13" stroke="#64748b" stroke-width="2"/><text x="310.0" y="434.5" text-anchor="middle" class="b" style="font-size:14px">Odpouštění inertů</text><text x="310.0" y="451.5" text-anchor="middle" class="s">malý odtah, aby se nehromadily</text></g><g class="f" style="animation-delay:2.4s"><path d="M442.0,438.0 L598.0,438.0" fill="none" stroke="#64748b" stroke-opacity=".25" stroke-width="3.2"/><path d="M442.0,438.0 L598.0,438.0" class="fl" fill="none" stroke="#64748b" stroke-width="3.2"/><path d="M606.0,438.0 L596.0,442.5 L596.0,433.5 Z" fill="#64748b"/><text x="452" y="430.0" class="s" text-anchor="start" style="fill:#64748b">Ar, CH₄ ven</text></g><g class="f" style="animation-delay:2.6s"><path d="M178.0,368.0 L150.0,368.0 L150.0,166.0 L308.0,166.0 L308.0,170.0" fill="none" stroke="#2563eb" stroke-opacity=".25" stroke-width="3.2"/><path d="M178.0,368.0 L150.0,368.0 L150.0,166.0 L308.0,166.0 L308.0,170.0" class="fl" fill="none" stroke="#2563eb" stroke-width="3.2"/><path d="M308.0,178.0 L303.5,168.0 L312.5,168.0 Z" fill="#2563eb"/><text x="16" y="210.0" class="s" text-anchor="start" style="fill:#2563eb">recykl</text><text x="16" y="225.0" class="s" text-anchor="start" style="fill:#2563eb">N₂ + H₂</text><text x="16" y="240.0" class="s" text-anchor="start" style="fill:#2563eb">(konverze</text><text x="16" y="255.0" class="s" text-anchor="start" style="fill:#2563eb">20–80 %)</text></g><g class="f" style="animation-delay:2.9s"><rect x="20" y="498" width="580" height="102" rx="10" fill="#2563eb" fill-opacity=".07" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="5 4"/><text x="32" y="519" class="b" style="font-size:14px;fill:#2563eb">Reakce a kompromis podmínek</text><text x="32" y="538" class="s">N₂ + 3 H₂ ⇄ 2 NH₃   exotermní, 4 mol plynu → 2 mol</text><text x="32" y="556" class="s">vysoký tlak → víc NH₃ (Le Chatelier), nízká T → víc NH₃,</text><text x="32" y="574" class="s">ale pomalu → kompromis 400–500 °C s katalyzátorem α-Fe.</text><text x="32" y="592" class="s">Jed katalyzátoru: CO, CO₂, H₂O, S → syntézní plyn se čistí.</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 220" width="620" height="220"><style>text{font-family:'IBM Plex Sans',Arial,sans-serif;fill:#0f172a} .s{font-size:13px} .t{font-size:11.5px} .b{font-weight:700} .h{font-size:17px;font-weight:700}@keyframes fin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}@keyframes draw{from{stroke-dashoffset:var(--L)}to{stroke-dashoffset:0}}@keyframes flow{to{stroke-dashoffset:-24}}.f{opacity:0;animation:fin .6s ease forwards}</style><rect width="620" height="220" rx="14" fill="#ffffff"/><text x="20" y="30" class="h">Konverze, výtěžek, ztráty</text><g class="f" style="animation-delay:0.10s"><rect x="20" y="50" width="193" height="30" fill="#e2e8f0" stroke="#cbd5e1"/><text x="28" y="70" class="s b">veličina</text><rect x="213" y="50" width="193" height="30" fill="#e2e8f0" stroke="#cbd5e1"/><text x="221" y="70" class="s b">týká se</text><rect x="407" y="50" width="193" height="30" fill="#e2e8f0" stroke="#cbd5e1"/><text x="415" y="70" class="s b">vzorec</text></g><g class="f" style="animation-delay:0.25s"><rect x="20" y="80" width="193" height="30" fill="#ffffff" stroke="#cbd5e1"/><text x="28" y="100" class="s">konverze ζ</text><rect x="213" y="80" width="193" height="30" fill="#ffffff" stroke="#cbd5e1"/><text x="221" y="100" class="s">reaktant (klíčová)</text><rect x="407" y="80" width="193" height="30" fill="#ffffff" stroke="#cbd5e1"/><text x="415" y="100" class="s">zreag. / celkem</text></g><g class="f" style="animation-delay:0.40s"><rect x="20" y="110" width="193" height="30" fill="#ffffff" stroke="#cbd5e1"/><text x="28" y="130" class="s">výtěžek θ</text><rect x="213" y="110" width="193" height="30" fill="#ffffff" stroke="#cbd5e1"/><text x="221" y="130" class="s">produkt</text><rect x="407" y="110" width="193" height="30" fill="#ffffff" stroke="#cbd5e1"/><text x="415" y="130" class="s">vzniklo / teorie</text></g><g class="f" style="animation-delay:0.55s"><rect x="20" y="140" width="193" height="30" fill="#ffffff" stroke="#cbd5e1"/><text x="28" y="160" class="s">ztráty z</text><rect x="213" y="140" width="193" height="30" fill="#ffffff" stroke="#cbd5e1"/><text x="221" y="160" class="s">produkt</text><rect x="407" y="140" width="193" height="30" fill="#ffffff" stroke="#cbd5e1"/><text x="415" y="160" class="s">(teorie − vzniklo) / teorie</text></g><g class="f" style="animation-delay:0.70s"><rect x="20" y="170" width="193" height="30" fill="#fef3c7" stroke="#cbd5e1"/><text x="28" y="190" class="s">kontrola</text><rect x="213" y="170" width="193" height="30" fill="#fef3c7" stroke="#cbd5e1"/><text x="221" y="190" class="s">θ + z</text><rect x="407" y="170" width="193" height="30" fill="#fef3c7" stroke="#cbd5e1"/><text x="415" y="190" class="s">vždy = 1</text></g></svg>
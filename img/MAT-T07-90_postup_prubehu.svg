<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 402" width="620" height="402"><style>text{font-family:'IBM Plex Sans',Arial,sans-serif;fill:#0f172a} .s{font-size:13px} .b{font-weight:700} .m{font-size:15px;font-style:italic}@keyframes fin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}@keyframes draw{from{stroke-dashoffset:var(--L)}to{stroke-dashoffset:0}}@keyframes loop2{0%{opacity:0}3%{opacity:1}47.0%{opacity:1}50.0%{opacity:0}100%{opacity:0}}@keyframes loop3{0%{opacity:0}3%{opacity:1}30.3%{opacity:1}33.3%{opacity:0}100%{opacity:0}}@keyframes loop4{0%{opacity:0}3%{opacity:1}22.0%{opacity:1}25.0%{opacity:0}100%{opacity:0}}@keyframes loop5{0%{opacity:0}3%{opacity:1}17.0%{opacity:1}20.0%{opacity:0}100%{opacity:0}}@keyframes loop6{0%{opacity:0}3%{opacity:1}13.7%{opacity:1}16.7%{opacity:0}100%{opacity:0}}@keyframes stay{0%{opacity:0}4%{opacity:1}92%{opacity:1}100%{opacity:0}}.f{opacity:0;animation:fin .6s ease forwards} .q{opacity:0} </style><rect width="620" height="402" rx="14" fill="#ffffff"/><text x="20" y="30" class="b" style="font-size:17px">Průběh funkce: 6 kroků od „kde existuje“ k detailům</text><g class="f" style="animation-delay:0.3s"><rect x="20" y="48" width="580" height="46" rx="10" fill="#64748b" fill-opacity=".14" stroke="#64748b" stroke-width="2"/><text x="310.0" y="69" text-anchor="middle" class="b">1. D(f), průsečíky s osami</text><text x="310.0" y="86" text-anchor="middle" class="s">kde funkce vůbec žije</text></g><g class="f" style="animation-delay:0.6s"><line x1="310" y1="95" x2="310" y2="106" stroke="#64748b" stroke-width="2.4" style="--L:11;stroke-dasharray:11;animation:draw .5s ease 0.6s both"/><path d="M310,106 L306.5,97.7 L313.5,97.7 Z" fill="#64748b"/></g><g class="f" style="animation-delay:0.8s"><rect x="20" y="106" width="580" height="46" rx="10" fill="#64748b" fill-opacity=".14" stroke="#64748b" stroke-width="2"/><text x="310.0" y="127" text-anchor="middle" class="b">2. sudost / lichost / periodicita</text>
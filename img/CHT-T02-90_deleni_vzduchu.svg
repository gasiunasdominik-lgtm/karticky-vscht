<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 714" width="620" height="714"><style>text{font-family:'IBM Plex Sans',Arial,sans-serif;fill:#0f172a} .s{font-size:13px} .b{font-weight:700} .t{font-size:17px;font-weight:700} .n{font-size:14px}@keyframes fin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}@keyframes mv{from{stroke-dashoffset:18}to{stroke-dashoffset:0}}.f{opacity:0;animation:fin .6s ease forwards} .fl{stroke-dasharray:11 7;animation:mv .9s linear infinite}</style><rect width="620" height="714" rx="14" fill="#ffffff"/><text x="20" y="32" class="t" text-anchor="start">Dělení vzduchu (Claudeho proces)</text><text x="310.0" y="70" class="s b" text-anchor="middle" style="fill:#0284c7">vzduch (78 % N₂, 21 % O₂, ~1 % Ar)</text><g class="f" style="animation-delay:0.1s"><path d="M310.0,76.0 L310.0,94.0" fill="none" stroke="#0284c7" stroke-opacity=".25" stroke-width="3.2"/><path d="M310.0,76.0 L310.0,94.0" class="fl" fill="none" stroke="#0284c7" stroke-width="3.2"/><path d="M310.0,102.0 L305.5,92.0 L314.5,92.0 Z" fill="#0284c7"/></g><g class="f" style="animation-delay:0.3s"><rect x="180" y="102" width="260" height="48" rx="10" fill="#64748b" fill-opacity=".13" stroke="#64748b" stroke-width="2"/><text x="310.0" y="122.5" text-anchor="middle" class="b" style="font-size:14px">Filtr</text><text x="310.0" y="139.5" text-anchor="middle" class="s">prach pryč</text></g><g class="f" style="animation-delay:0.6s"><path d="M442.0,126.0 L598.0,126.0" fill="none" stroke="#92400e" stroke-opacity=".25" stroke-width="3.2"/><path d="M442.0,126.0 L598.0,126.0" class="fl" fill="none" stroke="#92400e" stroke-width="3.2"/><path d="M606.0,126.0 L596.0,130.5 L596.0,121.5 Z" fill="#92400e"/><text x="452" y="118.0" class="s" text-anchor="start" style="fill:#92400e">prach</text></g><g class="f" style="animation-delay:0.6s"><path d="M310.0,151.0 L310.0,171.0" fill="none" stroke="#0284c7" stroke-opacity=".25" stroke-width="3.2"/><path d="M310.0,151.0 L310.0,171.0" class="fl" fill="none" stroke="#0284c7" stroke-width="3.2"/><path d="M310.0,179.0 L305.5,169.0 L314.5,169.0 Z" fill="#0284c7"/></g><g class="f" style="animation-delay:0.75s"><rect x="180" y="180" width="260" height="48" rx="10" fill="#7c3aed" fill-opacity=".13" stroke="#7c3aed" stroke-width="2"/><text x="310.0" y="200.5" text-anchor="middle" class="b" style="font-size:14px">Absorpce CO₂ + sušení</text><text x="310.0" y="217.5" text-anchor="middle" class="s">NaOH váže CO₂, sušidlo vodu</text></g><g class="f" style="animation-delay:0.95s"><path d="M14.0,204.0 L170.0,204.0" fill="none" stroke="#7c3aed" stroke-opacity=".25" stroke-width="3.2"/><path d="M14.0,204.0 L170.0,204.0" class="fl" fill="none" stroke="#7c3aed" stroke-width="3.2"/><path d="M178.0,204.0 L168.0,208.5 L168.0,199.5 Z" fill="#7c3aed"/><text x="16" y="196.0" class="s" text-anchor="start" style="fill:#7c3aed">NaOH, sušidlo</text></g><g class="f" style="animation-delay:1.05s"><path d="M442.0,204.0 L598.0,204.0" fill="none" stroke="#64748b" stroke-opacity=".25" stroke-width="3.2"/><path d="M442.0,204.0 L598.0,204.0" class="fl" fill="none" stroke="#64748b" stroke-width="3.2"/><path d="M606.0,204.0 L596.0,208.5 L596.0,199.5 Z" fill="#64748b"/><text x="452" y="196.0" class="s" text-anchor="start" style="fill:#64748b">Na₂CO₃, H₂O</text></g><g class="f" style="animation-delay:1.05s"><path d="M310.0,229.0 L310.0,249.0" fill="none" stroke="#0284c7" stroke-opacity=".25" stroke-width="3.2"/><path d="M310.0,229.0 L310.0,249.0" class="fl" fill="none" stroke="#0284c7" stroke-width="3.2"/><path d="M310.0,257.0 L305.5,247.0 L314.5,247.0 Z" fill="#0284c7"/></g><g class="f" style="animation-delay:1.2s"><rect x="180" y="258" width="260" height="48" rx="10" fill="#dc2626" fill-opacity=".13" stroke="#dc2626" stroke-width="2"/><text x="310.0" y="278.5" text-anchor="middle" class="b" style="font-size:14px">Kompresor + chlazení vodou</text><text x="310.0" y="295.5" text-anchor="middle" class="s">Claude 4–6 MPa (Linde 20 MPa)</text></g><g class="f" style="animation-delay:1.4s"><path d="M14.0,282.0 L170.0,282.0" fill="none" stroke="#0284c7" stroke-opacity=".25" stroke-width="3.2"/><path d="M14.0,282.0 L170.0,282.0" class="fl" fill="none" stroke="#0284c7" stroke-width="3.2"/><path d="M178.0,282.0 L168.0,286.5 L168.0,277.5 Z" fill="#0284c7"/><text x="16" y="274.0" class="s" text-anchor="start" style="fill:#0284c7">chladicí voda</text></g><g class="f" style="animation-delay:1.5s"><path d="M442.0,282.0 L598.0,282.0" fill="none" stroke="#dc2626" stroke-opacity=".25" stroke-width="3.2"/><path d="M442.0,282.0 L598.0,282.0" class="fl" fill="none" stroke="#dc2626" stroke-width="3.2"/><path d="M606.0,282.0 L596.0,286.5 L596.0,277.5 Z" fill="#dc2626"/><text x="452" y="274.0" class="s" text-anchor="start" style="fill:#dc2626">teplo</text></g><g class="f" style="animation-delay:1.5s"><path d="M310.0,307.0 L310.0,327.0" fill="none" stroke="#0284c7" stroke-opacity=".25" stroke-width="3.2"/><path d="M310.0,307.0 L310.0,327.0" class="fl" fill="none" stroke="#0284c7" stroke-width="3.2"/><path d="M310.0,335.0 L305.5,325.0 L314.5,325.0 Z" fill="#0284c7"/></g><g class="f" style="animation-delay:1.6500000000000001s"><rect x="180" y="336" width="260" height="48" rx="10" fill="#0284c7" fill-opacity=".13" stroke="#0284c7" stroke-width="2"/><text x="310.0" y="356.5" text-anchor="middle" class="b" style="font-size:14px">Protiproudý výměník</text><text x="310.0" y="373.5" text-anchor="middle" class="s">chladí ho vracející se studený plyn</text></g><g class="f" style="animation-delay:1.85s"><path d="M14.0,360.0 L170.0,360.0" fill="none" stroke="#0284c7" stroke-opacity=".25" stroke-width="3.2"/><path d="M14.0,360.0 L170.0,360.0" class="fl" fill="none" stroke="#0284c7" stroke-width="3.2"/><path d="M178.0,360.0 L168.0,364.5 L168.0,355.5 Z" fill="#0284c7"/><text x="16" y="352.0" class="s" text-anchor="start" style="fill:#0284c7">studený N₂ zpět</text></g><g class="f" style="animation-delay:1.9500000000000002s"><path d="M310.0,385.0 L310.0,405.0" fill="none" stroke="#0284c7" stroke-opacity=".25" stroke-width="3.2"/><path d="M310.0,385.0 L310.0,405.0" class="fl" fill="none" stroke="#0284c7" stroke-width="3.2"/><path d="M310.0,413.0 L305.5,403.0 L314.5,403.0 Z" fill="#0284c7"/></g><g class="f" style="animation-delay:2.1s"><rect x="180" y="414" width="260" height="48" rx="10" fill="#0d9488" fill-opacity=".13" stroke="#0d9488" stroke-width="2"/><text x="310.0" y="434.5" text-anchor="middle" class="b" style="font-size:14px">Expanze: turbína + ventil</text><text x="310.0" y="451.5" text-anchor="middle" class="s">~75 % turbínou (práce), zbytek J-T</text></g><g class="f" style="animation-delay:2.4s"><path d="M442.0,438.0 L598.0,438.0" fill="none" stroke="#0d9488" stroke-opacity=".25" stroke-width="3.2"/><path d="M442.0,438.0 L598.0,438.0" class="fl" fill="none" stroke="#0d9488" stroke-width="3.2"/><path d="M606.0,438.0 L596.0,442.5 L596.0,433.5 Z" fill="#0d9488"/><text x="452" y="430.0" class="s" text-anchor="start" style="fill:#0d9488">práce → kompresor</text></g><g class="f" style="animation-delay:2.4s"><path d="M310.0,463.0 L310.0,483.0" fill="none" stroke="#0284c7" stroke-opacity=".25" stroke-width="3.2"/><path d="M310.0,463.0 L310.0,483.0" class="fl" fill="none" stroke="#0284c7" stroke-width="3.2"/><path d="M310.0,491.0 L305.5,481.0 L314.5,481.0 Z" fill="#0284c7"/></g><g class="f" style="animation-delay:2.55s"><rect x="180" y="492" width="260" height="48" rx="10" fill="#2563eb" fill-opacity=".13" stroke="#2563eb" stroke-width="2"/><text x="310.0" y="512.5" text-anchor="middle" class="b" style="font-size:14px">Dvě rektifikační kolony</text><text x="310.0" y="529.5" text-anchor="middle" class="s">VT 550 kPa pod NT 100 kPa</text></g><g class="f" style="animation-delay:2.8499999999999996s"><path d="M442.0,516.0 L598.0,516.0" fill="none" stroke="#16a34a" stroke-opacity=".25" stroke-width="3.2"/><path d="M442.0,516.0 L598.0,516.0" class="fl" fill="none" stroke="#16a34a" stroke-width="3.2"/><path d="M606.0,516.0 L596.0,520.5 L596.0,511.5 Z" fill="#16a34a"/><text x="452" y="508.0" class="s" text-anchor="start" style="fill:#16a34a">N₂ hlava, −196 °C</text></g><g class="f" style="animation-delay:2.8499999999999996s"><path d="M310.0,541.0 L310.0,561.0" fill="none" stroke="#0284c7" stroke-opacity=".25" stroke-width="3.2"/><path d="M310.0,541.0 L310.0,561.0" class="fl" fill="none" stroke="#0284c7" stroke-width="3.2"/><path d="M310.0,569.0 L305.5,559.0 L314.5,559.0 Z" fill="#0284c7"/></g><text x="310.0" y="580" class="s b" text-anchor="middle" style="fill:#0284c7">O₂ kapalný z vařáku NT kolony (−183 °C), 99 %</text><g class="f" style="animation-delay:3.2s"><rect x="20" y="598" width="580" height="102" rx="10" fill="#2563eb" fill-opacity=".07" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="5 4"/><text x="32" y="619" class="b" style="font-size:14px;fill:#2563eb">Proč to funguje</text><text x="32" y="638" class="s">N₂ vře při −196 °C, O₂ při −183 °C → N₂ je těkavější (nahoru).</text><text x="32" y="656" class="s">Při 550 kPa kondenzuje N₂ při −178 °C → ohřeje vařák NT kolony</text><text x="32" y="674" class="s">  s vroucím O₂ (−183 °C): rozdíl 5 °C stačí na přenos tepla.</text><text x="32" y="692" class="s">Prach, H₂O a CO₂ pryč předem – jinak zmrznou a ucpou výměníky.</text></g></svg>
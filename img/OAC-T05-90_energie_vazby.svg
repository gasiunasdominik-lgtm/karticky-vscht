<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 161" width="620" height="161"><style>text{font-family:'IBM Plex Sans',Arial,sans-serif;fill:#0f172a} .s{font-size:13px} .t{font-size:11.5px} .b{font-weight:700} .h{font-size:17px;font-weight:700}@keyframes fin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}@keyframes draw{from{stroke-dashoffset:var(--L)}to{stroke-dashoffset:0}}@keyframes flow{to{stroke-dashoffset:-24}}.f{opacity:0;animation:fin .6s ease forwards}</style><rect width="620" height="161" rx="14" fill="#ffffff"/><text x="20" y="30" class="h">Energie vazby: proč je N₂ inertní</text><text x="20" y="70" class="s b">N≡N (N₂)</text><rect x="200" y="52" width="330" height="26" rx="6" fill="#f1f5f9"/><rect x="200" y="52" width="330.0" height="26" rx="6" fill="#2563eb" fill-opacity=".75" style="transform-origin:200px 0;animation:fin .6s ease 0.20s both"/><text x="536" y="70" class="t b">945 kJ/mol</text><text x="20" y="106" class="s b">O=O (O₂)</text><rect x="200" y="88" width="330" height="26" rx="6" fill="#f1f5f9"/><rect x="200" y="88" width="173.9" height="26" rx="6" fill="#ea580c" fill-opacity=".75" style="transform-origin:200px 0;animation:fin .6s ease 0.45s both"/><text x="380" y="106" class="t b">498 kJ/mol</text><text x="20" y="134" class="s f" style="animation-delay:2.0s">Silnější vazba = méně reaktivní molekula.</text></svg>
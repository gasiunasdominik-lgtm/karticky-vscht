<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 484" width="620" height="484"><style>text{font-family:'IBM Plex Sans',Arial,sans-serif;fill:#0f172a} .s{font-size:13px} .b{font-weight:700} .m{font-size:15px;font-style:italic}@keyframes fin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}@keyframes draw{from{stroke-dashoffset:var(--L)}to{stroke-dashoffset:0}}@keyframes loop2{0%{opacity:0}3%{opacity:1}47.0%{opacity:1}50.0%{opacity:0}100%{opacity:0}}@keyframes loop3{0%{opacity:0}3%{opacity:1}30.3%{opacity:1}33.3%{opacity:0}100%{opacity:0}}@keyframes loop4{0%{opacity:0}3%{opacity:1}22.0%{opacity:1}25.0%{opacity:0}100%{opacity:0}}@keyframes loop5{0%{opacity:0}3%{opacity:1}17.0%{opacity:1}20.0%{opacity:0}100%{opacity:0}}@keyframes loop6{0%{opacity:0}3%{opacity:1}13.7%{opacity:1}16.7%{opacity:0}100%{opacity:0}}@keyframes stay{0%{opacity:0}4%{opacity:1}92%{opacity:1}100%{opacity:0}}.f{opacity:0;animation:fin .6s ease forwards} .q{opacity:0} </style><rect width="620" height="484" rx="14" fill="#ffffff"/><text x="20" y="30" class="b" style="font-size:17px">Limita: nejdřív DOSAĎ, pak podle výsledku jednej</text><g class="f" style="animation-delay:0.2s"><rect x="190" y="44" width="240" height="44" rx="10" fill="#0f172a" fill-opacity=".14" stroke="#0f172a" stroke-width="2"/><text x="310.0" y="65" text-anchor="middle" class="b">dosaď x = a (nebo ∞)</text></g><line x1="40" y1="88" x2="40" y2="417" stroke="#64748b" stroke-width="2" class="f" style="animation-delay:.4s"/><line x1="40" y1="88" x2="190" y2="66" stroke="#64748b" stroke-width="2" class="f" style="animation-delay:.4s"/><g class="f" style="animation-delay:0.5s"><line x1="40" y1="127" x2="62" y2="127" stroke="#16a34a" stroke-width="2.4" style="--L:22;stroke-dasharray:22;animation:draw .5s ease 0.5s both"/><path d="M62,127 L53.7,130.5 L53.7,123.5 Z" fill="#16a34a"/></g><g class="f" style="animation-delay:0.5s"><rect x="64" y="104" width="128" height="46" rx="10" fill="#16a34a" fill-opacity=".14" stroke="#16a34a" stroke-width="2"/><text x="128.0" y="125" text-anchor="middle" class="b">číslo</text></g><g class="f" style="animation-delay:0.7s"><line x1="194" y1="127" x2="218" y2="127" stroke="#16a34a" stroke-width="2.4" style="--L:24;stroke-dasharray:24;animation:draw .5s ease 0.7s both"/><path d="M218,127 L209.7,130.5 L209.7,123.5 Z" fill="#16a34a"/></g><g class="f" style="animation-delay:0.8s"><rect x="220" y="104" width="380" height="46" rx="10" fill="#16a34a" fill-opacity=".14" stroke="#16a34a" stroke-width="2"/><text x="410.0" y="125" text-anchor="middle" class="b">hotovo, to je limita</text><text x="410.0" y="142" text-anchor="middle" class="s">lim (x² + 1) pro x→2 = 5</text></g><g class="f" style="animation-delay:0.95s"><line x1="40" y1="185" x2="62" y2="185" stroke="#dc2626" stroke-width="2.4" style="--L:22;stroke-dasharray:22;animation:draw .5s ease 0.95s both"/><path d="M62,185 L53.7,188.5 L53.7,181.5 Z" fill="#dc2626"/></g><g class="f" style="animation-delay:0.95s"><rect x="64" y="162" width="128" height="46" rx="10" fill="#dc2626" fill-opacity=".14" stroke="#dc2626" stroke-width="2"/><text x="128.0" y="183" text-anchor="middle" class="b">c / 0  (c ≠ 0)</text></g><g class="f" style="animation-delay:1.15s"><line x1="194" y1="185" x2="218" y2="185" stroke="#dc2626" stroke-width="2.4" style="--L:24;stroke-dasharray:24;animation:draw .5s ease 1.15s both"/><path d="M218,185 L209.7,188.5 L209.7,181.5 Z" fill="#dc2626"/></g><g class="f" style="animation-delay:1.25s"><rect x="220" y="162" width="380" height="46" rx="10" fill="#dc2626" fill-opacity=".14" stroke="#dc2626" stroke-width="2"/><text x="410.0" y="183" text-anchor="middle" class="b">±∞: urči znaménko zleva a zprava</text><text x="410.0" y="200" text-anchor="middle" class="s">1/(x−1): zprava +∞, zleva −∞</text></g><g class="f" style="animation-delay:1.4s"><line x1="40" y1="243" x2="62" y2="243" stroke="#2563eb" stroke-width="2.4" style="--L:22;stroke-dasharray:22;animation:draw .5s ease 1.4s both"/><path d="M62,243 L53.7,246.5 L53.7,239.5 Z" fill="#2563eb"/></g><g class="f" style="animation-delay:1.4s"><rect x="64" y="220" width="128" height="46" rx="10" fill="#2563eb" fill-opacity=".14" stroke="#2563eb" stroke-width="2"/><text x="128.0" y="241" text-anchor="middle" class="b">0 / 0</text></g><g class="f" style="animation-delay:1.5999999999999999s"><line x1="194" y1="243" x2="218" y2="243" stroke="#2563eb" stroke-width="2.4" style="--L:24;stroke-dasharray:24;animation:draw .5s ease 1.5999999999999999s both"/><path d="M218,243 L209.7,246.5 L209.7,239.5 Z" fill="#2563eb"/></g><g class="f" style="animation-delay:1.7s"><rect x="220" y="220" width="380" height="46" rx="10" fill="#2563eb" fill-opacity=".14" stroke="#2563eb" stroke-width="2"/><text x="410.0" y="241" text-anchor="middle" class="b">rozlož a zkrať / sdružený výraz</text><text x="410.0" y="258" text-anchor="middle" class="s">(x²−4)/(x−2) = x + 2 → 4</text></g><g class="f" style="animation-delay:1.85s"><line x1="40" y1="301" x2="62" y2="301" stroke="#7c3aed" stroke-width="2.4" style="--L:22;stroke-dasharray:22;animation:draw .5s ease 1.85s both"/><path d="M62,301 L53.7,304.5 L53.7,297.5 Z" fill="#7c3aed"/></g><g class="f" style="animation-delay:1.85s"><rect x="64" y="278" width="128" height="46" rx="10" fill="#7c3aed" fill-opacity=".14" stroke="#7c3aed" stroke-width="2"/><text x="128.0" y="299" text-anchor="middle" class="b">∞ / ∞</text></g><g class="f" style="animation-delay:2.0500000000000003s"><line x1="194" y1="301" x2="218" y2="301" stroke="#7c3aed" stroke-width="2.4" style="--L:24;stroke-dasharray:24;animation:draw .5s ease 2.0500000000000003s both"/><path d="M218,301 L209.7,304.5 L209.7,297.5 Z" fill="#7c3aed"/></g><g class="f" style="animation-delay:2.15s"><rect x="220" y="278" width="380" height="46" rx="10" fill="#7c3aed" fill-opacity=".14" stroke="#7c3aed" stroke-width="2"/><text x="410.0" y="299" text-anchor="middle" class="b">vytkni nejvyšší mocninu</text><text x="410.0" y="316" text-anchor="middle" class="s">(3x²−x)/(2x²+5) → 3/2</text></g><g class="f" style="animation-delay:2.3s"><line x1="40" y1="359" x2="62" y2="359" stroke="#ea580c" stroke-width="2.4" style="--L:22;stroke-dasharray:22;animation:draw .5s ease 2.3s both"/><path d="M62,359 L53.7,362.5 L53.7,355.5 Z" fill="#ea580c"/></g><g class="f" style="animation-delay:2.3s"><rect x="64" y="336" width="128" height="46" rx="10" fill="#ea580c" fill-opacity=".14" stroke="#ea580c" stroke-width="2"/><text x="128.0" y="357" text-anchor="middle" class="b">∞ − ∞</text></g><g class="f" style="animation-delay:2.5s"><line x1="194" y1="359" x2="218" y2="359" stroke="#ea580c" stroke-width="2.4" style="--L:24;stroke-dasharray:24;animation:draw .5s ease 2.5s both"/><path d="M218,359 L209.7,362.5 L209.7,355.5 Z" fill="#ea580c"/></g><g class="f" style="animation-delay:2.5999999999999996s"><rect x="220" y="336" width="380" height="46" rx="10" fill="#ea580c" fill-opacity=".14" stroke="#ea580c" stroke-width="2"/><text x="410.0" y="357" text-anchor="middle" class="b">sdružený výraz nebo spol. jmenovatel</text><text x="410.0" y="374" text-anchor="middle" class="s">√(x²+9) − x = 9/(√(x²+9) + x) → 0</text></g><g class="f" style="animation-delay:2.75s"><line x1="40" y1="417" x2="62" y2="417" stroke="#0d9488" stroke-width="2.4" style="--L:22;stroke-dasharray:22;animation:draw .5s ease 2.75s both"/><path d="M62,417 L53.7,420.5 L53.7,413.5 Z" fill="#0d9488"/></g><g class="f" style="animation-delay:2.75s"><rect x="64" y="394" width="128" height="46" rx="10" fill="#0d9488" fill-opacity=".14" stroke="#0d9488" stroke-width="2"/><text x="128.0" y="415" text-anchor="middle" class="b">1^∞</text></g><g class="f" style="animation-delay:2.95s"><line x1="194" y1="417" x2="218" y2="417" stroke="#0d9488" stroke-width="2.4" style="--L:24;stroke-dasharray:24;animation:draw .5s ease 2.95s both"/><path d="M218,417 L209.7,420.5 L209.7,413.5 Z" fill="#0d9488"/></g><g class="f" style="animation-delay:3.05s"><rect x="220" y="394" width="380" height="46" rx="10" fill="#0d9488" fill-opacity=".14" stroke="#0d9488" stroke-width="2"/><text x="410.0" y="415" text-anchor="middle" class="b">uprav na (1 + 1/n)ⁿ → e</text><text x="410.0" y="432" text-anchor="middle" class="s">(1 + 2/x)ˣ → e²</text></g><text x="20.0" y="466.0" class="s f" style="animation-delay:3.4s">Neurčité (0/0, ∞/∞, ∞−∞, 1^∞, 0·∞, 0⁰, ∞⁰) nikdy „nevyjdou samy“ – vždy uprav nebo l'Hospital (T06).</text></svg>
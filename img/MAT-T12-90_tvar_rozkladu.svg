<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 326" width="620" height="326"><style>text{font-family:'IBM Plex Sans',Arial,sans-serif;fill:#0f172a} .s{font-size:13px} .b{font-weight:700} .m{font-size:15px;font-style:italic}@keyframes fin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}@keyframes draw{from{stroke-dashoffset:var(--L)}to{stroke-dashoffset:0}}.f{opacity:0;animation:fin .6s ease forwards} </style><rect width="620" height="326" rx="14" fill="#ffffff"/><text x="20" y="30" class="b" style="font-size:17px">Parciální zlomky: co je ve jmenovateli → jaký zlomek napíšu</text><g class="f" style="animation-delay:0.2s"><rect x="20" y="45" width="580" height="46" rx="10" fill="#dc2626" fill-opacity=".14" stroke="#dc2626" stroke-width="2"/><text x="310.0" y="67" text-anchor="middle" class="b">0. Stupeň čitatele ≥ stupeň jmenovatele?  →  nejdřív vyděl polynomy</text><text x="310.0" y="84" text-anchor="middle" class="s">(zbytek pak rozkládej)</text></g><g class="f" style="animation-delay:0.7s"><rect x="20" y="110" width="190" height="46" rx="10" fill="#64748b" fill-opacity=".14" stroke="#64748b" stroke-width="2"/><text x="115.0" y="132" text-anchor="middle" class="b">(x − a)</text><text x="115.0" y="149" text-anchor="middle" class="s">ve jmenovateli</text></g><g class="f" style="animation-delay:0.8999999999999999s"><line x1="212" y1="133" x2="236" y2="133" stroke="#2563eb" stroke-width="2.4" style="--L:24;stroke-dasharray:24;animation:draw .5s ease 0.8999999999999999s both"/><path d="M236,133 L227.7,136.5 L227.7,129.5 Z" fill="#2563eb"/></g><g class="f" style="animation-delay:1.0s"><rect x="238" y="110" width="210" height="46" rx="10" fill="#2563eb" fill-opacity=".14" stroke="#2563eb" stroke-width="2"/><text x="343.0" y="132" text-anchor="middle" class="b">A / (x − a)</text><text x="343.0" y="149" text-anchor="middle" class="s">tvar rozkladu</text></g><g class="f" style="animation-delay:1.15s"><line x1="450" y1="133" x2="468" y2="133" stroke="#2563eb" stroke-width="2.4" style="--L:18;stroke-dasharray:18;animation:draw .5s ease 1.15s both"/><path d="M468,133 L459.7,136.5 L459.7,129.5 Z" fill="#2563eb"/></g><g class="f" style="animation-delay:1.25s"><rect x="470" y="110" width="130" height="46" rx="10" fill="#2563eb" fill-opacity=".14" stroke="#2563eb" stroke-width="2"/><text x="535.0" y="132" text-anchor="middle" class="b">A·ln|x − a|</text><text x="535.0" y="149" text-anchor="middle" class="s">výsledek</text></g><g class="f" style="animation-delay:1.2999999999999998s"><rect x="20" y="172" width="190" height="46" rx="10" fill="#64748b" fill-opacity=".14" stroke="#64748b" stroke-width="2"/><text x="115.0" y="194" text-anchor="middle" class="b">(x − a)²</text><text x="115.0" y="211" text-anchor="middle" class="s">ve jmenovateli</text></g><g class="f" style="animation-delay:1.4999999999999998s"><line x1="212" y1="195" x2="236" y2="195" stroke="#ea580c" stroke-width="2.4" style="--L:24;stroke-dasharray:24;animation:draw .5s ease 1.4999999999999998s both"/><path d="M236,195 L227.7,198.5 L227.7,191.5 Z" fill="#ea580c"/></g><g class="f" style="animation-delay:1.5999999999999999s"><rect x="238" y="172" width="210" height="46" rx="10" fill="#ea580c" fill-opacity=".14" stroke="#ea580c" stroke-width="2"/><text x="343.0" y="194" text-anchor="middle" class="b">A/(x−a) + B/(x−a)²</text><text x="343.0" y="211" text-anchor="middle" class="s">tvar rozkladu</text></g><g class="f" style="animation-delay:1.7499999999999998s"><line x1="450" y1="195" x2="468" y2="195" stroke="#ea580c" stroke-width="2.4" style="--L:18;stroke-dasharray:18;animation:draw .5s ease 1.7499999999999998s both"/><path d="M468,195 L459.7,198.5 L459.7,191.5 Z" fill="#ea580c"/></g><g class="f" style="animation-delay:1.8499999999999999s"><rect x="470" y="172" width="130" height="46" rx="10" fill="#ea580c" fill-opacity=".14" stroke="#ea580c" stroke-width="2"/><text x="535.0" y="194" text-anchor="middle" class="b">ln + zlomek</text><text x="535.0" y="211" text-anchor="middle" class="s">výsledek</text></g><g class="f" style="animation-delay:1.9s"><rect x="20" y="234" width="190" height="46" rx="10" fill="#64748b" fill-opacity=".14" stroke="#64748b" stroke-width="2"/><text x="115.0" y="256" text-anchor="middle" class="b">x²+px+q bez kořenů</text><text x="115.0" y="273" text-anchor="middle" class="s">ve jmenovateli</text></g><g class="f" style="animation-delay:2.1s"><line x1="212" y1="257" x2="236" y2="257" stroke="#7c3aed" stroke-width="2.4" style="--L:24;stroke-dasharray:24;animation:draw .5s ease 2.1s both"/><path d="M236,257 L227.7,260.5 L227.7,253.5 Z" fill="#7c3aed"/></g><g class="f" style="animation-delay:2.1999999999999997s"><rect x="238" y="234" width="210" height="46" rx="10" fill="#7c3aed" fill-opacity=".14" stroke="#7c3aed" stroke-width="2"/><text x="343.0" y="256" text-anchor="middle" class="b">(Bx + C)/(x²+px+q)</text><text x="343.0" y="273" text-anchor="middle" class="s">tvar rozkladu</text></g><g class="f" style="animation-delay:2.35s"><line x1="450" y1="257" x2="468" y2="257" stroke="#7c3aed" stroke-width="2.4" style="--L:18;stroke-dasharray:18;animation:draw .5s ease 2.35s both"/><path d="M468,257 L459.7,260.5 L459.7,253.5 Z" fill="#7c3aed"/></g><g class="f" style="animation-delay:2.45s"><rect x="470" y="234" width="130" height="46" rx="10" fill="#7c3aed" fill-opacity=".14" stroke="#7c3aed" stroke-width="2"/><text x="535.0" y="256" text-anchor="middle" class="b">ln + arctg</text><text x="535.0" y="273" text-anchor="middle" class="s">výsledek</text></g><text x="20" y="310" class="s f" style="animation-delay:2.8s">Konstanty A, B, C: vynásob celou rovnici jmenovatelem a dosaď kořeny (nebo porovnej koeficienty).</text></svg>
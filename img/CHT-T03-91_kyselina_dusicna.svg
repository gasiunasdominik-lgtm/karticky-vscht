<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 618" width="620" height="618"><style>text{font-family:'IBM Plex Sans',Arial,sans-serif;fill:#0f172a} .s{font-size:13px} .b{font-weight:700} .t{font-size:17px;font-weight:700} .n{font-size:14px}@keyframes fin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}@keyframes mv{from{stroke-dashoffset:18}to{stroke-dashoffset:0}}.f{opacity:0;animation:fin .6s ease forwards} .fl{stroke-dasharray:11 7;animation:mv .9s linear infinite}</style><rect width="620" height="618" rx="14" fill="#ffffff"/><text x="20" y="32" class="t" text-anchor="start">Kyselina dusičná oxidací amoniaku</text><text x="310.0" y="70" class="s b" text-anchor="middle" style="fill:#ea580c">vzduch (filtr, komprese, ohřev)</text><g class="f" style="animation-delay:0.1s"><path d="M310.0,76.0 L310.0,94.0" fill="none" stroke="#ea580c" stroke-opacity=".25" stroke-width="3.2"/><path d="M310.0,76.0 L310.0,94.0" class="fl" fill="none" stroke="#ea580c" stroke-width="3.2"/><path d="M310.0,102.0 L305.5,92.0 L314.5,92.0 Z" fill="#ea580c"/></g><g class="f" style="animation-delay:0.3s"><rect x="180" y="102" width="260" height="48" rx="10" fill="#64748b" fill-opacity=".13" stroke="#64748b" stroke-width="2"/><text x="310.0" y="122.5" text-anchor="middle" class="b" style="font-size:14px">Mísení NH₃ + vzduch</text><text x="310.0" y="139.5" text-anchor="middle" class="s">NH₃ max. 13 obj. % (mez 15 %)</text></g><g class="f" style="animation-delay:0.5s"><path d="M14.0,126.0 L170.0,126.0" fill="none" stroke="#7c3aed" stroke-opacity=".25" stroke-width="3.2"/><path d="M14.0,126.0 L170.0,126.0" class="fl" fill="none" stroke="#7c3aed" stroke-width="3.2"/><path d="M178.0,126.0 L168.0,130.5 L168.0,121.5 Z" fill="#7c3aed"/><text x="16" y="118.0" class="s" text-anchor="start" style="fill:#7c3aed">NH₃ odpařený</text></g><g class="f" style="animation-delay:0.6s"><path d="M310.0,151.0 L310.0,171.0" fill="none" stroke="#ea580c" stroke-opacity=".25" stroke-width="3.2"/><path d="M310.0,151.0 L310.0,171.0" class="fl" fill="none" stroke="#ea580c" stroke-width="3.2"/><path d="M310.0,179.0 L305.5,169.0 L314.5,169.0 Z" fill="#ea580c"/></g><g class="f" style="animation-delay:0.75s"><rect x="180" y="180" width="260" height="48" rx="10" fill="#dc2626" fill-opacity=".13" stroke="#dc2626" stroke-width="2"/><text x="310.0" y="200.5" text-anchor="middle" class="b" style="font-size:14px">Oxidace na Pt-Rh sítech</text><text x="310.0" y="217.5" text-anchor="middle" class="s">800–950 °C, konverze na NO 95–99 %</text></g><g class="f" style="animation-delay:1.05s"><path d="M310.0,229.0 L310.0,249.0" fill="none" stroke="#ea580c" stroke-opacity=".25" stroke-width="3.2"/><path d="M310.0,229.0 L310.0,249.0" class="fl" fill="none" stroke="#ea580c" stroke-width="3.2"/><path d="M310.0,257.0 L305.5,247.0 L314.5,247.0 Z" fill="#ea580c"/></g><g class="f" style="animation-delay:1.2s"><rect x="180" y="258" width="260" height="48" rx="10" fill="#ea580c" fill-opacity=".13" stroke="#ea580c" stroke-width="2"/><text x="310.0" y="278.5" text-anchor="middle" class="b" style="font-size:14px">Kotel na odpadní teplo</text><text x="310.0" y="295.5" text-anchor="middle" class="s">reakce je exotermní</text></g><g class="f" style="animation-delay:1.4s"><path d="M14.0,282.0 L170.0,282.0" fill="none" stroke="#0284c7" stroke-opacity=".25" stroke-width="3.2"/><path d="M14.0,282.0 L170.0,282.0" class="fl" fill="none" stroke="#0284c7" stroke-width="3.2"/><path d="M178.0,282.0 L168.0,286.5 L168.0,277.5 Z" fill="#0284c7"/><text x="16" y="274.0" class="s" text-anchor="start" style="fill:#0284c7">napájecí voda</text></g><g class="f" style="animation-delay:1.5s"><path d="M442.0,282.0 L598.0,282.0" fill="none" stroke="#dc2626" stroke-opacity=".25" stroke-width="3.2"/><path d="M442.0,282.0 L598.0,282.0" class="fl" fill="none" stroke="#dc2626" stroke-width="3.2"/><path d="M606.0,282.0 L596.0,286.5 L596.0,277.5 Z" fill="#dc2626"/><text x="452" y="274.0" class="s" text-anchor="start" style="fill:#dc2626">pára</text></g><g class="f" style="animation-delay:1.5s"><path d="M310.0,307.0 L310.0,327.0" fill="none" stroke="#ea580c" stroke-opacity=".25" stroke-width="3.2"/><path d="M310.0,307.0 L310.0,327.0" class="fl" fill="none" stroke="#ea580c" stroke-width="3.2"/><path d="M310.0,335.0 L305.5,325.0 L314.5,325.0 Z" fill="#ea580c"/></g><g class="f" style="animation-delay:1.6500000000000001s"><rect x="180" y="336" width="260" height="48" rx="10" fill="#0284c7" fill-opacity=".13" stroke="#0284c7" stroke-width="2"/><text x="310.0" y="356.5" text-anchor="middle" class="b" style="font-size:14px">Chlazení na 40–80 °C</text><text x="310.0" y="373.5" text-anchor="middle" class="s">2 NO + O₂ → 2 NO₂ (bez kat.)</text></g><g class="f" style="animation-delay:1.85s"><path d="M14.0,360.0 L170.0,360.0" fill="none" stroke="#0284c7" stroke-opacity=".25" stroke-width="3.2"/><path d="M14.0,360.0 L170.0,360.0" class="fl" fill="none" stroke="#0284c7" stroke-width="3.2"/><path d="M178.0,360.0 L168.0,364.5 L168.0,355.5 Z" fill="#0284c7"/><text x="16" y="352.0" class="s" text-anchor="start" style="fill:#0284c7">sekundární vzduch</text></g><g class="f" style="animation-delay:1.9500000000000002s"><path d="M310.0,385.0 L310.0,405.0" fill="none" stroke="#ea580c" stroke-opacity=".25" stroke-width="3.2"/><path d="M310.0,385.0 L310.0,405.0" class="fl" fill="none" stroke="#ea580c" stroke-width="3.2"/><path d="M310.0,413.0 L305.5,403.0 L314.5,403.0 Z" fill="#ea580c"/></g><g class="f" style="animation-delay:2.1s"><rect x="180" y="414" width="260" height="48" rx="10" fill="#2563eb" fill-opacity=".13" stroke="#2563eb" stroke-width="2"/><text x="310.0" y="434.5" text-anchor="middle" class="b" style="font-size:14px">Absorpční kolony</text><text x="310.0" y="451.5" text-anchor="middle" class="s">3 NO₂ + H₂O → 2 HNO₃ + NO</text></g><g class="f" style="animation-delay:2.3000000000000003s"><path d="M14.0,438.0 L170.0,438.0" fill="none" stroke="#0284c7" stroke-opacity=".25" stroke-width="3.2"/><path d="M14.0,438.0 L170.0,438.0" class="fl" fill="none" stroke="#0284c7" stroke-width="3.2"/><path d="M178.0,438.0 L168.0,442.5 L168.0,433.5 Z" fill="#0284c7"/><text x="16" y="430.0" class="s" text-anchor="start" style="fill:#0284c7">voda (zdola)</text></g><g class="f" style="animation-delay:2.4s"><path d="M442.0,438.0 L598.0,438.0" fill="none" stroke="#64748b" stroke-opacity=".25" stroke-width="3.2"/><path d="M442.0,438.0 L598.0,438.0" class="fl" fill="none" stroke="#64748b" stroke-width="3.2"/><path d="M606.0,438.0 L596.0,442.5 L596.0,433.5 Z" fill="#64748b"/><text x="452" y="430.0" class="s" text-anchor="start" style="fill:#64748b">odplyn s NOx</text></g><g class="f" style="animation-delay:2.4s"><path d="M310.0,463.0 L310.0,483.0" fill="none" stroke="#16a34a" stroke-opacity=".25" stroke-width="3.2"/><path d="M310.0,463.0 L310.0,483.0" class="fl" fill="none" stroke="#16a34a" stroke-width="3.2"/><path d="M310.0,491.0 L305.5,481.0 L314.5,481.0 Z" fill="#16a34a"/></g><text x="310.0" y="502" class="s b" text-anchor="middle" style="fill:#ea580c">HNO₃ 60–62 hm. % (azeotrop 68,5 %)</text><g class="f" style="animation-delay:2.9s"><rect x="20" y="520" width="580" height="84" rx="10" fill="#ea580c" fill-opacity=".07" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="5 4"/><text x="32" y="541" class="b" style="font-size:14px;fill:#ea580c">Pamatuj</text><text x="32" y="560" class="s">4 NH₃ + 5 O₂ → 4 NO + 6 H₂O      (Pt-Rh)</text><text x="32" y="578" class="s">NO z absorpce se znovu oxiduje a absorbuje (recykl dusíku).</text><text x="32" y="596" class="s">Odplyn: 6 NO₂ + 8 NH₃ → 7 N₂ + 12 H₂O (V₂O₅, 200–350 °C).</text></g></svg>
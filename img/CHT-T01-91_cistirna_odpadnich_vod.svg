<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 674" width="620" height="674"><style>text{font-family:'IBM Plex Sans',Arial,sans-serif;fill:#0f172a} .s{font-size:13px} .b{font-weight:700} .t{font-size:17px;font-weight:700} .n{font-size:14px}@keyframes fin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}@keyframes mv{from{stroke-dashoffset:18}to{stroke-dashoffset:0}}.f{opacity:0;animation:fin .6s ease forwards} .fl{stroke-dasharray:11 7;animation:mv .9s linear infinite}</style><rect width="620" height="674" rx="14" fill="#ffffff"/><text x="20" y="32" class="t" text-anchor="start">Čistírna odpadních vod s aktivací</text><text x="310.0" y="70" class="s b" text-anchor="middle" style="fill:#2563eb">odpadní voda (splašková)</text><g class="f" style="animation-delay:0.1s"><path d="M310.0,76.0 L310.0,92.0" fill="none" stroke="#2563eb" stroke-opacity=".25" stroke-width="3.2"/><path d="M310.0,76.0 L310.0,92.0" class="fl" fill="none" stroke="#2563eb" stroke-width="3.2"/><path d="M310.0,100.0 L305.5,90.0 L314.5,90.0 Z" fill="#2563eb"/></g><g class="f" style="animation-delay:0.3s"><rect x="180" y="100" width="260" height="48" rx="10" fill="#64748b" fill-opacity=".13" stroke="#64748b" stroke-width="2"/><text x="310.0" y="120.5" text-anchor="middle" class="b" style="font-size:14px">Česle + lapač písku a tuků</text><text x="310.0" y="137.5" text-anchor="middle" class="s">mechanické čištění</text></g><g class="f" style="animation-delay:0.6s"><path d="M442.0,124.0 L598.0,124.0" fill="none" stroke="#92400e" stroke-opacity=".25" stroke-width="3.2"/><path d="M442.0,124.0 L598.0,124.0" class="fl" fill="none" stroke="#92400e" stroke-width="3.2"/><path d="M606.0,124.0 L596.0,128.5 L596.0,119.5 Z" fill="#92400e"/><text x="452" y="116.0" class="s" text-anchor="start" style="fill:#92400e">shrabky, písek, tuk</text></g><g class="f" style="animation-delay:0.6s"><path d="M310.0,149.0 L310.0,167.0" fill="none" stroke="#2563eb" stroke-opacity=".25" stroke-width="3.2"/><path d="M310.0,149.0 L310.0,167.0" class="fl" fill="none" stroke="#2563eb" stroke-width="3.2"/><path d="M310.0,175.0 L305.5,165.0 L314.5,165.0 Z" fill="#2563eb"/></g><g class="f" style="animation-delay:0.75s"><rect x="180" y="176" width="260" height="48" rx="10" fill="#92400e" fill-opacity=".13" stroke="#92400e" stroke-width="2"/><text x="310.0" y="196.5" text-anchor="middle" class="b" style="font-size:14px">Usazovák (Dorrův)</text><text x="310.0" y="213.5" text-anchor="middle" class="s">primární kal klesá ke dnu</text></g><g class="f" style="animation-delay:1.05s"><path d="M442.0,200.0 L598.0,200.0" fill="none" stroke="#92400e" stroke-opacity=".25" stroke-width="3.2"/><path d="M442.0,200.0 L598.0,200.0" class="fl" fill="none" stroke="#92400e" stroke-width="3.2"/><path d="M606.0,200.0 L596.0,204.5 L596.0,195.5 Z" fill="#92400e"/><text x="452" y="192.0" class="s" text-anchor="start" style="fill:#92400e">primární kal → vyhnívání</text></g><g class="f" style="animation-delay:1.05s"><path d="M310.0,225.0 L310.0,243.0" fill="none" stroke="#2563eb" stroke-opacity=".25" stroke-width="3.2"/><path d="M310.0,225.0 L310.0,243.0" class="fl" fill="none" stroke="#2563eb" stroke-width="3.2"/><path d="M310.0,251.0 L305.5,241.0 L314.5,241.0 Z" fill="#2563eb"/></g><g class="f" style="animation-delay:1.2s"><rect x="180" y="252" width="260" height="48" rx="10" fill="#7c3aed" fill-opacity=".13" stroke="#7c3aed" stroke-width="2"/><text x="310.0" y="272.5" text-anchor="middle" class="b" style="font-size:14px">Denitrifikace (anoxická)</text><text x="310.0" y="289.5" text-anchor="middle" class="s">NO₃⁻ → N₂, bez vzduchu</text></g><g class="f" style="animation-delay:1.5s"><path d="M442.0,276.0 L598.0,276.0" fill="none" stroke="#64748b" stroke-opacity=".25" stroke-width="3.2"/><path d="M442.0,276.0 L598.0,276.0" class="fl" fill="none" stroke="#64748b" stroke-width="3.2"/><path d="M606.0,276.0 L596.0,280.5 L596.0,271.5 Z" fill="#64748b"/><text x="452" y="268.0" class="s" text-anchor="start" style="fill:#64748b">N₂ do vzduchu</text></g><g class="f" style="animation-delay:1.5s"><path d="M310.0,301.0 L310.0,319.0" fill="none" stroke="#2563eb" stroke-opacity=".25" stroke-width="3.2"/><path d="M310.0,301.0 L310.0,319.0" class="fl" fill="none" stroke="#2563eb" stroke-width="3.2"/><path d="M310.0,327.0 L305.5,317.0 L314.5,317.0 Z" fill="#2563eb"/></g><g class="f" style="animation-delay:1.6500000000000001s"><rect x="180" y="328" width="260" height="48" rx="10" fill="#0284c7" fill-opacity=".13" stroke="#0284c7" stroke-width="2"/><text x="310.0" y="348.5" text-anchor="middle" class="b" style="font-size:14px">Aktivace = nitrifikace</text><text x="310.0" y="365.5" text-anchor="middle" class="s">NH₄⁺ → NO₃⁻, Corg → CO₂</text></g><g class="f" style="animation-delay:1.85s"><path d="M14.0,352.0 L170.0,352.0" fill="none" stroke="#0284c7" stroke-opacity=".25" stroke-width="3.2"/><path d="M14.0,352.0 L170.0,352.0" class="fl" fill="none" stroke="#0284c7" stroke-width="3.2"/><path d="M178.0,352.0 L168.0,356.5 L168.0,347.5 Z" fill="#0284c7"/><text x="16" y="344.0" class="s" text-anchor="start" style="fill:#0284c7">vzduch (dmychadlo)</text></g><g class="f" style="animation-delay:1.9500000000000002s"><path d="M442.0,352.0 L598.0,352.0" fill="none" stroke="#64748b" stroke-opacity=".25" stroke-width="3.2"/><path d="M442.0,352.0 L598.0,352.0" class="fl" fill="none" stroke="#64748b" stroke-width="3.2"/><path d="M606.0,352.0 L596.0,356.5 L596.0,347.5 Z" fill="#64748b"/><text x="452" y="344.0" class="s" text-anchor="start" style="fill:#64748b">CO₂</text></g><g class="f" style="animation-delay:1.9500000000000002s"><path d="M310.0,377.0 L310.0,395.0" fill="none" stroke="#2563eb" stroke-opacity=".25" stroke-width="3.2"/><path d="M310.0,377.0 L310.0,395.0" class="fl" fill="none" stroke="#2563eb" stroke-width="3.2"/><path d="M310.0,403.0 L305.5,393.0 L314.5,393.0 Z" fill="#2563eb"/></g><g class="f" style="animation-delay:2.1s"><rect x="180" y="404" width="260" height="48" rx="10" fill="#0d9488" fill-opacity=".13" stroke="#0d9488" stroke-width="2"/><text x="310.0" y="424.5" text-anchor="middle" class="b" style="font-size:14px">Dosazovací nádrž</text><text x="310.0" y="441.5" text-anchor="middle" class="s">voda se oddělí od kalu</text></g><g class="f" style="animation-delay:2.4s"><path d="M442.0,428.0 L598.0,428.0" fill="none" stroke="#2563eb" stroke-opacity=".25" stroke-width="3.2"/><path d="M442.0,428.0 L598.0,428.0" class="fl" fill="none" stroke="#2563eb" stroke-width="3.2"/><path d="M606.0,428.0 L596.0,432.5 L596.0,423.5 Z" fill="#2563eb"/><text x="452" y="420.0" class="s" text-anchor="start" style="fill:#2563eb">vyčištěná voda → řeka</text></g><g class="f" style="animation-delay:2.4s"><path d="M310.0,453.0 L310.0,471.0" fill="none" stroke="#92400e" stroke-opacity=".25" stroke-width="3.2"/><path d="M310.0,453.0 L310.0,471.0" class="fl" fill="none" stroke="#92400e" stroke-width="3.2"/><path d="M310.0,479.0 L305.5,469.0 L314.5,469.0 Z" fill="#92400e"/></g><g class="f" style="animation-delay:2.55s"><rect x="180" y="480" width="260" height="48" rx="10" fill="#ea580c" fill-opacity=".13" stroke="#ea580c" stroke-width="2"/><text x="310.0" y="500.5" text-anchor="middle" class="b" style="font-size:14px">Vyhnívací nádrž (anaerobní)</text><text x="310.0" y="517.5" text-anchor="middle" class="s">30–60 °C, pH 6,5–7,5</text></g><g class="f" style="animation-delay:2.8499999999999996s"><path d="M442.0,504.0 L598.0,504.0" fill="none" stroke="#ea580c" stroke-opacity=".25" stroke-width="3.2"/><path d="M442.0,504.0 L598.0,504.0" class="fl" fill="none" stroke="#ea580c" stroke-width="3.2"/><path d="M606.0,504.0 L596.0,508.5 L596.0,499.5 Z" fill="#ea580c"/><text x="452" y="496.0" class="s" text-anchor="start" style="fill:#ea580c">bioplyn → kogenerace</text></g><g class="f" style="animation-delay:2.6s"><path d="M178.0,436.0 L150.0,436.0 L150.0,286.0 L170.0,286.0" fill="none" stroke="#92400e" stroke-opacity=".25" stroke-width="3.2"/><path d="M178.0,436.0 L150.0,436.0 L150.0,286.0 L170.0,286.0" class="fl" fill="none" stroke="#92400e" stroke-width="3.2"/><path d="M178.0,286.0 L168.0,290.5 L168.0,281.5 Z" fill="#92400e"/><text x="16" y="386.0" class="s" text-anchor="start" style="fill:#92400e">vratný kal</text><text x="16" y="401.0" class="s" text-anchor="start" style="fill:#92400e">(~95 %)</text></g><g class="f" style="animation-delay:2.8s"><text x="318" y="471.0" class="s" text-anchor="start" style="fill:#92400e">přebytečný kal (~5 %)</text></g><g class="f" style="animation-delay:3.3s"><rect x="20" y="576" width="580" height="84" rx="10" fill="#0284c7" fill-opacity=".07" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="5 4"/><text x="32" y="597" class="b" style="font-size:14px;fill:#0284c7">Reakce v biologickém stupni</text><text x="32" y="616" class="s">nitrifikace (aerobní): NH₄⁺ + 2 O₂ → NO₃⁻ + H₂O + 2 H⁺</text><text x="32" y="634" class="s">denitrifikace (bez O₂): 5 C + 4 H⁺ + 4 NO₃⁻ → 5 CO₂ + 2 H₂O + 2 N₂</text><text x="32" y="652" class="s">BSK₅ ≤ CHSK; fosfor se sráží Fe₂(SO₄)₃.</text></g></svg>
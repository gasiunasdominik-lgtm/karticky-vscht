<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 270" width="620" height="270"><style>text{font-family:'IBM Plex Sans',Arial,sans-serif;fill:#0f172a} .s{font-size:13px} .b{font-weight:700}@keyframes fin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}@keyframes draw{from{stroke-dashoffset:var(--L)}to{stroke-dashoffset:0}}.f{opacity:0;animation:fin .6s ease forwards} </style><rect width="620" height="270" rx="14" fill="#ffffff"/><text x="20" y="30" class="b" style="font-size:17px">Membránou projde jen neionizovaná forma (ibuprofen, pKa 4,4)</text><text x="20" y="82" class="b">žaludek</text><text x="20" y="102" class="s">pH 2</text><rect x="150" y="60" width="440" height="46" rx="8" fill="#16a34a" fill-opacity=".25" stroke="#16a34a"/><rect x="150" y="60" width="3.0" height="46" rx="8" fill="#dc2626" fill-opacity=".45" class="f" style="animation-delay:0.5s"/><text x="165" y="88" class="s b">neionizované 99,6 % – projde membránou</text><text x="20" y="172" class="b">tenké střevo</text><text x="20" y="192" class="s">pH 7</text><rect x="150" y="150" width="440" height="46" rx="8" fill="#16a34a" fill-opacity=".25" stroke="#16a34a"/><rect x="150" y="150" width="438.9" height="46" rx="8" fill="#dc2626" fill-opacity=".45" class="f" style="animation-delay:1.1s"/><text x="160" y="178" class="s b">ionizované 99,75 % – neprojde</text><text x="20" y="250" class="s f" style="animation-delay:1.8s">log([A⁻]/[HA]) = pH − pKa · slabá kyselina: kyselé prostředí → víc neionizované formy</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 438" width="620" height="438"><style>text{font-family:'IBM Plex Sans',Arial,sans-serif;fill:#0f172a} .s{font-size:13px} .b{font-weight:700} .m{font-size:15px;font-style:italic} .t{font-size:17px;font-weight:700} .a{font-size:15px;font-weight:700}@keyframes fin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}@keyframes draw{from{stroke-dashoffset:var(--L)}to{stroke-dashoffset:0}}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}.f{opacity:0;animation:fin .6s ease forwards} .p{animation:pulse 2.4s ease-in-out infinite} </style><rect width="620" height="438" rx="14" fill="#ffffff"/><text x="20.0" y="30.0" class="t" text-anchor="start">Charakter oxidu: čím vyšší oxidační číslo, tím kyselejší</text><defs><linearGradient id="gr" x1="0" x2="1"><stop offset="0" stop-color="#2563eb"/><stop offset=".5" stop-color="#16a34a"/><stop offset="1" stop-color="#dc2626"/></linearGradient></defs><rect x="40" y="80" width="540" height="16" rx="8" fill="url(#gr)" class="f" style="animation-delay:.2s"/><text x="40.0" y="68.0" class="s b f" text-anchor="start" style="fill:#2563eb;animation-delay:0.3s">zásadotvorný (iontový)</text><text x="310.0" y="68.0" class="s b f" text-anchor="middle" style="fill:#16a34a;animation-delay:0.3s">amfoterní</text><text x="580.0" y="68.0" class="s b f" text-anchor="end" style="fill:#dc2626;animation-delay:0.3s">kyselinotvorný (kovalentní)</text><text x="40.0" y="114.0" class="s f" text-anchor="start" style="fill:#64748b;animation-delay:0.4s">nízké ox. č. (+I, +II)</text><text x="310.0" y="114.0" class="s f" text-anchor="middle" style="fill:#64748b;animation-delay:0.4s">střední (+III, +IV)</text><text x="580.0" y="114.0" class="s f" text-anchor="end" style="fill:#64748b;animation-delay:0.4s">vysoké ox. č. (+V až +VII)</text><text x="20.0" y="165.0" class="s b f" text-anchor="start" style="animation-delay:0.8s">Cr</text><line x1="80" y1="160" x2="580" y2="160" stroke="#e2e8f0" stroke-width="2"/><g class="f" style="animation-delay:0.8s"><circle cx="161.4" cy="160" r="7" fill="#2563eb"/><text x="161.4" y="146.0" class="s b" text-anchor="middle">CrO</text><text x="161.4" y="184.0" class="s" text-anchor="middle" style="fill:#2563eb">+II</text></g><g class="f" style="animation-delay:1.05s"><circle cx="304.3" cy="160" r="7" fill="#16a34a"/><text x="304.3" y="146.0" class="s b" text-anchor="middle">Cr₂O₃</text><text x="304.3" y="184.0" class="s" text-anchor="middle" style="fill:#16a34a">+III</text></g><g class="f" style="animation-delay:1.3s"><circle cx="518.6" cy="160" r="7" fill="#dc2626"/><text x="518.6" y="146.0" class="s b" text-anchor="middle">CrO₃</text><text x="518.6" y="184.0" class="s" text-anchor="middle" style="fill:#dc2626">+VI</text></g><text x="20.0" y="227.0" class="s b f" text-anchor="start" style="animation-delay:1.8s">Mn</text><line x1="80" y1="222" x2="580" y2="222" stroke="#e2e8f0" stroke-width="2"/><g class="f" style="animation-delay:1.8s"><circle cx="161.4" cy="222" r="7" fill="#2563eb"/><text x="161.4" y="208.0" class="s b" text-anchor="middle">MnO</text><text x="161.4" y="246.0" class="s" text-anchor="middle" style="fill:#2563eb">+II</text></g><g class="f" style="animation-delay:2.05s"><circle cx="347.1" cy="222" r="7" fill="#64748b"/><text x="347.1" y="208.0" class="s b" text-anchor="middle">MnO₂</text><text x="347.1" y="246.0" class="s" text-anchor="middle" style="fill:#64748b">+IV inertní</text></g><g class="f" style="animation-delay:2.3s"><circle cx="554.3" cy="222" r="7" fill="#dc2626"/><text x="554.3" y="208.0" class="s b" text-anchor="middle">Mn₂O₇</text><text x="554.3" y="246.0" class="s" text-anchor="middle" style="fill:#dc2626">+VII</text></g><text x="20.0" y="289.0" class="s b f" text-anchor="start" style="animation-delay:2.8s">hl. sk.</text><line x1="80" y1="284" x2="580" y2="284" stroke="#e2e8f0" stroke-width="2"/><g class="f" style="animation-delay:2.8s"><circle cx="104.3" cy="284" r="7" fill="#2563eb"/><text x="104.3" y="270.0" class="s b" text-anchor="middle">Na₂O</text><text x="104.3" y="308.0" class="s" text-anchor="middle" style="fill:#2563eb">+I</text></g><g class="f" style="animation-delay:3.05s"><circle cx="304.3" cy="284" r="7" fill="#16a34a"/><text x="304.3" y="270.0" class="s b" text-anchor="middle">Al₂O₃</text><text x="304.3" y="308.0" class="s" text-anchor="middle" style="fill:#16a34a">+III</text></g><g class="f" style="animation-delay:3.3s"><circle cx="561.4" cy="284" r="7" fill="#dc2626"/><text x="561.4" y="270.0" class="s b" text-anchor="middle">SO₃</text><text x="561.4" y="308.0" class="s" text-anchor="middle" style="fill:#dc2626">+VI</text></g><text x="20.0" y="350.0" class="s b f" text-anchor="start" style="fill:#2563eb;animation-delay:4.0s">BaO + H₂O → Ba(OH)₂</text><text x="20.0" y="372.0" class="s b f" text-anchor="start" style="fill:#16a34a;animation-delay:4.3s">Cr₂O₃ + kyselina i hydroxid → Cr³⁺ / [Cr(OH)₄]⁻</text><text x="20.0" y="394.0" class="s b f" text-anchor="start" style="fill:#dc2626;animation-delay:4.6s">CrO₃ + H₂O → H₂CrO₄</text><text x="20.0" y="416.0" class="s f" text-anchor="start" style="fill:#64748b;animation-delay:4.9s">inertní: N₂O, CO, MnO₂ – s vodou ani s H⁺/OH⁻ nereagují</text></svg>
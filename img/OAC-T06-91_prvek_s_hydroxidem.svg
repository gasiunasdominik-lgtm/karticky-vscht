<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 258" width="620" height="258"><style>text{font-family:'IBM Plex Sans',Arial,sans-serif;fill:#0f172a} .s{font-size:13px} .t{font-size:11.5px} .b{font-weight:700} .h{font-size:17px;font-weight:700}@keyframes fin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}@keyframes draw{from{stroke-dashoffset:var(--L)}to{stroke-dashoffset:0}}@keyframes flow{to{stroke-dashoffset:-24}}.f{opacity:0;animation:fin .6s ease forwards}</style><rect width="620" height="258" rx="14" fill="#ffffff"/><text x="20" y="30" class="h">Prvek + horký hydroxid</text><g class="f" style="animation-delay:0.30s"><rect x="20" y="50" width="290" height="48" rx="10" fill="#64748b" fill-opacity=".14" stroke="#64748b" stroke-width="2"/><text x="165" y="78" text-anchor="middle" class="s b">je to kov?</text></g><g class="f" style="animation-delay:0.50s"><line x1="312" y1="74" x2="358" y2="74" stroke="#2563eb" stroke-width="2.4" style="--L:46;stroke-dasharray:46;animation:draw .5s ease 0.50s both"/><path d="M358,74 L349.7,77.5 L349.7,70.5 Z" fill="#2563eb"/></g><text x="320" y="66" class="t b" style="fill:#2563eb">ano</text><g class="f" style="animation-delay:0.65s"><rect x="360" y="50" width="240" height="48" rx="10" fill="#2563eb" fill-opacity=".14" stroke="#2563eb" stroke-width="2"/><text x="480" y="70" text-anchor="middle" class="s b">hydroxokomplex + H₂</text><text x="480" y="86" text-anchor="middle" class="t">2Al+2NaOH+6H₂O→2Na[Al(OH)₄]+3H₂</text></g><g class="f" style="animation-delay:0.60s"><line x1="165" y1="99" x2="165" y2="114" stroke="#64748b" stroke-width="2.4" style="--L:15;stroke-dasharray:15;animation:draw .5s ease 0.60s both"/><path d="M165,114 L161.5,105.7 L168.5,105.7 Z" fill="#64748b"/></g><text x="173" y="111" class="t" style="fill:#64748b">ne</text><g class="f" style="animation-delay:0.80s"><rect x="20" y="116" width="290" height="48" rx="10" fill="#64748b" fill-opacity=".14" stroke="#64748b" stroke-width="2"/><
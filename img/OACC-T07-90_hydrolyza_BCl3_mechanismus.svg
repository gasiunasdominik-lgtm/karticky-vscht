<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 478" width="620" height="478"><style>text{font-family:'IBM Plex Sans',Arial,sans-serif;fill:#0f172a} .s{font-size:13px} .b{font-weight:700} .m{font-size:15px;font-style:italic} .t{font-size:17px;font-weight:700} .a{font-size:15px;font-weight:700}@keyframes fin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}@keyframes draw{from{stroke-dashoffset:var(--L)}to{stroke-dashoffset:0}}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}.f{opacity:0;animation:fin .6s ease forwards} .p{animation:pulse 2.4s ease-in-out infinite} </style><rect width="620" height="478" rx="14" fill="#ffffff"/><text x="20.0" y="30.0" class="t" text-anchor="start">Hydrolýza BCl₃ = adice LB na LK + eliminace HCl (3×)</text><g class="f" style="animation-delay:0.2s"><rect x="20" y="50" width="175" height="72" rx="10" fill="#16a34a" fill-opacity=".13" stroke="#16a34a" stroke-width="2"/><text x="107.5" y="71" text-anchor="middle" class="b s">BCl₃ (LK)</text><text x="107.5" y="88" text-anchor="middle" class="s">B má 6 e⁻ a prázdný</text><text x="107.5" y="105" text-anchor="middle" class="s">orbital 2p</text></g><g class="f" style="animation-delay:0.5s"><rect x="222" y="50" width="175" height="72" rx="10" fill="#2563eb" fill-opacity=".13" stroke="#2563eb" stroke-width="2"/><text x="309.5" y="71" text-anchor="middle" class="b s">H₂O (LB)</text><text x="309.5" y="88" text-anchor="middle" class="s">volný pár na O</text><text x="309.5" y="105" text-anchor="middle" class="s">= nukleofil</text></g><g class="f" style="animation-delay:0.9s"><rect x="424" y="50" width="176" height="72" rx="10" fill="#7c3aed" fill-opacity=".13" stroke="#7c3aed" stroke-width="2"/><text x="512.0" y="71" text-anchor="middle" class="b s">1) adice</text><text x="512.0" y="88" text-anchor="middle" class="s">Cl₃B←OH₂</text><text x="512.0" y="105" text-anchor="middle" class="s">adukt, B sp³</text></g><g class="f" style="animation-delay:0.45s"><line x1="196.0" y1="86.0" x2="220.0" y2="86.0" stroke="#64748b" stroke-width="2.4" style="--L:24;stroke-dasharray:24;animation:draw .5s ease 0.45s both"/><path d="M220.0,86.0 L211.7,89.5 L211.7,82.5 Z" fill="#64748b"/></g><g class="f" style="animation-delay:0.85s"><line x1="398.0" y1="86.0" x2="422.0" y2="86.0" stroke="#7c3aed" stroke-width="2.4" style="--L:24;stroke-dasharray:24;animation:draw .5s ease 0.85s both"/><path d="M422.0,86.0 L413.7,89.5 L413.7,82.5 Z" fill="#7c3aed"/></g><g class="f" style="animation-delay:1.2s"><line x1="512.0" y1="124.0" x2="512.0" y2="152.0" stroke="#7c3aed" stroke-width="2.4" style="--L:28;stroke-dasharray:28;animation:draw .5s ease 1.2s both"/><path d="M512.0,152.0 L508.5,143.7 L515.5,143.7 Z" fill="#7c3aed"/></g><g class="f" style="animation-delay:1.4s"><rect x="380" y="154" width="220" height="64" rx="10" fill="#ea580c" fill-opacity=".13" stroke="#ea580c" stroke-width="2"/><text x="490.0" y="175" text-anchor="middle" class="b s">2) eliminace HCl</text><text x="490.0" y="192" text-anchor="middle" class="s">Cl₂B–OH + HCl</text></g><g class="f" style="animation-delay:1.8s"><line x1="378.0" y1="186.0" x2="288.0" y2="186.0" stroke="#ea580c" stroke-width="2.4" style="--L:90;stroke-dasharray:90;animation:draw .5s ease 1.8s both"/><path d="M288.0,186.0 L296.3,182.5 L296.3,189.5 Z" fill="#ea580c"/><text x="303.0" y="178.0" class="s" style="fill:#ea580c">ještě 2×</text></g><g class="f" style="animation-delay:2.2s"><rect x="20" y="154" width="266" height="64" rx="10" fill="#0d9488" fill-opacity=".13" stroke="#0d9488" stroke-width="2"/><text x="153.0" y="175" text-anchor="middle" class="b s">B(OH)₃ + 3 HCl</text><text x="153.0" y="192" text-anchor="middle" class="s">BCl₃ + 3 H₂O → B(OH)₃ + 3 HCl</text></g><text x="20.0" y="252.0" class="s b f" text-anchor="start" style="animation-delay:2.6s">Proč CCl₄ s vodou nereaguje (a SiCl₄ ano)?</text><g class="f" style="animation-delay:2.9s"><rect x="20" y="266" width="110" height="44" rx="10" fill="#dc2626" fill-opacity=".13" stroke="#dc2626" stroke-width="2"/><text x="75.0" y="287" text-anchor="middle" class="b s">CCl₄</text></g><text x="142.0" y="284.0" class="s f" text-anchor="start" style="animation-delay:3.0s">C má oktet, žádný volný orbital, malý atom stíněný 4 Cl</text><text x="142.0" y="303.0" class="s b f" text-anchor="start" style="fill:#dc2626;animation-delay:3.1s">nereaguje</text><g class="f" style="animation-delay:3.3s"><rect x="20" y="318" width="110" height="44" rx="10" fill="#16a34a" fill-opacity=".13" stroke="#16a34a" stroke-width="2"/><text x="75.0" y="339" text-anchor="middle" class="b s">SiCl₄</text></g><text x="142.0" y="336.0" class="s f" text-anchor="start" style="animation-delay:3.4s">Si je větší, může zvýšit KČ na 5–6 → voda se naváže</text><text x="142.0" y="355.0" class="s b f" text-anchor="start" style="fill:#16a34a;animation-delay:3.5s">→ H₄SiO₄ + 4 HCl</text><g class="f" style="animation-delay:3.7s"><rect x="20" y="370" width="110" height="44" rx="10" fill="#dc2626" fill-opacity=".13" stroke="#dc2626" stroke-width="2"/><text x="75.0" y="391" text-anchor="middle" class="b s">SF₆, CF₄</text></g><text x="142.0" y="388.0" class="s f" text-anchor="start" style="animation-delay:3.8000000000000003s">nasycené, stericky chráněné, pevné vazby</text><text x="142.0" y="407.0" class="s b f" text-anchor="start" style="fill:#dc2626;animation-delay:3.9000000000000004s">kineticky inertní</text><g class="f" style="animation-delay:4.1s"><rect x="20" y="422" width="110" height="44" rx="10" fill="#16a34a" fill-opacity=".13" stroke="#16a34a" stroke-width="2"/><text x="75.0" y="443" text-anchor="middle" class="b s">PCl₃, POCl₃</text></g><text x="142.0" y="440.0" class="s f" text-anchor="start" style="animation-delay:4.199999999999999s">P δ+, místo pro vodu</text><text x="142.0" y="459.0" class="s b f" text-anchor="start" style="fill:#16a34a;animation-delay:4.3s">→ H₃PO₃ / H₃PO₄</text></svg>
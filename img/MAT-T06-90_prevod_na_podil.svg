<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 394" width="620" height="394"><style>text{font-family:'IBM Plex Sans',Arial,sans-serif;fill:#0f172a} .s{font-size:13px} .b{font-weight:700} .m{font-size:15px;font-style:italic}@keyframes fin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}@keyframes draw{from{stroke-dashoffset:var(--L)}to{stroke-dashoffset:0}}@keyframes loop2{0%{opacity:0}3%{opacity:1}47.0%{opacity:1}50.0%{opacity:0}100%{opacity:0}}@keyframes loop3{0%{opacity:0}3%{opacity:1}30.3%{opacity:1}33.3%{opacity:0}100%{opacity:0}}@keyframes loop4{0%{opacity:0}3%{opacity:1}22.0%{opacity:1}25.0%{opacity:0}100%{opacity:0}}@keyframes loop5{0%{opacity:0}3%{opacity:1}17.0%{opacity:1}20.0%{opacity:0}100%{opacity:0}}@keyframes loop6{0%{opacity:0}3%{opacity:1}13.7%{opacity:1}16.7%{opacity:0}100%{opacity:0}}@keyframes stay{0%{opacity:0}4%{opacity:1}92%{opacity:1}100%{opacity:0}}.f{opacity:0;animation:fin .6s ease forwards} .q{opacity:0} </style><rect width="620" height="394" rx="14" fill="#ffffff"/><text x="20" y="30" class="b" style="font-size:17px">L'Hospital: nejdřív převeď na 0/0 nebo ∞/∞</text><g class="f" style="animation-delay:0.3s"><rect x="20" y="52" width="130" height="46" rx="10" fill="#ea580c" fill-opacity=".14" stroke="#ea580c" stroke-width="2"/><text x="85.0" y="73" text-anchor="middle" class="b">0 · ∞</text></g><g class="f" style="animation-delay:0.5s"><line x1="152" y1="75" x2="178" y2="75" stroke="#ea580c" stroke-width="2.4" style="--L:26;stroke-dasharray:26;animation:draw .5s ease 0.5s both"/><path d="M178,75 L169.7,78.5 L169.7,71.5 Z" fill="#ea580c"/></g><g class="f" style="animation-delay:0.6s"><rect x="180" y="52" width="270" height="46" rx="10" fill="#ea580c" fill-opacity=".14" stroke="#ea580c" stroke-width="2"/><text x="315.0" y="73" text-anchor="middle" class="b">f·g = f / (1/g)</text></g><g class="f" style="animation-delay:0.7s"><line x1="452" y1="75" x2="472" y2="100" stroke="#ea580c" stroke-width="2.4" style="--L:32;stroke-dasharray:32;animation:draw .5s ease 0.7s both"/><path d="M472,100 L464.1,95.7 L469.6,91.3 Z" fill="#ea580c"/></g><g class="f" style="animation-delay:0.75s"><rect x="20" y="110" width="130" height="46" rx="10" fill="#dc2626" fill-opacity=".14" stroke="#dc2626" stroke-width="2"/><text x="85.0" y="131" text-anchor="middle" class="b">∞ − ∞</text></g><g class="f" style="animation-delay:0.95s"><line x1="152" y1="133" x2="178" y2="133" stroke="#dc2626" stroke-width="2.4" style="--L:26;stroke-dasharray:26;animation:draw .5s ease 0.95s both"/><path d="M178,133 L169.7,136.5 L169.7,129.5 Z" fill="#dc2626"/></g><g class="f" style="animation-delay:1.05s"><rect x="180" y="110" width="270" height="46" rx="10" fill="#dc2626" fill-opacity=".14" stroke="#dc2626" stroke-width="2"/><text x="315.0" y="131" text-anchor="middle" class="b">spol. jmenovatel / sdružený výraz</text></g><g class="f" style="animation-delay:1.15s"><line x1="452" y1="133" x2="472" y2="120" stroke="#dc2626" stroke-width="2.4" style="--L:24;stroke-dasharray:24;animation:draw .5s ease 1.15s both"/><path d="M472,120 L467.0,127.5 L463.1,121.6 Z" fill="#dc2626"/></g><g class="f" style="animation-delay:1.2s"><rect x="20" y="168" width="130" height="46" rx="10" fill="#7c3aed" fill-opacity=".14" stroke="#7c3aed" stroke-width="2"/><text x="85.0" y="189" text-anchor="middle" class="b">1^∞,  0⁰,  ∞⁰</text></g><g class="f" style="animation-delay:1.4s"><line x1="152" y1="191" x2="178" y2="191" stroke="#7c3aed" stroke-width="2.4" style="--L:26;stroke-dasharray:26;animation:draw .5s ease 1.4s both"/><path d="M178,191 L169.7,194.5 L169.7,187.5 Z" fill="#7c3aed"/></g><g class="f" style="animation-delay:1.5s"><rect x="180" y="168" width="270" height="46" rx="10" fill="#7c3aed" fill-opacity=".14" stroke="#7c3aed" stroke-width="2"/><text x="315.0" y="189" text-anchor="middle" class="b">fᵍ = e^(g·ln f), počítej lim g·ln f</text></g><g class="f" style="animation-delay:1.6s"><line x1="452" y1="191" x2="472" y2="140" stroke="#7c3aed" stroke-width="2.4" style="--L:55;stroke-dasharray:55;animation:draw .5s ease 1.6s both"/><path d="M472,140 L472.2,149.0 L465.7,146.4 Z" fill="#7c3aed"/></g><g class="f" style="animation-delay:1.6s"><rect x="474" y="78" width="126" height="84" rx="10" fill="#2563eb" fill-opacity=".14" stroke="#2563eb" stroke-width="2"/><text x="537.0" y="99" text-anchor="middle" class="b">0/0  nebo  ∞/∞</text><text x="537.0" y="116" text-anchor="middle" class="s">napiš typ</text><text x="537.0" y="133" text-anchor="middle" class="s">nad rovnítko</text></g><g class="f" style="animation-delay:1.9s"><line x1="537" y1="164" x2="537" y2="214" stroke="#2563eb" stroke-width="2.4" style="--L:50;stroke-dasharray:50;animation:draw .5s ease 1.9s both"/><path d="M537,214 L533.5,205.7 L540.5,205.7 Z" fill="#2563eb"/></g><g class="f" style="animation-delay:2.1s"><rect x="250" y="216" width="350" height="58" rx="10" fill="#2563eb" fill-opacity=".14" stroke="#2563eb" stroke-width="2"/><text x="425.0" y="237" text-anchor="middle" class="b">lim f/g = lim f′/g′</text><text x="425.0" y="254" text-anchor="middle" class="s">derivuj čitatel a jmenovatel ZVLÁŠŤ</text></g><g class="f" style="animation-delay:2.5s"><line x1="248" y1="245" x2="182" y2="245" stroke="#64748b" stroke-width="2.4" style="--L:66;stroke-dasharray:66;animation:draw .5s ease 2.5s both"/><path d="M182,245 L190.3,241.5 L190.3,248.5 Z" fill="#64748b"/></g><g class="f" style="animation-delay:2.6s"><rect x="20" y="216" width="160" height="58" rx="10" fill="#64748b" fill-opacity=".14" stroke="#64748b" stroke-width="2"/><text x="100.0" y="237" text-anchor="middle" class="b">dosaď znovu</text><text x="100.0" y="254" text-anchor="middle" class="s">pořád 0/0? opakuj</text></g><g class="f" style="animation-delay:2.9s"><line x1="100" y1="276" x2="100" y2="304" stroke="#16a34a" stroke-width="2.4" style="--L:28;stroke-dasharray:28;animation:draw .5s ease 2.9s both"/><path d="M100,304 L96.5,295.7 L103.5,295.7 Z" fill="#16a34a"/></g><g class="f" style="animation-delay:3.1s"><rect x="20" y="306" width="580" height="46" rx="10" fill="#16a34a" fill-opacity=".14" stroke="#16a34a" stroke-width="2"/><text x="310.0" y="327" text-anchor="middle" class="b">určitý výraz → výsledek (u mocnin ještě dosaď do e^(…))</text></g><text x="20.0" y="378.0" class="s f" style="fill:#dc2626;animation-delay:3.5s">Pozor: podíl derivací, NE derivace podílu. Na určitý výraz (např. π/0) pravidlo nesmíš použít.</text></svg>
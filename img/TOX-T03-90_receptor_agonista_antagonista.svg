<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 300" width="620" height="300"><style>text{font-family:'IBM Plex Sans',Arial,sans-serif;fill:#0f172a} .s{font-size:13px} .b{font-weight:700}@keyframes fin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}@keyframes draw{from{stroke-dashoffset:var(--L)}to{stroke-dashoffset:0}}.f{opacity:0;animation:fin .6s ease forwards} @keyframes kin{0%{transform:translateY(30px);opacity:.3}40%,80%{transform:translateY(-44px);opacity:1}100%{transform:translateY(30px);opacity:.3}}</style><rect width="620" height="300" rx="14" fill="#ffffff"/><text x="20" y="30" class="b" style="font-size:17px">Specifický účinek: látka a její cíl jako klíč a zámek</text><g class="f" style="animation-delay:0.2s"><rect x="20" y="50" width="185" height="210" rx="12" fill="#16a34a" fill-opacity=".08" stroke="#16a34a" stroke-width="2"/><text x="112" y="74" text-anchor="middle" class="b">agonista</text><path d="M72,170 v-40 h80 v40 h-22 l-8,-14 h-20 l-8,14 z" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/><text x="112" y="150" text-anchor="middle" class="s">receptor</text><g style="animation:kin 2.4s ease 0.6000000000000001s infinite"><path d="M94,226 l8,-14 h20 l8,14 z" fill="#16a34a"/><circle cx="112" cy="238" r="12" fill="#16a34a"/></g><text x="112" y="104" text-anchor="middle" class="s b" style="fill:#16a34a">zapadne a odemkne</text><text x="112" y="282" text-anchor="middle" class="s">afinita + vnitřní aktivita</text></g><g class="f" style="animation-delay:0.7s"><rect x="217" y="50" width="185" height="210" rx="12" fill="#ea580c" fill-opacity=".08" stroke="#ea580c" stroke-width="2"/><text x="309" y="74" text-anchor="middle" class="b">antagonista</text><path d="M269,170 v-40 h80 v40 h-22 l-8,-14 h-20 l-8,14 z" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/><text x="309" y="150" text-anchor="middle" class="s">receptor</text><g style="animation:kin 2.4s ease 1.1s infinite"><path d="M291,226 l8,-14 h20 l8,14 z" fill="#ea580c"/><circle cx="309" cy="238" r="12" fill="#ea580c"/></g><text x="309" y="104" text-anchor="middle" class="s b" style="fill:#ea580c">zapadne, neodemkne</text><text x="309" y="282" text-anchor="middle" class="s">jen afinita – blokuje</text></g><g class="f" style="animation-delay:1.2s"><rect x="414" y="50" width="185" height="210" rx="12" fill="#64748b" fill-opacity=".08" stroke="#64748b" stroke-width="2"/><text x="506" y="74" text-anchor="middle" class="b">bez látky</text><path d="M466,170 v-40 h80 v40 h-22 l-8,-14 h-20 l-8,14 z" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/><text x="506" y="150" text-anchor="middle" class="s">receptor</text><text x="506" y="104" text-anchor="middle" class="s b" style="fill:#64748b">zámek volný</text><text x="506" y="282" text-anchor="middle" class="s">tělo si ho otevře samo</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 335" width="620" height="335"><style>text{font-family:'IBM Plex Sans',Arial,sans-serif;fill:#0f172a} .s{font-size:13px} .b{font-weight:700} .m{font-size:15px;font-style:italic}@keyframes fin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}@keyframes draw{from{stroke-dashoffset:var(--L)}to{stroke-dashoffset:0}}@keyframes loop2{0%{opacity:0}3%{opacity:1}47.0%{opacity:1}50.0%{opacity:0}100%{opacity:0}}@keyframes loop3{0%{opacity:0}3%{opacity:1}30.3%{opacity:1}33.3%{opacity:0}100%{opacity:0}}@keyframes loop4{0%{opacity:0}3%{opacity:1}22.0%{opacity:1}25.0%{opacity:0}100%{opacity:0}}@keyframes loop5{0%{opacity:0}3%{opacity:1}17.0%{opacity:1}20.0%{opacity:0}100%{opacity:0}}@keyframes loop6{0%{opacity:0}3%{opacity:1}13.7%{opacity:1}16.7%{opacity:0}100%{opacity:0}}@keyframes stay{0%{opacity:0}4%{opacity:1}92%{opacity:1}100%{opacity:0}}.f{opacity:0;animation:fin .6s ease forwards} .q{opacity:0} </style><rect width="620" height="335" rx="14" fill="#ffffff"/><text x="20" y="30" class="b" style="font-size:17px">Průnik podmínek na ose: f(x) = ln x / (2x² + 3x − 2)</text><g class="f" style="animation-delay:0.2s"><line x1="40" y1="85" x2="590" y2="85" stroke="#94a3b8" stroke-width="1.5"/><text x="20.0" y="73.0" class="s b" style="fill:#7c3aed">ln x  →  x > 0</text></g><g class="f" style="animation-delay:.5s"><rect x="310" y="78" width="280" height="14" rx="4" fill="#7c3aed" fill-opacity=".35"/><circle cx="310" cy="85" r="6" fill="#fff" stroke="#7c3aed" stroke-width="2.5"/></g><g class="f" style="animation-delay:0.3s"><line x1="310" y1="79" x2="310" y2="91" stroke="#64748b"/><text x="310.0" y="107.0" class="s" text-anchor="middle">0</text></g><g class="f" style="animation-delay:1.0s"><line x1="40" y1="170" x2="590" y2="170" stroke="#94a3b8" stroke-width="1.5"/><text x="20.0" y="158.0" class="s b" style="fill:#dc2626">2x² + 3x − 2 ≠ 0  →  x ≠ −2,  x ≠ ½</text></g><g class="f" style="animation-delay:1.3s"><rect x="40" y="163" width="550" height="14" rx="4" fill="#dc2626" fill-opacity=".25"/><circle cx="110" cy="170" r="6" fill="#fff" stroke="#dc2626" stroke-width="2.5"/><circle cx="360.0" cy="170" r="6" fill="#fff" stroke="#dc2626" stroke-width="2.5"/></g><g class="f" style="animation-delay:1.1s"><line x1="110" y1="164" x2="110" y2="176" stroke="#64748b"/><text x="110.0" y="192.0" class="s" text-anchor="middle">−2</text></g><g class="f" style="animation-delay:1.1s"><line x1="360.0" y1="164" x2="360.0" y2="176" stroke="#64748b"/><text x="360.0" y="192.0" class="s" text-anchor="middle">½</text></g><g class="f" style="animation-delay:2.0s"><line x1="40" y1="265" x2="590" y2="265" stroke="#94a3b8" stroke-width="1.5"/><text x="20.0" y="253.0" class="s b" style="fill:#16a34a">průnik = D(f)</text></g><g class="f" style="animation-delay:2.4s"><rect x="310" y="258" width="280" height="14" rx="4" fill="#16a34a" fill-opacity=".45"/><circle cx="310" cy="265" r="6" fill="#fff" stroke="#16a34a" stroke-width="2.5"/><circle cx="360.0" cy="265" r="6" fill="#fff" stroke="#16a34a" stroke-width="2.5"/></g><g class="f" style="animation-delay:2.1s"><line x1="310" y1="259" x2="310" y2="271" stroke="#64748b"/><text x="310.0" y="287.0" class="s" text-anchor="middle">0</text></g><g class="f" style="animation-delay:2.1s"><line x1="360.0" y1="259" x2="360.0" y2="271" stroke="#64748b"/><text x="360.0" y="287.0" class="s" text-anchor="middle">½</text></g><text x="20.0" y="317.0" class="b f" style="animation-delay:2.8s">D(f) = (0; ½) ∪ (½; ∞)      prázdný kroužek = bod nepatří</text></svg>
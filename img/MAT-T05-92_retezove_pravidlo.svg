<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 340" width="620" height="340"><style>text{font-family:'IBM Plex Sans',Arial,sans-serif;fill:#0f172a} .s{font-size:13px} .b{font-weight:700} .m{font-size:15px;font-style:italic}@keyframes fin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}@keyframes draw{from{stroke-dashoffset:var(--L)}to{stroke-dashoffset:0}}@keyframes loop2{0%{opacity:0}3%{opacity:1}47.0%{opacity:1}50.0%{opacity:0}100%{opacity:0}}@keyframes loop3{0%{opacity:0}3%{opacity:1}30.3%{opacity:1}33.3%{opacity:0}100%{opacity:0}}@keyframes loop4{0%{opacity:0}3%{opacity:1}22.0%{opacity:1}25.0%{opacity:0}100%{opacity:0}}@keyframes loop5{0%{opacity:0}3%{opacity:1}17.0%{opacity:1}20.0%{opacity:0}100%{opacity:0}}@keyframes loop6{0%{opacity:0}3%{opacity:1}13.7%{opacity:1}16.7%{opacity:0}100%{opacity:0}}@keyframes stay{0%{opacity:0}4%{opacity:1}92%{opacity:1}100%{opacity:0}}.f{opacity:0;animation:fin .6s ease forwards} .q{opacity:0} @keyframes spin{to{transform:rotate(360deg)}}@keyframes spinr{to{transform:rotate(-360deg)}}</style><rect width="620" height="340" rx="14" fill="#ffffff"/><text x="20" y="30" class="b" style="font-size:17px">Řetězové pravidlo: rychlosti změn se NÁSOBÍ</text><g class="f" style="animation-delay:0.2s"><rect x="20" y="60" width="120" height="56" rx="10" fill="#64748b" fill-opacity=".14" stroke="#64748b" stroke-width="2"/><text x="80.0" y="81" text-anchor="middle" class="b">x</text><text x="80.0" y="98" text-anchor="middle" class="s">mění se o dx</text></g><g class="f" style="animation-delay:0.8s"><rect x="250" y="60" width="120" height="56" rx="10" fill="#2563eb" fill-opacity=".14" stroke="#2563eb" stroke-width="2"/><text x="310.0" y="81" text-anchor="middle" class="b">u = g(x)</text><text x="310.0" y="98" text-anchor="middle" class="s">vnitřní funkce</text></g><g class="f" style="animation-delay:1.4s"><rect x="480" y="60" width="120" height="56" rx="10" fill="#dc2626" fill-opacity=".14" stroke="#dc2626" stroke-width="2"/><text x="540.0" y="81" text-anchor="middle" class="b">y = f(u)</text><text x="540.0" y="98" text-anchor="middle" class="s">vnější funkce</text></g><g class="f" style="animation-delay:0.5s"><line x1="142" y1="88" x2="248" y2="88" stroke="#2563eb" stroke-width="2.4" style="--L:106;stroke-dasharray:106;animation:draw .5s ease 0.5s both"/><path d="M248,88 L239.7,91.5 L239.7,84.5 Z" fill="#2563eb"/><text x="201.0" y="84.0" class="s" style="fill:#2563eb">× g′(x)</text></g><g class="f" style="animation-delay:1.1s"><line x1="372" y1="88" x2="478" y2="88" stroke="#dc2626" stroke-width="2.4" style="--L:106;stroke-dasharray:106;animation:draw .5s ease 1.1s both"/><path d="M478,88 L469.7,91.5 L469.7,84.5 Z" fill="#dc2626"/><text x="431.0" y="84.0" class="s" style="fill:#dc2626">× f′(u)</text></g><g><g style="transform-origin:80px 200px;animation:spin 6s linear infinite"><rect x="76" y="163" width="8" height="10" rx="2" fill="#64748b" transform="rotate(0.0 80 200)"/><rect x="76" y="163" width="8" height="10" rx="2" fill="#64748b" transform="rotate(45.0 80 200)"/><rect x="76" y="163" width="8" height="10" rx="2" fill="#64748b" transform="rotate(90.0 80 200)"/><rect x="76" y="163" width="8" height="10" rx="2" fill="#64748b" transform="rotate(135.0 80 200)"/><rect x="76" y="163" width="8" height="10" rx="2" fill="#64748b" transform="rotate(180.0 80 200)"/><rect x="76" y="163" width="8" height="10" rx="2" fill="#64748b" transform="rotate(225.0 80 200)"/><rect x="76" y="163" width="8" height="10" rx="2" fill="#64748b" transform="rotate(270.0 80 200)"/><rect x="76" y="163" width="8" height="10" rx="2" fill="#64748b" transform="rotate(315.0 80 200)"/><circle cx="80" cy="200" r="30" fill="#64748b" fill-opacity=".18" stroke="#64748b" stroke-width="3"/><line x1="80" y1="200" x2="104" y2="200" stroke="#64748b" stroke-width="3"/></g></g><g><g style="transform-origin:310px 200px;animation:spinr 3s linear infinite"><rect x="306" y="163" width="8" height="10" rx="2" fill="#2563eb" transform="rotate(0.0 310 200)"/><rect x="306" y="163" width="8" height="10" rx="2" fill="#2563eb" transform="rotate(45.0 310 200)"/><rect x="306" y="163" width="8" height="10" rx="2" fill="#2563eb" transform="rotate(90.0 310 200)"/><rect x="306" y="163" width="8" height="10" rx="2" fill="#2563eb" transform="rotate(135.0 310 200)"/><rect x="306" y="163" width="8" height="10" rx="2" fill="#2563eb" transform="rotate(180.0 310 200)"/><rect x="306" y="163" width="8" height="10" rx="2" fill="#2563eb" transform="rotate(225.0 310 200)"/><rect x="306" y="163" width="8" height="10" rx="2" fill="#2563eb" transform="rotate(270.0 310 200)"/><rect x="306" y="163" width="8" height="10" rx="2" fill="#2563eb" transform="rotate(315.0 310 200)"/><circle cx="310" cy="200" r="30" fill="#2563eb" fill-opacity=".18" stroke="#2563eb" stroke-width="3"/><line x1="310" y1="200" x2="334" y2="200" stroke="#2563eb" stroke-width="3"/></g></g><g><g style="transform-origin:540px 200px;animation:spin 1s linear infinite"><rect x="536" y="163" width="8" height="10" rx="2" fill="#dc2626" transform="rotate(0.0 540 200)"/><rect x="536" y="163" width="8" height="10" rx="2" fill="#dc2626" transform="rotate(45.0 540 200)"/><rect x="536" y="163" width="8" height="10" rx="2" fill="#dc2626" transform="rotate(90.0 540 200)"/><rect x="536" y="163" width="8" height="10" rx="2" fill="#dc2626" transform="rotate(135.0 540 200)"/><rect x="536" y="163" width="8" height="10" rx="2" fill="#dc2626" transform="rotate(180.0 540 200)"/><rect x="536" y="163" width="8" height="10" rx="2" fill="#dc2626" transform="rotate(225.0 540 200)"/><rect x="536" y="163" width="8" height="10" rx="2" fill="#dc2626" transform="rotate(270.0 540 200)"/><rect x="536" y="163" width="8" height="10" rx="2" fill="#dc2626" transform="rotate(315.0 540 200)"/><circle cx="540" cy="200" r="30" fill="#dc2626" fill-opacity=".18" stroke="#dc2626" stroke-width="3"/><line x1="540" y1="200" x2="564" y2="200" stroke="#dc2626" stroke-width="3"/></g></g><text x="80.0" y="255.0" class="s" text-anchor="middle">1 otáčka</text><text x="310.0" y="255.0" class="s" text-anchor="middle" style="fill:#2563eb">2× rychleji</text><text x="540.0" y="255.0" class="s" text-anchor="middle" style="fill:#dc2626">2·3 = 6× rychleji</text><text x="195.0" y="205.0" class="s b" text-anchor="middle" style="fill:#2563eb">g′ = 2</text><text x="425.0" y="205.0" class="s b" text-anchor="middle" style="fill:#dc2626">f′ = 3</text><text x="20.0" y="295.0" class="s b f" style="animation-delay:1.8s">dy/dx = f′(u) · g′(x)    (vnější derivace v bodě vnitřku × vnitřní derivace)</text><text x="20.0" y="320.0" class="s f" style="animation-delay:2.3s">Příklad: y = (3x+1)⁵  →  u = 3x+1,  y′ = 5u⁴ · 3 = 15(3x+1)⁴</text></svg>